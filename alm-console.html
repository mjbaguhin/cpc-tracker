/* ---------- Listing Copy module ----------
   One row per active ASIN from copy.json (Buy Box Watch, nightly). Compares
   the live Amazon copy with the correct copy in Plytix: title, item
   highlight, bullets 1 to 5 and description. Generic keywords can't be read
   from Amazon, so they are checked against Amazon's rules instead. */
let LC = [], LC_META = {}, LC_ERR = '';
const LC_F = {show:'all', q:'', sort:'', dir:1, tier:'', group:false};
/* ---------- Rulebook screening ----------
   rules.json holds Amazon's listing rules and the two brand guides' rules,
   each with its source and the day it was last checked. Every day, when the
   modules load fresh data, the live Amazon copy and the correct copy in the
   Master SKU sheet are screened against it. Severity: amazon (Amazon rule),
   brand (our brand guide), guide (Amazon guidance, not a hard rule). */
let RB = null, RB_ERR = '';
function buildRb(j){ RB_ERR = ''; RB = j && Array.isArray(j.rules) ? j : null; if(!RB) RB_ERR = 'rules.json has no rules'; }
const RB_SEV = {amazon:['Amazon rule', 'lc-bad'], brand:['Brand guide', 'lc-small'], check:['Needs a check', 'lc-small'], guide:['Amazon guidance', 'lc-gray']};
function rbAgeDays(){ return RB && RB.verified ? Math.max(0, Math.floor((Date.now() - new Date(RB.verified + 'T00:00:00').getTime()) / 86400000)) : null; }
function rbStale(){ const a = rbAgeDays(); return a === null || a > ((RB && RB.recheckDays) || 30); }
const rbEsc = s=> String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function rbPhraseRe(w){
  // Whole words or phrases, any case. Symbols like #1 match as typed.
  const a = /^\w/.test(w) ? '(?<![\\w-])' : '', b = /\w$/.test(w) ? '(?![\\w-])' : '';
  return new RegExp(a + rbEsc(w).replace(/[ -]/g, '[ -]?') + b, 'i');
}
function rbBytes(t){ try { return new TextEncoder().encode(t).length; } catch(e){ return unescape(encodeURIComponent(t)).length; } }
/* One text against one rule. Returns a short finding, or '' when it passes. */
function rbTest(rule, text, ctx){
  let t = String(text || '');
  if(!t.trim()) return '';
  // The brand name is exempt from title rules (special characters, repeats)
  if(ctx.brand) t = t.replace(new RegExp(rbEsc(ctx.brand), 'gi'), ' ');
  (rule.except || []).forEach(x=>{ if(rule.kind === 'phrases') t = t.replace(rbPhraseRe(x), ' '); });
  switch(rule.kind){
    case 'maxChars': { const n = String(text).length; return n > rule.value ? `${n} characters, over ${rule.value}` : ''; }
    case 'maxBytes': { const n = rbBytes(String(text)); return n > rule.value ? `${n} bytes, over ${rule.value}` : ''; }
    case 'range': { const n = String(text).length; return n < rule.min ? `${n} characters, under ${rule.min}` : n > rule.max ? `${n} characters, over ${rule.max}` : ''; }
    case 'chars': { const hit = [...new Set([...t].filter(ch=> rule.value.indexOf(ch) !== -1))]; return hit.length ? 'Has ' + hit.join(' ') : ''; }
    case 'emoji': { const m = t.match(/\p{Extended_Pictographic}/gu); return m ? 'Has ' + [...new Set(m)].join(' ') : ''; }
    case 'regex': { const m = t.match(new RegExp(rule.value, rule.flags === undefined ? 'i' : rule.flags)); return m ? `Has \u201c${m[0]}\u201d` : ''; }
    case 'phrases': { const hit = (rule.words || []).filter(w=> rbPhraseRe(w).test(t));
      // Drop a word already covered by a longer phrase found ("sale" inside "on sale")
      // and spelling twins (food safe, food-safe) only once
      const nk = w=> w.toLowerCase().replace(/[ -]/g, '');
      const keep = hit.filter((w,i)=> !hit.some(o=> o !== w && o.length > w.length && nk(o) !== nk(w) && rbPhraseRe(w).test(o)) && hit.findIndex(o=> nk(o) === nk(w)) === i);
      return keep.length ? 'Uses ' + keep.map(w=> `\u201c${w}\u201d`).join(', ') : ''; }
    case 'repeat': { const ex = new Set((rule.except || []).map(x=> x.toLowerCase())), n = {};
      t.toLowerCase().split(/[^a-z0-9']+/).filter(Boolean).forEach(w=>{ if(ex.has(w) || /^\d+$/.test(w)) return; const k = w.length > 3 ? w.replace(/(es|s)$/, '') : w; n[k] = (n[k] || 0) + 1; });
      const over = Object.keys(n).filter(k=> n[k] > rule.value); return over.length ? 'Repeats ' + over.map(k=> `\u201c${k}\u201d ${n[k]} times`).join(', ') : ''; }
  }
  return '';
}
function rbFor(module, brand, name, mk){
  if(!RB) return [];
  mk = mk || MK2;
  return RB.rules.filter(r=> [].concat(r.module).indexOf(module) !== -1 && (!r.brand || r.brand === brand) && (!r.when || new RegExp(r.when, 'i').test(name || ''))
    && (!r.markets || r.markets.indexOf(mk) !== -1))
    // A rule confirmed for the US but not yet for Canada is a check in CA, not a break
    .map(r=> mk === 'CA' && r.caSev ? Object.assign({}, r, {sev: r.caSev, text: r.text + ' ' + (r.caNote || ''), sure: r.caSure || r.sure}) : r);
}
/* Listing Copy: every field, live and correct. Returns findings. */
const RB_FIELD = {title:'title', ih:'ih', b1:'bullet', b2:'bullet', b3:'bullet', b4:'bullet', b5:'bullet', gk:'gk', desc:'desc'};
function rbScreenLc(r){
  const out = [];
  if(!RB || !r.f) return out;
  const rules = rbFor('lc', r.brand, r.name, MK2), f = r.f;
  Object.keys(RB_FIELD).forEach(k=>{
    const x = f[k]; if(!x) return;
    const live = k === 'gk' || k === 'ih' ? '' : (x.s === 'match' ? (x.c || '') : (x.l || ''));
    const corr = x.c || '';
    rules.filter(ru=> ru.field && ru.field.indexOf(RB_FIELD[k]) !== -1).forEach(ru=>{
      const a = live ? rbTest(ru, live, {brand: r.brand}) : '', b = corr && corr !== live ? rbTest(ru, corr, {brand: r.brand}) : (live ? '' : rbTest(ru, corr, {brand: r.brand}));
      if(a || b) out.push({id: ru.id, sev: ru.sev, field: k, live: a, corr: corr === live ? a : b, same: corr === live && !!a, rule: ru});
    });
  });
  // At least three bullets, on Amazon and in Plytix
  rules.filter(ru=> ru.kind === 'minCount').forEach(ru=>{

/* Variation: theme rules per child, using its family */
function rbScreenVr(r, fam){

  const nt = t=> String(t || '').toLowerCase().replace(/[^a-z]/g, '').replace(/name$/, '').replace(/^colour$/, 'color')
    .replace(/^(numberofitems|itempackagequantity|packagequantity|unitcount|itemcount)$/, 'count').replace(/^itemshape$/, 'shape').replace(/^(modelnumber)$/, 'model');
  const mine = [r.exp.t1, r.exp.t2].filter(Boolean);

      if(off.length) out.push({id: ru.id, sev: ru.sev, field: 'theme', corr: `Theme ${off.join(' + ')}`, rule: ru});
    }
    if(ru.kind === 'sameTheme' && fam.length > 1){
      const key = x=> [x.exp.t1, x.exp.t2].filter(Boolean).map(nt).sort().join('+');
      const counts = {}; fam.forEach(x=> counts[key(x)] = (counts[key(x)] || 0) + 1);
      const main = Object.keys(counts).sort((a,b)=> counts[b] - counts[a])[0];
      const ex = fam.find(x=> key(x) === main);
      if(Object.keys(counts).length > 1 && key(r) !== main) out.push({id: ru.id, sev: ru.sev, field: 'theme', corr: `This child: ${mine.join(' + ') || 'none'}. Most siblings: ${[ex.exp.t1, ex.exp.t2].filter(Boolean).join(' + ') || 'none'}`, rule: ru});
    }
    if(ru.kind === 'uniqueValues' && fam.length > 1){
      const val = x=> [x.exp.v1, x.exp.v2].map(v=> String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '')).join('|');
      const twins = fam.filter(x=> x.asin !== r.asin && val(x) === val(r) && val(r).replace('|', ''));
      if(twins.length) out.push({id: ru.id, sev: ru.sev, field: 'value', corr: `Same values as ${twins.map(x=> x.sku).join(', ')}: ${[r.exp.v1, r.exp.v2].filter(Boolean).join(' / ')}`, rule: ru});

const rbUsd = v=> v === null || v === undefined || isNaN(v) ? 'n/a' : '$' + Number(v).toFixed(2);

function rbScreenRow(module, r){
  const out = [];

  rbFor(module, r.brand, r.name, module === 'cg' ? r.mk : MK2).forEach(ru=>{
    let msg = '', field = 'price';

      const ca = MK2 === 'CA', wm = ca ? (r.caSale || null) : rbWalmart(r.asin), top = Math.max(r.ours || 0, wm || 0);
      if(top && r.live > top + 0.01) msg = `List Price ${rbUsd(r.live)} is above our Amazon price ${rbUsd(r.ours)}${wm ? (ca ? ' and our CA Sale Price ' : ' and our Walmart price ') + rbUsd(wm) : ''}. Check customers paid ${rbUsd(r.live)} recently, or lower it.`;
    }

    }

      msg = `Our price ${rbUsd(r.ours)} is above Amazon\u2019s threshold ${rbUsd(r.cpt)}.`;

      msg = `Star rating ${Number(r.cur).toFixed(1)} with ${r.rev === null ? 'unknown' : Number(r.rev).toLocaleString('en-US')} ratings, under ${ru.value.toFixed(1)}.`; }

/* Words in one text that are not in the other, marked */
function lcMark(text, other, cls){
  const bag = {};
  String(other || '').toLowerCase().split(/\s+/).forEach(w=>{ const k = w.replace(/[^\w%$]/g, ''); bag[k] = (bag[k] || 0) + 1; });
  return String(text || '').split(/(\s+)/).map(w=>{
    if(/^\s+$/.test(w)) return w;
    const k = w.toLowerCase().replace(/[^\w%$]/g, '');
    if(!k) return esc(w);
    if(bag[k]){ bag[k]--; return esc(w); }
    return `<mark class="${cls}">${esc(w)}</mark>`;
  }).join('');
}

function openLc(r){
  const d = document.getElementById('detail');
  const block = (c)=>{
    const x = r.f[c[0]] || {s:'none'};
    if(x.s === 'none') return '';
    const st = LC_S[x.rule && x.s !== 'rule' && x.s !== 'rulesok' ? 'rule' : x.s] || LC_S.none;
    const showLive = x.l && x.s !== 'match';
    return `<div class="lcf"><div class="lcf-h"><b>${c[1]}</b> ${lcChip(x)}`+
      (x.c ? ` <button class="work" data-copy="${c[0]}">Copy correct</button>` : '')+'</div>'+
      (x.rule ? `<div class="lcf-r">${esc(x.rule)}</div>` : '')+
      (c[0] === 'gk' && x.c ? `<div class="lcf-r" style="color:var(--muted)">${x.bytes} of 249 bytes${x.dup ? `, ${x.dup} word${x.dup > 1 ? 's' : ''} already in the title or bullets` : ''}</div>` : '')+
      (x.c ? `<div class="lcf-l">Correct (Plytix)</div><div class="lcf-t">${showLive ? lcMark(x.c, x.l, 'lc-miss') : esc(x.c)}</div>` : '')+
      (showLive ? `<div class="lcf-l">Live on Amazon</div><div class="lcf-t">${lcMark(x.l, x.c, 'lc-extra')}</div>` : '')+
      (x.s === 'small' || x.s === 'wrong' ? `<div class="lcf-r" style="color:var(--muted)">${Math.round((x.sim || 0) * 100)}% of the words match</div>` : '')+
    '</div>';
  };
  d.innerHTML =
    '<h2>Listing Copy</h2>'+
    `<h3>${skuL(r.sku, MK2)} ${esc(r.name)}</h3>`+
    '<dl>'+
      `<dt>ASIN</dt><dd class="mono">${asinL(r.asin, MK2)}${cpy(r.asin)}</dd>`+
      `<dt>Correct %</dt><dd class="${r.allOk ? 'ok' : 'warn'}">${r.pct === null ? '\u2014' : r.pct + '%'}${r.checked ? ` (${r.ok} of ${r.checked} fields)` : ''}</dd>`+
      `<dt>To fix</dt><dd>${r.bad.length ? esc(r.bad.map(k=> LC_COLS.find(c=> c[0] === k)[1]).join(', ')) : 'Nothing'}</dd>`+
      `<dt>Last change</dt><dd>${r.since ? esc(shortDate(r.since)) : 'No change seen'}${r.liveChecked ? ', checked ' + esc(shortDate(r.liveChecked)) : ''}</dd>`+
    '</dl>'+
    '<div class="lcleg"><mark class="lc-miss">yellow</mark> = in Plytix, not on Amazon. <mark class="lc-extra">red</mark> = on Amazon, not in Plytix.</div>'+
    rbBlock(r.rb)+
    LC_COLS.map(block).join('')+
    '<div class="act-row">'+
      `<a class="work" href="https://www.amazon.${MK2 === 'CA' ? 'ca' : 'com'}/dp/${esc(r.asin)}" target="_blank" rel="noopener">Open on Amazon</a>`+
      `<a class="work" href="https://sellercentral.amazon.${MK2 === 'CA' ? 'ca' : 'com'}/myinventory/inventory?searchTerm=${encodeURIComponent(r.sku)}" target="_blank" rel="noopener">Open in Seller Central</a>`+
    '</div>'+
    '<div class="why">Live copy from Keepa\u2019s last check. Correct copy from Plytix. Generic keywords are backend only, so they are checked against Amazon\u2019s rules, not compared.</div>';
  [...d.querySelectorAll('button[data-copy]')].forEach(b=> b.onclick = ()=>{
    const t = (r.f[b.dataset.copy] || {}).c || '';
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(()=> b.textContent = 'Copied').catch(()=> window.prompt('Copy this text:', t));
  });
  document.getElementById('veil').hidden = false;
}

function lpRows(){
  return CPT.map(c=>{
    const row = (c.sku && ROWS.find(x=> x.sku === c.sku)) || ROWS.find(x=> x.asin === c.asin);
    const live = c.kList !== undefined && c.kList !== null ? c.kList : null;
    return {asin:c.asin, sku:c.sku || (row && row.sku) || '', name:(row && row.name) || c.name || c.asin,
      tier:(row && row.tier) || '', live, ours:c.kOurs !== undefined ? c.kOurs : null, set: live !== null, date:c.date || '',
      brand:(row && row.brand) || '', caSale: c.caSale};
  }).map(r=> Object.assign(r, {rb: rbScreenRow('lp', r)}));
}

/* ---------- Category module (Oct 2026 rebuild) ----------
   Five checks per listing, US and Canada, from category.json (Category
   Watch, nightly): GL, Product Type, full path, ITK and browse node. The
   live value is from Keepa (and for the US GL, Sam's FBA report). The
   correct value is from the Master SKU sheet. */
let CG = [], CG_META = {}, CG_ERR = '', CG_VIEW = [];
const CG_F = {show:'all', q:'', sort:'', dir:1, tier:'', mk:'US', group:false};
const CG_COLS = [['gl','GL'], ['pt','Product Type'], ['sd','Search dept'], ['path','Full path'], ['itk','ITK'], ['node','Browse node']];
const CG_S = {
  match:    ['OK', 'lc-ok', 'Same as the Master SKU sheet'],
  leaf:     ['Last level OK', 'lc-small', 'The last level matches, the levels above it differ'],
  wrong:    ['Wrong', 'lc-bad', 'Different from the Master SKU sheet'],
  missing:  ['Missing on Amazon', 'lc-bad', 'Amazon has no value'],
  blank:    ['Blank in Master SKU', 'lc-gray', 'No correct value in the Master SKU sheet'],
  unknown:  ['Can\u2019t check', 'lc-gray', 'Amazon\u2019s value has no name in the list yet'],
  nomaster: ['\u2014', 'lc-none', 'The Master SKU sheet has no CA ITK column'],
  nodata:   ['Not checked yet', 'lc-gray', 'No live data from Amazon yet']
};
const CG_BAD = ['wrong', 'leaf', 'missing'];
const CG_SHARED_NOTE = 'Same browse node as the Master SKU sheet. This node sits under more than one path, and Amazon shows it under a different one. Amazon treats the two paths as the same, so this counts as correct. No case needed.';
const CG_CASE = {gl:'GL', pt:'Product Type', path:'Category Path', itk:'ITK', node:'Category Path'};

function buildCg(j){ CG_ERR = ''; CG_META = {updated: j && j.updated || '', pcUrl: j && j.pagecheckUrl || ''}; CG = (j && j.rows) || []; }
/* Page checks: MJ looked at the product page. Saved to the "Page Checks" tab
   of the Reference Pricing sheet through the Keepa Fetcher web app; this
   browser keeps a copy only until the next category.json has it. */
const PC_KEY = 'cpc-page-check';
function pcLocal(){ try { return JSON.parse(localStorage.getItem('cg_pagechecks') || '{}'); } catch(e){ return {}; } }
function pcOf(r){
  const loc = pcLocal()[r.mk + '|' + r.asin];
  if(loc && (!r.page || loc.d > r.page.d)) return loc.res === 'clear' ? null : Object.assign({local:true}, loc);
  return r.page || null;
}
function pcSave(r, res, note){
  const d = new Date().toISOString().slice(0, 16).replace('T', ' ');
  try { const all = pcLocal(); all[r.mk + '|' + r.asin] = {d, res, note: note || ''}; localStorage.setItem('cg_pagechecks', JSON.stringify(all)); } catch(e){}
  if(CG_META.pcUrl){
    const q = new URLSearchParams({action:'pagecheck', key:PC_KEY, mk:r.mk, sku:r.sku, asin:r.asin, res, note: note || ''});

/* ---------- Category case drafts (chat first, then call, then case form) ----------
   One listing or many. A listing with a case on file gets a follow-up that
   names the case and answers Amazon's last note. Values come from the
   Master SKU sheet (correct) and Keepa (live), never guessed. */
const CG_LABEL = {gl:'GL', pt:'Product Type', sd:'Search department', path:'Browse path', itk:'Item type keyword', node:'Browse node'};
function cgCaseInfo(r){
  // Live only: the case number and Amazon's latest reply come from Gmail (Category Watch)
  const k = r.kase;
  return k && k.id ? {id:k.id, date:k.replyDate || k.d, notes:k.reply || '', link:k.link || '', kind:k.kind || ''} : null;
}
function cgFixLine(r, k){
  const x = r.c[k], ex = r.c;
  if(k === 'node' || k === 'path'){
    const node = ex.node && ex.node.e ? ex.node.e : '', path = ex.path && ex.path.e ? ex.path.e : '';
    const now = ex.path && ex.path.a ? ex.path.a : '', nowNode = ex.node && ex.node.a ? ex.node.a : '';
    return `It is in ${now || 'the wrong category'}${nowNode ? ' (node ' + nowNode + ')' : ''}. The correct one is ${path}${node ? ', browse node ' + node : ''}.`;
  }
  return `${CG_LABEL[k]}: it shows ${x.a || 'nothing'}. The correct value is ${x.e}.`;
}
function cgFacts(r){
  const f = [];
  if(r.c.pt && r.c.pt.e) f.push('product type ' + r.c.pt.e);
  if(r.c.itk && r.c.itk.e) f.push('item type keyword ' + r.c.itk.e);
  return f.length ? ' (' + f.join(', ') + ')' : '';
}
const CG_MAX_ASINS = 5;   // Amazon chat support (MJ, Oct 2026): 5 ASINs per case; for a family give the parent
const leafName = p=> String(p || '').split(/\s*[›>]\s*/).filter(Boolean).pop() || '';
/* The correct values for one listing, everything a catalog specialist asks
   for: GL, product type, search department, ITK, browse node, browse path.
   All from the Master SKU sheet. */
function cgCorrect(r){
  const e = r.exp || {}, c = r.c || {};
  return {gl: e.gl || (c.gl || {}).e || '', pt: e.pt || (c.pt || {}).e || '', sd: e.sd || '',
          itk: e.itk || (c.itk || {}).e || '', node: e.node || (c.node || {}).e || '', path: e.path || (c.path || {}).e || ''};
}
function cgCorrectLines(v){
  return [v.gl && `GL: ${v.gl}`, v.pt && `Product type: ${v.pt}`, v.itk && `Item type keyword: ${v.itk}`,
          v.sd && `Search department: ${v.sd}`, v.node && `Browse node: ${v.node}`, v.path && `Browse path: ${v.path}`].filter(Boolean).join('\n');
}
/* What Amazon shows now, only the parts that are wrong, plus the GL we cannot see */
function cgNowLines(rows){
  const r = rows[0], c = r.c || {}, L = [];
  if(c.node && c.node.a && c.node.s !== 'match') L.push(`Browse node: ${c.node.a}`);
  if(c.path && c.path.a && c.path.s !== 'match') L.push(`Browse path: ${c.path.a}`);
  if(c.pt && c.pt.s === 'wrong') L.push(`Product type: ${c.pt.a}`);
  if(c.sd && c.sd.s === 'wrong') L.push(`Search department: ${c.sd.a}`);
  if(c.itk && (c.itk.s === 'wrong' || c.itk.s === 'missing')) L.push(`Item type keyword: ${c.itk.a || 'none'}`);
  if(c.gl && c.gl.s === 'wrong') L.push(`GL: ${c.gl.a}`);
  return L.join('\n');
}
function cgPitch(list){
  const mk = list[0].mk, site = mk === 'CA' ? 'amazon.ca' : 'amazon.com';
  const one = list.length === 1 ? list[0] : null;
  const allRows = cgRows(mk);
  const cases = list.map(cgCaseInfo).filter(Boolean);
  const caseIds = [...new Set(cases.map(c=> c.id))];
  const sharedNodes = new Set(allRows.filter(r=> r.c && r.c.path && r.c.path.shared).map(r=> String(r.c.node.e)));
  const glSeen = list.some(r=> r.c && r.c.gl && (r.c.gl.s === 'match' || r.c.gl.s === 'wrong'));
  const ifSay = [], chat = [];
  // Which problems this request is about. Path and node wording only when the path or node is wrong.
  const kinds = new Set(list.flatMap(r=> r.bad));
  const pathish = kinds.has('path') || kinds.has('node');
  const deptish = kinds.has('sd') || kinds.has('gl');

  // Families: the parent for this marketplace, with the children in this request
  const fam = {};
  list.forEach(r=>{ const p = parentOf(r), k = p.pasin || ('solo:' + r.asin); (fam[k] = fam[k] || {p, rows:[]}).rows.push(r); });
  const famKeys = Object.keys(fam), parents = famKeys.filter(k=> !k.startsWith('solo:'));
  const useParents = list.length > CG_MAX_ASINS;
  const kids = rows=> rows.map(r=> `${r.asin} (SKU ${r.sku})`).join('\n');

  // Groups that need the same correct values
  const groups = {};
  list.forEach(r=>{ const v = cgCorrect(r), k = JSON.stringify(v) + '|' + cgNowLines([r]); (groups[k] = groups[k] || {v, rows:[]}).rows.push(r); });
  const gKeys = Object.keys(groups);

  // 1. Who and what
  const brand = list[0].brand || 'Barnyard Designs';
  chat.push(`Hi, I'm MJ from ${brand}, the brand owner. I need a category correction on ${site} for ` +
    (one ? `ASIN ${one.asin} (SKU ${one.sku}), ${one.name}` :
     useParents ? `${list.length} child ASINs in ${parents.length === 1 ? 'one variation family' : parents.length + ' variation families'}` :
     `${list.length} ASINs`) + '. The details are below.');

  // 2. Parent and children
  const famLine = k=> k.startsWith('solo:')
    ? `Standalone ASIN ${fam[k].rows[0].asin} (SKU ${fam[k].rows[0].sku}), no parent`
    : `Parent ASIN ${k}, parent SKU ${fam[k].p.psku || 'n/a'} (${fam[k].p.pname || 'variation family'}): ${fam[k].rows.length} ${fam[k].rows.length === 1 ? 'child' : 'children'} in this request`;
  if(!one || parents.length){
    chat.push((parents.length > 1 ? 'Variation families:\n' : parents.length ? 'Variation family:\n' : 'ASINs:\n') + famKeys.map(k=> famLine(k) + (useParents ? '' : '\n' + kids(fam[k].rows))).join('\n\n'));
    if(useParents) parents.forEach(k=> ifSay.push([`"Please send the list of children for ${k}."`, kids(fam[k].rows).replace(/\n/g, ', ')]));
    if(famKeys.length > CG_MAX_ASINS) ifSay.unshift(['Before you start', `This is ${famKeys.length} parents or ASINs. Amazon chat takes ${CG_MAX_ASINS} per case, so split it into ${Math.ceil(famKeys.length / CG_MAX_ASINS)} cases.`]);
  }

  // 3. Correct values, and what the pages show now, per group
  gKeys.forEach(k=>{
    const g = groups[k];
    const gPar = [...new Set(g.rows.map(r=> parentOf(r).pasin || ''))];
    const label = gKeys.length === 1 ? (one ? '' : ' for every ASIN in this request')
      : gPar.length === 1 && gPar[0] && fam[gPar[0]] && fam[gPar[0]].rows.length === g.rows.length ? ` for the children of parent ${gPar[0]}`
      : ` for ${g.rows.map(r=> r.sku).join(', ')}`;
    chat.push(`Correct category${label} (from our catalog):\n` + cgCorrectLines(g.v));
    const now = cgNowLines(g.rows);
    const seen = g.rows.every(r=>{ const k = pcOf(r); return k && k.res === 'wrong' && !k.stale; });
    if(now) chat.push((seen ? `What ${one ? 'the page shows' : 'the pages show'} now (checked):\n` : `What our category data shows now:\n`) + now);
  });
  if(!glSeen) chat.push(`Please also confirm the GL on ${one ? 'this ASIN' : 'these ASINs'} is ${[...new Set(list.map(r=> cgCorrect(r).gl).filter(Boolean))].join(' / ') || 'correct'}. We cannot see the GL on our side.`);

  // 4. Shared node and earlier cases
  const node0 = cgCorrect(list[0]).node;
  const stopAt = leafName((list[0].c.path || {}).a) || 'the wrong category';
  const saidOk = pathish && cases.some(c=> /already|correct|tied to|redirect|shared/i.test(c.notes || ''));
  const prev = !caseIds.length ? '' : !pathish
    ? ` We contacted you about ${one ? 'this ASIN' : 'these ASINs'} before on case${caseIds.length > 1 ? 's' : ''} ${caseIds.join(' and ')}.`
    : saidOk
    ? ` On case${caseIds.length > 1 ? 's' : ''} ${caseIds.join(' and ')} your team said the node was correct, but the page${one ? '' : 's'} still ${one ? 'stops' : 'stop'} at ${stopAt}.`
    : ` This was raised before on case${caseIds.length > 1 ? 's' : ''} ${caseIds.join(' and ')}, and the page${one ? '' : 's'} still ${one ? 'stops' : 'stop'} at ${stopAt}.`;
  if(pathish && sharedNodes.has(String(node0)))
    chat.push(`We understand browse node ${node0} is shared and the page can show a different path for it. That is fine. The problem is ${one ? 'this ASIN is' : 'these ASINs are'} not in node ${node0} at all.` + prev);
  else if(prev) chat.push(prev.trim());

  // Children of the same family that are already right: proof the values work
  famKeys.filter(k=> !k.startsWith('solo:')).forEach(k=>{
    // Only siblings with the SAME correct values are proof (pumpkin and pea differ)
    const fine = allRows.filter(x=> parentOf(x).pasin === k && list.indexOf(x) === -1 && x.c && !x.bad.length && x.c.node && x.c.node.s === 'match' && JSON.stringify(cgCorrect(x)) === JSON.stringify(cgCorrect(fam[k].rows[0])));
    const named = fine.slice(0, 3).map(x=> `${x.asin} (SKU ${x.sku})`).join(', ') + (fine.length > 3 ? `, and ${fine.length - 3} more` : '');
    if(fine.length) chat.push(`In the same family, ${named} ${fine.length === 1 ? 'already has' : 'already have'} these values and ${fine.length === 1 ? 'shows' : 'show'} correctly. Please match the others to ${fine.length === 1 ? 'it' : 'them'}.`);
  });

  // 5. The ask
  chat.push(`Please send this to the catalog team to update ${one ? 'this ASIN' : useParents ? 'all the children listed' : 'these ASINs'} to the values above, add these notes to a case, and send me the case number.`);

  ifSay.push(['"It is assigned based on the detail page and how customers find products."', 'The product type, item type keyword and browse node in our catalog all point to the correct category. Please escalate to the catalog team for a manual review.']);
  if(pathish) ifSay.push(
    ['"Please use the browse node tool."', 'I would rather the catalog team makes the change, so the listing is not locked by repeated tool requests.'],
    ['"It is already tied to the correct node."', `The live page still shows ${stopAt}. Please check the browse node the detail page uses, not only the backend value.`]);
  if(deptish){
    const gls = [...new Set(list.map(r=> cgCorrect(r).gl).filter(Boolean))].join(' / ');
    const sds = [...new Set(list.map(r=> cgCorrect(r).sd).filter(Boolean))].join(' / ');
    ifSay.push(['"The search department cannot be changed." or "We cannot change the GL."',
      `Please send it to the catalog team for a manual review. Our catalog says the GL should be ${gls || 'the one above'}${sds ? ' and the search department ' + sds : ''}. They can check the GL and product group on ${one ? 'this ASIN' : 'these ASINs'}.`]);
  }
  ifSay.push(['"Please upload a flat file."', 'Download flat file values in the Category module, make a PartialUpdate, then come back with the processing report if it does not change.']);

  const call = ['BEFORE THE CALL', `Have open: ${caseIds.length ? 'case ' + caseIds.join(', ') + ', ' : ''}this page, and the children list.`, '',
    '1. SAY WHO YOU ARE', `"${chat[0].replace("Hi, I'm MJ", 'Hi, my name is MJ Baguhin, calling')}"`, '',
    '2. GIVE THE DETAILS', ...chat.slice(1, -1).map(m=> '"' + m.replace(/\n/g, '; ') + '"'), '',
    '3. MAKE THE ASK', `"${chat[chat.length - 1]}"`, '',
    '4. BEFORE YOU HANG UP', 'Ask for the case number and the agent\u2019s name. Write them down.', '',
    'IF THEY SAY...', ...ifSay.map(x=> `${x[0]}\n   Say: "${x[1]}"`)].join('\n');

  // Case form: everything in one place, children always listed in full
  const body = [`I am requesting a category correction on the ${mk} marketplace for ${brand}, where we are the brand owner.`, '',
    ...famKeys.flatMap(k=> [famLine(k) + ':', kids(fam[k].rows), '']),
    ...gKeys.flatMap(k=> { const g = groups[k], now = cgNowLines(g.rows);
      return [`Correct category${gKeys.length > 1 ? ' for ' + g.rows.map(r=> r.sku).join(', ') : ''}:`, cgCorrectLines(g.v), '', ...(now ? [(g.rows.every(r=>{ const k = pcOf(r); return k && k.res === 'wrong' && !k.stale; }) ? 'What the detail page shows now (checked):' : 'What our category data shows now:'), now, ''] : [])]; }),
    ...chat.slice(2 + gKeys.length * 2, -1).filter(m=> !/^Correct category|^What the page/.test(m)).flatMap(m=> [m, '']),
    `Could you please update ${one ? 'this ASIN' : 'these ASINs'} to the values above and confirm once the change has been applied?`, '',
    'Thank you,', 'MJ Baguhin', `${brand}, Cross Path Capital LLC`].join('\n').replace(/\n{3,}/g, '\n\n');
  const clean = t=> noDash(String(t));
  return {chat:chat.map(clean), call:clean(call), ifSay:ifSay.map(x=> [x[0], clean(x[1])]), cid:caseIds[caseIds.length - 1] || '', read:null,
          body:clean(body), subject: clean(`Category correction: ${one ? one.asin + ' (' + one.sku + ')' : parents.length ? parents.map(k=> 'parent ' + k).join(', ') : list.length + ' ASINs'} on ${site}`), follow: !!caseIds.length};
}
function cgFamilyRows(key, mk){
  return cgRows(mk).filter(r=>{ const p = parentOf(r); return (p.pasin && p.pasin === key) || (!p.pasin && p.psku === key); }).filter(r=> r.bad.length);
}
function cgDraft(list){
  list = list.filter(r=> r.bad.length);
  if(!list.length) return;
  const P = cgPitch(list);
  showDraft(list.length === 1 ? `${list[0].sku} ${list[0].name}` : `${list.length} listings, ${list[0].mk}`, P.body,
    {follow:P.follow, subject:P.subject, caseId:P.cid, rows:[], pitch:P});
}

/* ---------- Group by parent and Download, shared by the modules ---------- */
function parentOf(r){
  // Category rows carry their own marketplace parent (CA families differ from US)
  if(r.par && (r.par.pasin || r.par.psku)) return {psku: r.par.psku || '', pasin: r.par.pasin || '', pname: r.par.pname || ''};
  const row = (r.sku && ROWS.find(x=> x.sku === r.sku)) || ROWS.find(x=> x.asin === r.asin) || {};
  return {psku: row.psku || '', pasin: row.pasin || '', pname: row.parent || ''};
}
// Rows stay in their sorted order; each parent family gets a violet band on top
/* Stock for any module row: BigQuery numbers from the ALM Console Data sheet */
function stockOf(r, mk){
  const row = (r.usSku && ROWS.find(x=> x.sku === r.usSku)) || ROWS.find(x=> x.sku === r.sku) || ROWS.find(x=> x.asin === r.asin);
  if(!row) return null;
  const v = mk === 'CA' ? row.caAvail : row.usAvail;
  return v === undefined || v === '' ? null : v;
}
function stockTd(r, mk){
  const v = stockOf(r, mk), st = stockStatus(mk);
  if(v === null) return `<td class="num"><span class="mut" title="${st ? esc(st.text) : 'No stock data for this SKU'}">No data</span></td>`;
  return `<td class="num">${v > 0 ? '<b>' + v.toLocaleString() + '</b>' : '<span class="bbno">Out of stock</span>'}</td>`;
}
function grpMap(F, rows, ncols, trFn, needFn, needLabel, mk, headBtn){
  if(!F.group) return rows.map(trFn).join('');
  const order = [], g = {};
  rows.forEach(r=>{ const p = parentOf(r), k = p.psku || '\u0000solo'; if(!g[k]){ g[k] = {p, rows:[]}; order.push(k); } g[k].rows.push(r); });
  // Families with problems first, then the rest, then listings with no parent
  order.sort((a,b)=> (a === '\u0000solo') - (b === '\u0000solo') || g[b].rows.filter(needFn).length - g[a].rows.filter(needFn).length);
  return order.map(k=>{
    const G = g[k], solo = k === '\u0000solo', need = G.rows.filter(needFn).length;
    const bits = [];
    if(!solo){
      bits.push(`<span><span class="k">Parent SKU</span><span class="mono">${skuL(G.p.psku, mk)}</span>${cpy(G.p.psku)}</span>`);
      if(G.p.pasin) bits.push(`<span><span class="k">Parent ASIN</span>${asinL(G.p.pasin, mk)}${cpy(G.p.pasin)}</span>`);
    }
    bits.push(`<span><b>${G.rows.length}</b> ${solo ? 'listing' + (G.rows.length === 1 ? '' : 's') : 'children'}</span>`);
    bits.push(need ? `<span class="pgh-tag bad">${need} ${needLabel}</span>` : '<span class="pgh-tag ok">All OK</span>');
    if(headBtn && !solo && need) bits.push(headBtn(G.p));
    return `<tr class="gh pgh${solo ? ' solo' : ''}"><td colspan="${ncols}"><div class="pgh-name">${solo ? '\u25a0 No parent' : '\u25bc ' + esc(G.p.pname || G.p.psku)}</div><div class="pgh-meta">${bits.join('')}</div></td></tr>` +
      G.rows.map(trFn).join('');
  }).join('');
}
function grpBtn(F){ return `<button data-grp="1" aria-pressed="${!!F.group}">Group by parent</button>`; }
function dlBtns(extra){ return '<button data-dl="1">Download</button>' + (extra || ''); }
function wireGrpDl(v, F, rerender, dlFn, extraFn){
  const g = v.querySelector('button[data-grp]');
  if(g) g.onclick = ()=>{ F.group = !F.group; rerender(); };
  const d = v.querySelector('button[data-dl]');
  if(d) d.onclick = dlFn;
  const x = v.querySelector('button[data-dlx]');
  if(x && extraFn) x.onclick = extraFn;
}
function csvSave(name, head, rows){
  const q = v=> { const t = v === null || v === undefined ? '' : String(v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const out = '\ufeff' + [head].concat(rows).map(r=> r.map(q).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type:'text/csv;charset=utf-8'}));
  a.download = name + '-' + todayStr() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
}
const withParent = (r, cells)=>{ const p = parentOf(r); return cells.concat([p.psku, p.pasin]); };

/* What each module downloads: exactly the rows on screen, after filters */

    rows.map(r=> withParent(r, [r.sku, r.asin, r.name, r.tier, r.has ? 'Yes' : 'No', r.why ? (BB_WHY[r.why] || {}).t : '', r.next, r.us, r.ca, r.ours, r.bb,
      (r.others || []).join('; '), r.win ? Math.round(r.win.d30) : '', r.win ? Math.round(r.win.d7) : ''])));

function lcVal(x, side){ if(!x) return ''; if(side === 'c') return x.c || ''; return x.l !== undefined ? x.l : (x.s === 'match' ? (x.c || '') : ''); }
function dlLc(rows){

function dlLp(rows){

function cgCells(r){
  const cells = [r.mk, r.sku, r.asin, `https://www.amazon.${r.mk === 'CA' ? 'ca' : 'com'}/dp/${r.asin}`, r.name, r.tier, stockOf(r, r.mk), r.pct];
  CG_COLS.forEach(c=>{ const x = (r.c || {})[c[0]] || {}; cells.push(x.shared ? 'OK, shared node (same browse node, Amazon shows another path; no case needed)' : x.inNode ? 'OK, correct node (Keepa reports another path; check the page)' : (CG_S[x.s] || [x.s || ''])[0], x.e || '', x.a || ''); });
  const ci = cgCaseInfo(r); cells.push(ci ? ci.id : '', ci ? ci.notes : '');
  return cells;
}
function cgHead(){
  const h = ['Market','SKU','ASIN','Amazon link','Product','Tier','Stock','Correct %'];
  CG_COLS.forEach(c=> h.push(c[1] + ' check', c[1] + ' correct (Master SKU)', c[1] + ' on Amazon'));

}
function dlCg(rows){ csvSave('category-' + CG_F.mk.toLowerCase(), cgHead().concat(['Parent SKU','Parent ASIN']), rows.map(r=> withParent(r, cgCells(r)))); }
// Category plus the listing copy, so an AI can look for words that pull the listing into the wrong category
function cgAiText(r){
  const L = ((LC.find(x=> x.asin === r.asin) || {}).f) || {};
  const c = r.c || {}, site = r.mk === 'CA' ? 'amazon.ca' : 'amazon.com';
  const v = (k, side)=> lcVal(L[k], side);
  const lines = [
    'Please check this Amazon listing copy for words or phrases that could make Amazon place the product in the wrong category, and tell me which ones to change.', '',
    `ASIN: ${r.asin} (${site})`, `Link: https://www.${site}/dp/${r.asin}`, `SKU: ${r.sku}`, '',
    `Correct category (where it belongs): ${(c.path || {}).e || ''}${(c.node || {}).e ? ', browse node ' + c.node.e : ''}`,
    `Product type: ${(c.pt || {}).e || ''}. Item type keyword: ${(c.itk || {}).e || ''}`,
    `Where Amazon has it now: ${(c.path || {}).a || ''}${(c.node || {}).a ? ', browse node ' + c.node.a : ''}`, '',
    `Title: ${v('title', 'l') || v('title', 'c')}`
  ];
  ['b1','b2','b3','b4','b5'].forEach((k,i)=>{ const t = v(k, 'l') || v(k, 'c'); if(t) lines.push(`Bullet ${i + 1}: ${t}`); });
  const d = v('desc', 'l') || v('desc', 'c'); if(d) lines.push(`Description: ${d}`);
  const gk = v('gk', 'c'); if(gk) lines.push(`Backend search terms: ${gk}`);
  if(!LC.length || !LC.find(x=> x.asin === r.asin)) lines.push('', '(Listing copy not loaded yet for this ASIN.)');
  return lines.join('\n');
}

function dlCgCopy(rows){

  {t:'Variation family out of step', sure:'Reported by one seller, not confirmed by Amazon',

  {t:'Amazon merged or split a category, or another seller changed it', sure:'Reported by agencies',

   do:'If many listings moved on the same day, it is likely a category change on Amazon\u2019s side. Mention the date in the case.', src:[['Seller Candy', 'https://sellercandy.com/amazon-browse-nodes-brand-not-showing-search']]}
];
const CG_HOWTO = [
  'Look at the category links at the top of the Amazon page. Note where they stop.',
  'Try a flat file Partial Update first. Click Download flat file values below, then in Seller Central go to Catalog, Add Products via Upload, and download the inventory file for the product type. Copy the values into the matching columns, keep update_delete as PartialUpdate (it only changes the columns you fill), upload, and read the processing report.',
  'In Seller Central Get Help, pick "Change a product\u2019s category browse node", or chat with Seller Support. Use Draft case here.',
  'Give the exact node number, the full path, the product type and the ITK. Say you are not asking to change the display path when the node is shared.',
  'Ask for the catalog team. Do not run the browse node tool again and again: sellers report it can lock the listing.',
  'Write down the case number, then check the category again in 3 to 5 days.'
];
function dlCgFlat(rows){
  const list = rows.filter(r=> r.bad.length);
  csvSave('category-flat-file-values-' + CG_F.mk.toLowerCase(),
    ['item_sku (Seller SKU)', 'update_delete', 'feed_product_type (Product Type)', 'item_type_keyword (Item Type Keyword)', 'recommended_browse_nodes (Browse Node)',
     'ASIN', 'Marketplace', 'Correct path (for checking)', 'Where Amazon has it now', 'What is wrong'],
    list.map(r=>{ const c = r.c || {};
      return [r.sku, 'PartialUpdate', (c.pt || {}).e || '', (c.itk || {}).e || '', (c.node || {}).e || '', r.asin, r.mk === 'CA' ? 'amazon.ca' : 'amazon.com',
        (c.path || {}).e || '', [(c.path || {}).a, (c.node || {}).a ? 'node ' + c.node.a : ''].filter(Boolean).join(', '),
        r.bad.map(k=> CG_COLS.find(x=> x[0] === k)[1]).join(', ')]; }));
}

    '<div class="why">Flat file steps checked against Amazon\u2019s Product Type Definitions guide (item_type_keyword, recommended_browse_nodes) and seller guides on PartialUpdate. Amazon does not publish why a listing moves. These are the reasons we could check: from Amazon\u2019s replies on our own cases, and from sellers and agencies.</div>';

/* ---------- Variation module ----------
   Per child, US and Canada, from variation.json (Variation Watch, daily):
   in the right family, theme, value, and (US) reviews shared with siblings.
   Correct values: the Master SKU sheet. Amazon side: Keepa, as Keepa sees it.
   Per family: ASINs in the family on Amazon that are not active in the
   Master SKU sheet. */
let VR = [], VR_FAMS = [], VR_META = {}, VR_ERR = '', VR_VIEW = [];
const VR_F = {show:'all', q:'', sort:'', dir:1, tier:'', mk:'US', group:false};
// Theme and value checks are off for now (MJ, Oct 22). Set VR_TV to true to bring them back.
const VR_TV = false;
const VR_COLS = VR_TV ? [['fam','Family'], ['theme','Theme'], ['value','Value'], ['rev','Reviews shared']] : [['fam','Family'], ['rev','Reviews shared']];
const VR_S = {
  match:   ['OK', 'lc-ok', 'Same as the Master SKU sheet'],
  wrong:   ['Wrong', 'lc-bad', 'Different from the Master SKU sheet'],
  split:   ['Split off', 'lc-bad', 'Not in its family on Amazon'],
  na:      ['\u2014', 'lc-none', 'Not needed for this listing'],
  blank:   ['Blank in Master SKU', 'lc-gray', 'No correct value in the Master SKU sheet'],
  unknown: ['Can\u2019t check', 'lc-gray', 'No live value to compare'],
  nodata:  ['Not checked yet', 'lc-gray', 'No live data from Amazon yet']
};
const VR_BAD = ['wrong', 'split'];
const VR_LABEL = {fam:'Family', theme:'Variation theme', value:'Variation value', rev:'Review sharing'};

function buildVr(j){
  VR_ERR = '';
  VR_META = {updated: j && j.updated || '', revFrom: j && j.reviewsFrom || '', revErr: j && j.reviewsError || ''};
  VR = (j && j.rows) || []; VR_FAMS = (j && j.families) || [];
}
function vrFam(mk, pasin){ return VR_FAMS.find(f=> f.mk === mk && f.pasin === pasin) || null; }
function vrRows(mk){
  return VR.filter(r=> r.mk === (mk || VR_F.mk)).map(r=>{
    const row = ROWS.find(x=> x.asin === r.asin);
    const c = r.c || {};
    const bad = VR_COLS.filter(x=> c[x[0]] && VR_BAD.indexOf(c[x[0]].s) !== -1).map(x=> x[0]);
    const blank = VR_COLS.filter(x=> c[x[0]] && c[x[0]].s === 'blank').map(x=> x[0]);
    const core = bad.filter(k=> k !== 'rev');
    const fam = r.exp && r.exp.pasin ? VR.filter(x=> x.mk === r.mk && x.exp && x.exp.pasin === r.exp.pasin) : [];
    const rb = rbScreenVr(r, fam).filter(h=> VR_TV || h.id === 'vr-share');
    if(!VR_TV && r.c){
      const fs = r.c.fam ? r.c.fam.s : '';
      r = Object.assign({}, r, fs === 'match' ? {checked:1, ok:1, pct:100} : (fs === 'wrong' || fs === 'split') ? {checked:1, ok:0, pct:0} : {checked:0, ok:0, pct:null});
    }
    return Object.assign({}, r, {name: (row && row.name) || r.name || r.asin, tier: r.tier || (row && row.tier) || '',
      rb, rbA: rb.filter(h=> h.sev === 'amazon'),
      bad, core, blank, allOk: !r.nolive && !core.length, fullOk: !r.nolive && !bad.length,
      // A case is for Amazon to fix: a child out of its family, or reviews not pooled.
      // Wrong theme or value we fix ourselves with a flat file.
      caseable: bad.filter(k=> k === 'rev' || (k === 'fam' && c.fam && c.fam.e)) });
  });
}
function vrChip(x, nolive){
  if(nolive) return '<span class="lcchip lc-gray">Not checked yet</span>';
  const d = VR_S[(x || {}).s] || VR_S.na;
  const lab = x && x.s === 'na' && x.note && /Standalone/.test(x.note) ? 'Standalone' : d[0];
  return `<span class="lcchip ${d[1]}" data-tip="${esc((x && x.note) || d[2])}">${lab}${x && x.s === 'match' && x.note && /Close match/.test(x.note) ? ' \u24d8' : ''}</span>`;
}
function vrCaseInfo(r){
  const k = r.kase;
  return k && k.id ? {id:k.id, date:k.replyDate || k.d, notes:k.reply || '', link:k.link || '', kind:k.kind || ''} : null;
}
function vrFamilyRows(key, mk){
  return vrRows(mk).filter(r=>{ const p = parentOf(r); return (p.pasin && p.pasin === key) || (!p.pasin && p.psku === key); }).filter(r=> r.caseable.length);
}
const VR_SORT = { product: r=> r.name, stock: r=> stockOf(r, VR_F.mk), pct: r=> r.pct, since: r=> r.since || '',
  cs: r=> !r.caseable.length ? 2 : vrCaseInfo(r) ? 1 : 0 };
const VR_RANK = {split:0, wrong:0, unknown:3, blank:4, match:6, na:7};
VR_COLS.forEach(c=> VR_SORT['f_' + c[0]] = r=> r.nolive ? 9 : ((r.c || {})[c[0]] ? (VR_RANK[r.c[c[0]].s] !== undefined ? VR_RANK[r.c[c[0]].s] : 5) : 9));

function renderVariation(){
  document.getElementById('msg').hidden = true;

  const v = document.getElementById('cptView');
  const all = vrRows(), live = all.filter(r=> !r.nolive);
  const checked = live.reduce((t,r)=> t + (r.checked || 0), 0), ok = live.reduce((t,r)=> t + (r.ok || 0), 0);
  const pct = checked ? Math.round(ok / checked * 1000) / 10 : 0;
  const has = k=> all.filter(r=> r.bad.indexOf(k) !== -1);
  const split = all.filter(r=> r.c && r.c.fam && r.c.fam.s === 'split'), other = all.filter(r=> r.c && r.c.fam && r.c.fam.s === 'wrong');
  const wrong = all.filter(r=> r.bad.length), good = all.filter(r=> r.fullOk), blank = all.filter(r=> r.blank.length);
  const risk = all.filter(r=> r.risk);
  const fams = VR_FAMS.filter(f=> f.mk === VR_F.mk), strange = fams.filter(f=> f.strangers && f.strangers.some(s=> !s.ours));
  const rbA = all.filter(r=> r.rbA.length);

  rows = VR_F.sort && VR_SORT[VR_F.sort] ? sortBy(rows, VR_SORT[VR_F.sort], VR_F.dir)
       : sortBy(rows, r=> (r.nolive ? 2000 : 0) + (r.bad.length ? 0 : 1000) + (r.pct === null ? 500 : r.pct) + (TIER_RANK[r.tier] !== undefined ? TIER_RANK[r.tier] : 5) / 10, 1);
  VR_VIEW = rows;

    `<div class="cpt-tile bbtile${VR_F.show === f ? ' on' : ''}" role="button" tabindex="0" data-show="${f}" title="Show these in the table"><div class="k">${k}</div><div class="v ${cls || ''}">${val}</div><div class="n">${note || '&nbsp;'}</div></div>`;
  const list = a=> esc(a.map(r=> r.sku).slice(0,3).join(', ')) + (a.length > 3 ? '\u2026' : '');
  const t1 = (label, a, f, warn)=> tile(label, a.length, a.length ? (warn ? 'warn' : 'bad') : 'good', a.length ? list(a) : 'All OK', f);
  const isCA = VR_F.mk === 'CA';
  let html =
    '<section class="cpt-top"><div class="cpt-head"><h2>Variation</h2>'+
      `<span class="sub">Amazon ${VR_F.mk} vs the Master SKU sheet, ${all.length} active listings in ${fams.length} families</span>`+
      (VR_META.updated ? `<span class="cpt-live"><i></i>Checked ${esc(VR_META.updated)} ET</span>` : '')+
    '</div><div class="cpt-tiles">'+
      tile('Variation correct %', pct + '%', pct >= 98 ? 'good' : pct >= 90 ? 'warn' : 'bad', `${ok} of ${checked} checks match (${VR_TV ? 'family, theme, value' : 'family'})`, 'all')+
      tile('Listings 100% correct', `${good.length}<span style="font-size:1rem;color:var(--c-night-mut)"> of ${all.length}</span>`, good.length === all.length ? 'good' : 'warn', 'Reviews shared included', 'good')+
      t1('Split off from family', split, 'split') + t1('In the wrong family', other, 'other') +
      (VR_TV ? t1('Theme wrong', has('theme'), 'theme') + t1('Value wrong', has('value'), 'value') : '') +
      (isCA ? tile('Reviews shared', '\u2014', '', 'No live review counts for Canada', 'all')
            : t1('Reviews not shared', has('rev'), 'rev')) +
      t1('Theme may split reviews', risk, 'risk', true) +
      tile('Blank in Master SKU', blank.length, blank.length ? 'warn' : 'good', blank.length ? 'Correct value missing' : 'None', 'blank')+
      (!VR_TV ? '' : tile('Breaks a variation rule', RB ? rbA.length : '\u2014', !RB ? '' : rbA.length ? 'bad' : 'good', !RB ? 'Rulebook not loaded' : rbA.length ? list(rbA) : 'Themes and values OK in the Master SKU sheet', 'rba'))+
    '</div></section>'+
    rbBanner()+
    '<div class="cpt-tools"><div class="seg" id="vrMk">'+
      ['US','CA'].map(m=>{ const n = vrRows(m).filter(r=> r.bad.length).length;
        return `<button data-mk="${m}" aria-pressed="${VR_F.mk === m}">${m === 'US' ? 'Amazon US' : 'Amazon CA'} ${n ? '<span class="badge" style="margin-left:.3rem">' + n + '</span>' : ''}</button>`; }).join('')+
    '</div><div class="seg" id="vrSeg">'+
      [['all','All ' + all.length], ['wrong','Wrong ' + wrong.length], ['blank','Blank in Master SKU ' + blank.length]]
        .map(b=> `<button data-show="${b[0]}" aria-pressed="${VR_F.show === b[0]}">${b[1]}</button>`).join('')+
    '</div><div class="seg" id="vrTier">'+
      ['', 'A', 'B', 'C', 'X', 'N'].map(t=> `<button data-t="${t}" aria-pressed="${VR_F.tier === t}">${t ? 'Tier ' + t : 'All tiers'}</button>`).join('')+
    '</div>'+
    `<input id="vrQ" type="search" placeholder="Search SKU, ASIN, parent or product" value="${esc(VR_F.q)}" aria-label="Search Variation">`+
    (VR_F.sort ? '<button id="vrUnsort">Clear sort</button>' : '')+
    grpBtn(VR_F) + dlBtns() + '<button id="vrTips">Why does this happen?</button><button data-rbopen="1">Rulebook</button>' +
    (VR_TV && rows.some(r=> r.core.some(k=> k === 'theme' || k === 'value' || k === 'fam')) ? '<button id="vrFlatT">Download flat file values</button>' : '') +
    `<span class="count">${rows.length} of ${all.length}</span></div>`;

      H('pct', 'Correct %', 'b-cpt c', (VR_TV ? 'Family, theme and value checks' : 'The family check') + ' against the Master SKU sheet. Reviews shared is not in this number.')+
      VR_COLS.map(c=> H('f_' + c[0], c[1], 'b-gap c', c[0] === 'rev' ? 'Same review count as most siblings, as Keepa sees it. US only.' : 'Sort to bring problems to the top.')).join('')+
      H('since', 'Last changed on Amazon', 'b-move', 'The day the family, theme or value last changed on Amazon, as Keepa saw it.', 'desc')+
      H('cs', 'Case', 'b-case', 'A case is for a child out of its family or reviews not shared. Wrong theme or value: flat file.')+
      '</tr></thead><tbody>'+

        `<td>${r.since ? esc(shortDate(r.since)) : '<span class="mut">No change seen</span>'}</td>`+
        `<td>${r.caseable.length ? (()=>{ const ci = vrCaseInfo(r);
            return `<button class="work strong" data-vrcase="${esc(r.asin)}">${ci ? 'Follow up' : 'Draft case'}</button>`+
              (ci ? `<span class="was">Case ${esc(ci.id)}${ci.date ? ', ' + esc(shortDate(ci.date)) : ''}</span>` : ''); })()
          : r.core.length && VR_TV ? '<span class="mut">Flat file</span>' : ''}</td>`+
      '</tr>', r=> r.bad.length, 'need a look', VR_F.mk,

}

function openVr(r){

      `<dt>ASIN</dt><dd class="mono">${asinL(r.asin, mk)}${cpy(r.asin)}</dd>`+
      (r.par && r.par.pasin ? `<dt>Parent</dt><dd class="mono">${asinL(r.par.pasin, mk)}${cpy(r.par.pasin)} ${esc(r.par.psku || '')}</dd>` : '<dt>Parent</dt><dd>None (standalone in the Master SKU sheet)</dd>')+
      `<dt>Correct %</dt><dd class="${r.allOk ? 'ok' : 'warn'}">${r.pct === null ? '\u2014' : r.pct + '%'}${r.checked ? ` (${r.ok} of ${r.checked} checks)` : ''}</dd>`+
      `<dt>To fix</dt><dd>${r.bad.length ? esc(r.bad.map(k=> VR_LABEL[k]).join(', ')) : 'Nothing'}</dd>`+
      (f ? `<dt>Family on Amazon</dt><dd>${f.live ? `${f.onAmazon} children, theme ${esc((f.dims || []).join(' + ') || 'unknown')}` : 'Parent not read yet'}${f.strangers && f.strangers.length ? `<br>Not active in the Master SKU sheet: ${f.strangers.map(s=> esc(s.asin) + (s.ours ? ' (ours, not active)' : ' (not found)')).join(', ')}` : ''}</dd>` : '')+
      `<dt>Last change</dt><dd>${r.since ? esc(shortDate(r.since)) : 'No change seen'}${r.liveChecked ? ', checked ' + esc(shortDate(r.liveChecked)) : ''}</dd>`+
    '</dl>'+
    (r.risk ? `<div class="why"><b>Theme note:</b> ${esc(r.risk)}</div>` : '')+
    (r.caseable.length ? `<div class="act-row"><button class="work strong" id="vrOne">${ci ? 'Follow up on case ' + esc(ci.id) : 'Draft case'}</button>`+
      (famN > 1 ? `<button class="work strong" id="vrFamOne">Draft case for the whole family (${famN})</button>` : '')+
      '<button class="work" id="vrWhy">Why does this happen?</button></div>'+
      (ci && ci.notes ? `<div class="lcf-r" style="color:var(--muted)">Amazon\u2019s last reply (${esc(shortDate(ci.date))}): ${esc(ci.notes)}${ci.link ? ` <a href="${esc(ci.link)}" target="_blank" rel="noopener">Open in Gmail</a>` : ''}</div>` : '') : '')+
    (VR_TV && r.core.some(k=> k !== 'rev') && !r.caseable.length ? '<div class="act-row"><button class="work strong" id="vrFlatOne">Download flat file values</button><button class="work" id="vrWhy">Why does this happen?</button></div>' : '')+
    (r.nolive ? '<div class="why">No live data from Amazon yet for this listing.</div>' : VR_COLS.map(block).join(''))+
    rbBlock(r.rb)+
    '<div class="why">Family, theme and value: Keepa\u2019s last read, as Keepa sees it, not the page itself. Reviews: the review counts from the nightly rating run (Keepa). Case number and last reply: Gmail. Correct values: the Master SKU sheet.</div>';
  const one = document.getElementById('vrOne'); if(one) one.onclick = ()=> vrDraft([r]);
  const fo = document.getElementById('vrFamOne'); if(fo) fo.onclick = ()=> vrDraft(vrFamilyRows(r.par.pasin, mk));
  const fl = document.getElementById('vrFlatOne'); if(fl) fl.onclick = ()=> dlVrFlat([r]);
  const wy = document.getElementById('vrWhy'); if(wy) wy.onclick = vrTips;
  document.getElementById('veil').hidden = false;
}

/* ---------- Variation case drafts (chat first, then call, then case form) ----------
   Two kinds: children out of their family (relink), and reviews not shared.
   Wrong theme or value never gets a case: we fix it with a flat file. */
function vrThemeOf(r){ return [r.exp.t1, r.exp.t2].filter(Boolean).join(' and ') || 'variation theme'; }
function vrValsOf(r){ return [[r.exp.t1, r.exp.v1], [r.exp.t2, r.exp.v2]].filter(p=> p[0]).map(p=> `${p[0]}: ${p[1] || 'n/a'}`).join(', '); }
const VR_SHARE_OK = /^(colou?r|colou?rname|pattern|patternname|size|sizename|numberofitems|itempackagequantity|packagequantity|unitcount|model|modelname)$/;
function vrEligible(r){ return [r.exp.t1, r.exp.t2].filter(Boolean).every(t=> VR_SHARE_OK.test(String(t).toLowerCase().replace(/[^a-z]/g, ''))); }

function vrPitch(list){
  const mk = list[0].mk, site = mk === 'CA' ? 'amazon.ca' : 'amazon.com', brand = list[0].brand || 'Barnyard Designs';
  const relink = list.filter(r=> r.caseable.indexOf('fam') !== -1), revs = list.filter(r=> r.caseable.indexOf('rev') !== -1);
  const one = list.length === 1 ? list[0] : null;
  const cases = list.map(vrCaseInfo).filter(Boolean), caseIds = [...new Set(cases.map(c=> c.id))];
  const pasins = [...new Set(list.map(r=> r.exp.pasin).filter(Boolean))];
  const useParents = list.length > CG_MAX_ASINS;
  const kid = r=> `${r.asin} (SKU ${r.sku})`;
  const fam = p=>{ const r = list.find(x=> x.exp.pasin === p) || {par:{}}; return `Parent ASIN ${p}, parent SKU ${r.par.psku || 'n/a'} (${r.par.pname || 'variation family'})`; };
  const chat = [], ifSay = [];
  const asOf = longToday();

  chat.push(`Hi, I'm MJ from ${brand}, the brand owner. I need help with ${pasins.length === 1 ? 'a variation family' : pasins.length + ' variation families'} on ${site}: ` +
    [relink.length ? `${relink.length === 1 ? 'one child is' : relink.length + ' children are'} not showing in ${relink.length === 1 ? 'its' : 'their'} family` : '',
     revs.length ? `reviews are not shared across the family` : ''].filter(Boolean).join(', and ') + '. The details are below.');
  chat.push(pasins.map(fam).join('\n'));

  if(relink.length){
    chat.push(`Children to restore to their parent:\n` + (useParents && relink.length > CG_MAX_ASINS
      ? `${relink.length} children. I have the full list ready.`
      : relink.map(r=> `${kid(r)}: parent ${r.exp.pasin}, ${vrValsOf(r)}`).join('\n')));
    chat.push(`What our catalog data shows now (${asOf}):\n` + relink.slice(0, CG_MAX_ASINS).map(r=>
      `${r.asin}: ${r.c.fam.s === 'split' ? 'shows on its own, not in any family' : 'is in family ' + r.c.fam.a + ' instead'}`).join('\n') +
      (relink.length > CG_MAX_ASINS ? `\nand ${relink.length - CG_MAX_ASINS} more the same way` : ''));
    if(useParents && relink.length > CG_MAX_ASINS) pasins.forEach(p=> ifSay.push([`"Please send the list of children for ${p}."`, relink.filter(r=> r.exp.pasin === p).map(r=> `${kid(r)}: ${vrValsOf(r)}`).join('; ')]));
  }
  if(revs.length){
    const byFam = {};
    revs.forEach(r=> (byFam[r.exp.pasin] = byFam[r.exp.pasin] || []).push(r));
    chat.push(Object.keys(byFam).map(p=>{ const rs = byFam[p];
      return `In family ${p}, most children show ${rs[0].c.rev.e} reviews. These show a different count:\n` +
        rs.slice(0, useParents ? 3 : 99).map(r=> `${kid(r)}: ${r.c.rev.a} reviews`).join('\n') + (useParents && rs.length > 3 ? `\nand ${rs.length - 3} more` : ''); }).join('\n\n'));
    const elig = revs.every(vrEligible), th = [...new Set(revs.map(vrThemeOf))].join(' / ');
    chat.push(elig
      ? `These children are the same product. They differ only by ${th}. Your review sharing guidelines keep reviews shared for color, pattern, same-function size and pack size variations.`
      : `These children differ by ${th}. Please confirm whether they qualify for review sharing, and if not, what we need to change.`);
  }
  if(caseIds.length) chat.push(`We contacted you about ${one ? 'this ASIN' : 'these ASINs'} before on case${caseIds.length > 1 ? 's' : ''} ${caseIds.join(' and ')}.`);
  chat.push(`Please send this to the catalog team to ` + [relink.length ? `restore ${relink.length === 1 ? 'this child' : 'these children'} to ${relink.length === 1 ? 'its parent' : 'their parents'} with the values above` : '',
    revs.length ? `re-check review sharing for ${pasins.length === 1 ? 'this family' : 'these families'}` : ''].filter(Boolean).join(' and ') + ', add these notes to a case, and send me the case number.');

  if(relink.length) ifSay.push(
    ['"Please use the Variation Wizard."', 'The Variation Wizard was retired at the end of August 2026. Please ask the catalog team to relink the child, or tell me the exact upload you need.'],
    ['"Delete the child and create it again."', 'Deleting means the SKU cannot be reused for 24 hours. I would rather the catalog team relinks it. Please escalate.'],
    ['"It can take up to two hours to show."', `Our data shows ${relink.length === 1 ? 'it has' : 'they have'} been out of the family since ${shortDate(relink.map(r=> r.since).filter(Boolean).sort()[0] || '') || 'before today'}, so it is past that.`]);
  if(revs.length){
    if(revs.every(vrEligible)) ifSay.push(['"Reviews are shared only for the same core product."', (()=>{ const th = [...new Set(revs.map(vrThemeOf))].join(' / ').toLowerCase(); return `They are the same product. Only the ${th} ${/ and | \/ /.test(th) ? 'differ, which are differences' : 'differs, which is one of the differences'} your guidelines list as eligible.`; })()]);
    ifSay.push(['"Please update the variation theme."', 'Which theme do you recommend for these children? I will update it by flat file and come back if the reviews still do not pool.']);
  }

  const call = ['BEFORE THE CALL', `Have open: ${caseIds.length ? 'case ' + caseIds.join(', ') + ', ' : ''}this page, and the children list.`, '',
    '1. SAY WHO YOU ARE', `"${chat[0].replace("Hi, I'm MJ", 'Hi, my name is MJ Baguhin, calling')}"`, '',
    '2. GIVE THE DETAILS', ...chat.slice(1, -1).map(m=> '"' + m.replace(/\n/g, '; ') + '"'), '',
    '3. MAKE THE ASK', `"${chat[chat.length - 1]}"`, '',
    '4. BEFORE YOU HANG UP', 'Ask for the case number and the agent\u2019s name. Write them down.', '',
    'IF THEY SAY...', ...ifSay.map(x=> `${x[0]}\n   Say: "${x[1]}"`)].join('\n');

  const body = [`I am requesting help with a variation family on the ${mk} marketplace for ${brand}, where we are the brand owner.`, '',
    ...pasins.map(p=> fam(p)), '',
    ...(relink.length ? ['Children to restore to their parent, with their variation values:', ...relink.map(r=> `${kid(r)}: parent ${r.exp.pasin}, ${vrValsOf(r)}`), '',
      `What our catalog data shows now (${asOf}):`, ...relink.map(r=> `${r.asin}: ${r.c.fam.s === 'split' ? 'shows on its own, not in any family' : 'is in family ' + r.c.fam.a + ' instead'}`), ''] : []),
    ...(revs.length ? chat.filter(m=> /^In family |^These children /.test(m)).flatMap(m=> [m, '']) : []),
    ...(caseIds.length ? [chat.find(m=> /^We contacted you/.test(m)), ''] : []),
    `Could you please ${[relink.length ? 'restore these children to their parents with the values above' : '', revs.length ? 're-check review sharing for this family' : ''].filter(Boolean).join(' and ')}, and confirm once it is done?`, '',
    'Thank you,', 'MJ Baguhin', `${brand}, Cross Path Capital LLC`].join('\n').replace(/\n{3,}/g, '\n\n');
  const clean = t=> noDash(String(t));
  return {chat:chat.map(clean), call:clean(call), ifSay:ifSay.map(x=> [x[0], clean(x[1])]), cid:caseIds[caseIds.length - 1] || '', read:null,
          body:clean(body), follow: !!caseIds.length,
          subject: clean(`${relink.length ? 'Variation family repair' : 'Review sharing'}: ${pasins.length ? pasins.map(p=> 'parent ' + p).join(', ') : one.asin} on ${site}`)};
}
function vrDraft(list){
  list = list.filter(r=> r.caseable.length);
  if(!list.length) return;
  const P = vrPitch(list);
  showDraft(list.length === 1 ? `${list[0].sku} ${list[0].name}` : `${list.length} listings, ${list[0].mk}`, P.body,
    {follow:P.follow, subject:P.subject, caseId:P.cid, rows:[], pitch:P});
}
// ASINs in our family on Amazon that are not in the Master SKU sheet: Amazon's

function vrStrangerDraft(fams){
  const mk = VR_F.mk, site = mk === 'CA' ? 'amazon.ca' : 'amazon.com';
  const text = ['Subject: Product incorrectly added to our variation family on ' + site, '',
    'Check first: open each ASIN below and make sure it is not one of ours (an old listing or another brand of ours). Only send this for ASINs that are not ours.', '',
    `We are the brand owner. The following ASINs appear in our variation families on ${site} but are not our products:`, '',
    ...fams.flatMap(f=> [`Parent ASIN ${f.pasin}, parent SKU ${f.psku || 'n/a'} (${f.pname || 'variation family'}):`, ...f.strangers.filter(s=> !s.ours).map(s=> `${s.asin}, https://www.${site}/dp/${s.asin}`), '']),
    'Please remove these ASINs from our variation families.', '', 'Thank you,', 'MJ Baguhin', 'Cross Path Capital LLC'].join('\n');
  showDraft('Report products not ours in our families', text, {subject: 'Product incorrectly added to our variation family on ' + site});
}

/* ---------- Downloads ---------- */
function dlVr(rows){
  const h = ['Market','SKU','ASIN','Amazon link','Product','Tier','Stock','Correct %'];
  VR_COLS.forEach(c=> h.push(c[1] + ' check', c[1] + (c[0] === 'rev' ? ' most siblings' : ' correct (Master SKU)'), c[1] + (c[0] === 'rev' ? ' this child' : ' on Amazon')));
  csvSave('variation-' + VR_F.mk.toLowerCase(), h.concat(['Theme note','Rule issues','Case ID','Last case note','Parent SKU','Parent ASIN']), rows.map(r=>{
    const cells = [r.mk, r.sku, r.asin, `https://www.amazon.${r.mk === 'CA' ? 'ca' : 'com'}/dp/${r.asin}`, r.name, r.tier, stockOf(r, r.mk), r.pct];
    VR_COLS.forEach(c=>{ const x = (r.c || {})[c[0]] || {}; cells.push(r.nolive ? 'Not checked yet' : (VR_S[x.s] || [x.s || ''])[0], x.e || '', x.a || ''); });
    const ci = vrCaseInfo(r); cells.push(r.risk || '', (r.rb || []).map(x=> `${x.corr} (${x.rule.id})`).join('; '), ci ? ci.id : '', ci ? ci.notes : '');
    return withParent(r, cells);
  }));
}
function dlVrFlat(rows){
  const list = rows.filter(r=> r.core.length && r.exp && r.exp.isVar);
  csvSave('variation-flat-file-values-' + VR_F.mk.toLowerCase(),
    ['item_sku (Seller SKU)', 'update_delete', 'parent_child (Parentage)', 'parent_sku (Parent SKU)', 'relationship_type (Relationship Type)',
     'variation_theme (pick the matching Valid Values entry)', 'Theme 1', 'Value 1', 'Theme 2', 'Value 2', 'ASIN', 'Marketplace', 'What is wrong', 'Amazon has now'],
    list.map(r=> [r.sku, 'PartialUpdate', 'child', r.par.psku || '', 'Variation', [r.exp.t1, r.exp.t2].filter(Boolean).join(' + '),
      r.exp.t1, r.exp.v1, r.exp.t2, r.exp.v2, r.asin, r.mk === 'CA' ? 'amazon.ca' : 'amazon.com',
      r.core.map(k=> VR_LABEL[k]).join(', '), [r.c.fam && r.c.fam.s !== 'match' ? (r.c.fam.a ? 'parent ' + r.c.fam.a : 'no parent') : '', r.c.theme && r.c.theme.a ? 'theme ' + r.c.theme.a : '', r.c.value && r.c.value.a ? 'value ' + r.c.value.a : ''].filter(Boolean).join('; ')]));
}

/* ---------- BSR module ----------
   Star rating, ratings count, Best Sellers Rank and units bought, US and CA,
   from bsr.json (BSR Watch, daily). US ratings: the nightly rating run (Keepa).
   BSR history: the daily Buy Box read (US) and CA Watch (CA), both Keepa. */
let BS = [], BS_META = {}, BS_ERR = '', BS_VIEW = [];
const BS_F = {show:'all', q:'', sort:'', dir:1, tier:'', mk:'US', group:false};
function buildBs(j){
  BS_ERR = '';
  BS_META = {updated: j && j.updated || '', usFrom: j && j.usRatingsFrom || '', usErr: j && j.usRatingsError || ''};
  BS = (j && j.rows) || [];
}
const bsNum = v=> v === null || v === undefined || isNaN(v) ? null : Number(v);
const bsInt = v=> v === null || v === undefined ? '\u2014' : Number(v).toLocaleString('en-US');
function bsRows(mk){
  return BS.filter(r=> r.mk === (mk || BS_F.mk)).map(r=>{
    const row = ROWS.find(x=> x.asin === r.asin);
    const rt = r.rt || {}, rk = r.rk || {};
    const cur = bsNum(rt.cur), r30 = bsNum(rt.r30), r90 = bsNum(rt.r90);
    const d30 = cur !== null && r30 !== null ? Math.round((cur - r30) * 10) / 10 : null;
    const d90 = cur !== null && r90 !== null ? Math.round((cur - r90) * 10) / 10 : null;
    const bsr = bsNum(rk.bsr), avg30 = bsNum(rk.avg30);
    // Positive trend = a higher rank number = selling slower than its 30-day average
    const trend = bsr && avg30 && (rk.days || 0) >= 7 ? Math.round((bsr - avg30) / avg30 * 100) : null;
    const o = Object.assign({}, r, {name: (row && row.name) || r.name || r.asin, tier: r.tier || (row && row.tier) || '',
      cur, r30, r90, d30, d90, rev: bsNum(rt.rev), rev30: bsNum(rt.rev30), bsr, avg30, trend, sold: bsNum(rk.sold), days: rk.days || 0});
    o.flags = [];
    if(cur !== null && cur < 4) o.flags.push('low');
    if(d30 !== null && d30 <= -0.1) o.flags.push('drop');
    if(!bsr && !r.nolive) o.flags.push('nobsr');
    if(trend !== null && trend >= 25) o.flags.push('slow');
    o.rb = rbScreenRow('bsr', Object.assign({}, o, {mk: o.mk}));
    o.ok = cur !== null && cur >= 4 && !!bsr && !(d30 !== null && d30 <= -0.1);
    return o;
  });
}
const BS_SORT = { product: r=> r.name, stock: r=> stockOf(r, BS_F.mk), cur: r=> r.cur, d30: r=> r.d30, rev: r=> r.rev, rev30: r=> r.rev30,
  bsr: r=> r.bsr || 1e12, avg30: r=> r.avg30 || 1e12, trend: r=> r.trend, sold: r=> r.sold, rb: r=> -((r.rb || []).length) };
const bsStars = v=> v === null ? '<span class="mut">No rating</span>' :
  `<b style="color:${v >= 4.5 ? 'var(--ok)' : v >= 4 ? 'inherit' : v >= 3 ? 'var(--warn)' : 'var(--bad)'}">${v.toFixed(1)}</b> <span class="mut">\u2605</span>`;
const bsDelta = (v, unit)=> v === null ? '<span class="mut">\u2014</span>' : v === 0 ? '<span class="mut">no change</span>' :
  `<span style="color:${v > 0 ? 'var(--ok)' : 'var(--bad)'}">${v > 0 ? '+' : ''}${unit === '%' ? v + '%' : v.toFixed(1)}</span>`;
function bsSpark(a){
  const v = (a || []).filter(x=> x); if(v.length < 3) return '';
  const lo = Math.min(...v), hi = Math.max(...v), w = 70, h = 18;
  const pts = (a || []).map((x,i)=> x ? `${Math.round(i / Math.max(1, a.length - 1) * w)},${hi === lo ? h / 2 : Math.round((x - lo) / (hi - lo) * h)}` : null).filter(Boolean).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;margin-top:2px" aria-label="BSR, last 30 days (higher on the chart = better rank)"><polyline fill="none" stroke="currentColor" stroke-width="1.5" points="${pts}"/></svg>`;
}

function renderBsr(){
  document.getElementById('msg').hidden = true;
  document.getElementById('bar').innerHTML = '';
  const v = document.getElementById('cptView'), mk = BS_F.mk;
  const all = bsRows(), rated = all.filter(r=> r.cur !== null);
  const avg = rated.length ? Math.round(rated.reduce((t,r)=> t + r.cur, 0) / rated.length * 100) / 100 : null;
  const f = k=> all.filter(r=> r.flags.indexOf(k) !== -1);
  const good = all.filter(r=> r.cur !== null && r.cur >= 4), low = f('low'), drop = f('drop'), nobsr = f('nobsr'), slow = f('slow');
  const under3 = rated.filter(r=> r.cur < 3);
  const gained = all.reduce((t,r)=> t + (r.rev30 || 0), 0);
  const pick = {good, low, drop, nobsr, slow, under3, rb: all.filter(r=> (r.rb || []).length), any: all.filter(r=> r.flags.length)};

  let rows = pick[BS_F.show] || all;
  if(BS_F.tier) rows = rows.filter(r=> (r.tier || 'N') === BS_F.tier);
  if(BS_F.q){ const q = BS_F.q.toLowerCase(); rows = rows.filter(r=> (r.sku + ' ' + r.asin + ' ' + r.name + ' ' + ((r.par || {}).pasin || '')).toLowerCase().indexOf(q) !== -1); }
  rows = BS_F.sort && BS_SORT[BS_F.sort] ? sortBy(rows, BS_SORT[BS_F.sort], BS_F.dir)
       : sortBy(rows, r=> (r.flags.length ? 0 : 1000) + (r.cur === null ? 500 : r.cur * 10) + (TIER_RANK[r.tier] !== undefined ? TIER_RANK[r.tier] : 5) / 10, 1);
  BS_VIEW = rows;

  const tile = (k, val, cls, note, fl)=>
    `<div class="cpt-tile bbtile${BS_F.show === fl ? ' on' : ''}" role="button" tabindex="0" data-show="${fl}" title="Show these in the table"><div class="k">${k}</div><div class="v ${cls || ''}">${val}</div><div class="n">${note || '&nbsp;'}</div></div>`;
  const list = a=> esc(a.map(r=> r.sku).slice(0,3).join(', ')) + (a.length > 3 ? '\u2026' : '');
  const t1 = (label, a, fl, warn)=> tile(label, a.length, a.length ? (warn ? 'warn' : 'bad') : 'good', a.length ? list(a) : 'None', fl);
  let html =
    '<section class="cpt-top"><div class="cpt-head"><h2>BSR</h2>'+
      `<span class="sub">Star rating, ratings and Best Sellers Rank on Amazon ${mk}, ${all.length} active listings</span>`+
      (BS_META.updated ? `<span class="cpt-live"><i></i>Built ${esc(BS_META.updated)} ET</span>` : '')+
    '</div><div class="cpt-tiles">'+
      tile('Average star rating', avg === null ? '\u2014' : avg.toFixed(2), avg === null ? '' : avg >= 4.5 ? 'good' : avg >= 4 ? 'warn' : 'bad', `${rated.length} rated listings`, 'all')+
      tile('Rated 4.0 or higher', `${good.length}<span style="font-size:1rem;color:var(--c-night-mut)"> of ${rated.length}</span>`, good.length === rated.length ? 'good' : 'warn', rated.length ? Math.round(good.length / rated.length * 100) + '%' : '', 'good')+
      t1('Below 4.0', low, 'low') + t1('Below 3.0 (no deals)', under3, 'under3') +
      t1('Rating dropped (30 days)', drop, 'drop') + t1('BSR 25% worse than its 30-day average', slow, 'slow', true) +
      t1('No BSR on Amazon', nobsr, 'nobsr') +
      tile('New ratings (30 days)', bsInt(gained), 'good', 'All listings together', 'all') +
      rbTile(all, 'Breaks a BSR rule') +
    '</div></section>'+
    rbBanner()+
    (BS_META.usErr && mk === 'US' ? `<div class="why"><b>US ratings not loaded:</b> ${esc(BS_META.usErr)}.</div>` : '')+
    (mk === 'CA' && !all.some(r=> r.cur !== null) && all.length ? '<div class="why"><b>No CA ratings yet:</b> they come from CA Watch. Replace CA_Watch.gs with the new version, and they show after its next run.</div>' : '')+
    '<div class="cpt-tools"><div class="seg" id="bsMk">'+
      ['US','CA'].map(m=> `<button data-mk="${m}" aria-pressed="${mk === m}">${m === 'US' ? 'Amazon US' : 'Amazon CA'}</button>`).join('')+
    '</div><div class="seg" id="bsSeg">'+

    '</div><div class="seg" id="bsTier">'+
      ['', 'A', 'B', 'C', 'X', 'N'].map(t=> `<button data-t="${t}" aria-pressed="${BS_F.tier === t}">${t ? 'Tier ' + t : 'All tiers'}</button>`).join('')+
    '</div>'+
    `<input id="bsQ" type="search" placeholder="Search SKU, ASIN, parent or product" value="${esc(BS_F.q)}" aria-label="Search BSR">`+
    (BS_F.sort ? '<button id="bsUnsort">Clear sort</button>' : '')+
    grpBtn(BS_F) + dlBtns() + '<button id="bsTips">Why does this happen?</button><button data-rbopen="1">Rulebook</button>' +
    `<span class="count">${rows.length} of ${all.length}</span></div>`;

  if(!BS.length){
    html += BS_ERR ? '<div class="cpt-empty"><b>BSR feed not found yet</b>Run setupBsrWatchDaily in the CPC Keepa Fetcher project. It builds bsr.json from data the project already reads.</div>'
                   : '<div class="cpt-empty"><b>Loading BSR</b></div>';
  } else if(!rows.length){
    html += '<div class="cpt-empty"><b>Nothing here</b>Pick All or clear the search.</div>';

      H('cur', 'Star rating', 'b-cpt c', 'The star rating Amazon shows, from Keepa.')+
      H('d30', '30-day change', 'b-cpt c', 'Star rating now minus 30 days ago.')+
      H('rev', 'Ratings', 'b-gap c', 'Ratings count Amazon shows. Variation families share one count when reviews are pooled.', 'desc')+

      H('avg30', '30-day average', 'b-sim c', 'Average daily BSR over the last 30 days we have.')+
      H('trend', 'BSR vs average', 'b-sim c', 'BSR now against its 30-day average. Red means selling slower than usual. Needs 7 days of history.', 'desc')+
      H('sold', 'Bought past month', 'b-move c', 'Amazon\u2019s \u201cbought in past month\u201d count, when Amazon shows one.', 'desc')+
      H('rb', 'Rules', 'b-gap c', 'Screened every day against the rulebook.')+
      '<th class="b-case">Case</th>'+
      '</tr></thead><tbody>'+
      grpMap(BS_F, rows, 13, r=> `<tr class="row" tabindex="0" data-bs="${esc(r.asin)}">`+
        `<td class="prod"><div class="p-name"><span class="dot" style="background:${r.nolive ? '#94a3b8' : r.flags.length ? '#d64545' : '#1f9d55'}"></span>${esc(String(r.name).slice(0, 60))}</div>`+
          `<div class="p-id"><span>SKU</span>${skuL(r.sku, mk)}${cpy(r.sku)}</div><div class="p-id"><span>ASIN</span>${asinL(r.asin, mk)}${cpy(r.asin)}</div>`+
          `${r.tier ? `<span class="p-size">Tier ${esc(r.tier)}</span>` : ''}</td>`+
        stockTd(r, mk)+
        `<td class="c">${bsStars(r.cur)}</td>`+
        `<td class="c">${bsDelta(r.d30)}</td>`+
        `<td class="c">${bsInt(r.rev)}</td>`+
        `<td class="c">${r.rev30 === null ? '<span class="mut">\u2014</span>' : r.rev30 ? '+' + bsInt(r.rev30) : '<span class="mut">0</span>'}</td>`+
        `<td class="c">${r.bsr ? '#' + bsInt(r.bsr) : '<span class="lcchip lc-bad">No BSR</span>'}${bsSpark((r.rk || {}).spark)}</td>`+
        `<td class="c">${r.avg30 ? '#' + bsInt(r.avg30) : '<span class="mut">\u2014</span>'}</td>`+
        `<td class="c">${r.trend === null ? '<span class="mut">' + (r.days < 7 ? 'needs 7 days' : '\u2014') + '</span>' : bsDelta(-r.trend, '%')}</td>`+
        `<td class="c">${r.sold === null ? '<span class="mut">\u2014</span>' : bsInt(r.sold) + '+'}</td>`+
        `<td class="c"><span data-rbrow="${esc(r.asin)}" style="cursor:pointer">${rbChip(r.rb || [])}</span></td>`+
        `<td>${r.flags.indexOf('nobsr') !== -1 ? `<button class="work strong" data-bscase="${esc(r.asin)}">Draft case</button>` : ''}</td>`+
      '</tr>', r=> r.flags.length, 'need a look', mk)+
      '</tbody></table>';
  }
  v.innerHTML = stockAlert() + html;

  wireSort(v, BS_F, renderBsr);
  wireGrpDl(v, BS_F, renderBsr, ()=> dlBs(rows));
  [...v.querySelectorAll('[data-rbopen]')].forEach(b=> b.onclick = openRulebook);
  [...v.querySelectorAll('[data-rbrow]')].forEach(b=> b.onclick = e=>{ e.stopPropagation(); const r = all.find(x=> x.asin === b.dataset.rbrow); if(r) rbOpenRow(`${r.sku} ${r.name}`, r.rb || []); });
  const tp = document.getElementById('bsTips'); if(tp) tp.onclick = bsTips;
  const setShow = fl=>{ BS_F.show = fl; renderBsr(); };
  [...v.querySelectorAll('#bsSeg button')].forEach(b=> b.onclick = ()=> setShow(b.dataset.show));
  [...v.querySelectorAll('#bsMk button')].forEach(b=> b.onclick = ()=>{ BS_F.mk = b.dataset.mk; renderBsr(); });
  [...v.querySelectorAll('.bbtile')].forEach(t=>{
    const go = ()=>{ setShow(t.dataset.show); const tb = document.querySelector('#cptView .cg-table, #cptView .cpt-empty'); if(tb && tb.scrollIntoView) tb.scrollIntoView({behavior:'smooth', block:'start'}); };
    t.onclick = go; t.onkeydown = e=>{ if(e.key === 'Enter') go(); };
  });
  [...v.querySelectorAll('#bsTier button')].forEach(b=> b.onclick = ()=>{ BS_F.tier = b.dataset.t; renderBsr(); });
  const q = document.getElementById('bsQ');
  if(q) q.oninput = ()=>{ BS_F.q = q.value; const pos = q.selectionStart; renderBsr(); const q2 = document.getElementById('bsQ'); q2.focus(); q2.setSelectionRange(pos, pos); };
  const un = document.getElementById('bsUnsort'); if(un) un.onclick = ()=>{ BS_F.sort = ''; renderBsr(); };
  [...v.querySelectorAll('button[data-bscase]')].forEach(b=> b.onclick = e=>{ e.stopPropagation(); const r = all.find(x=> x.asin === b.dataset.bscase); if(r) bsDraft(r); });
  [...v.querySelectorAll('tr.row[data-bs]')].forEach(tr=>{
    const open = ()=>{ const r = all.find(x=> x.asin === tr.dataset.bs); if(r) openBs(r); };
    tr.onclick = open; tr.onkeydown = e=>{ if(e.key === 'Enter') open(); };
  });
}

/* A listing with no Best Sellers Rank: chat first, then call, then case form */
function bsDraft(r){
  const site = r.mk === 'CA' ? 'amazon.ca' : 'amazon.com', brand = r.brand || 'Barnyard Designs';
  const chat = [
    `Hi, I'm MJ from ${brand}, the brand owner. Our listing on ${site} has no Best Sellers Rank showing. The details are below.`,
    `ASIN ${r.asin}, SKU ${r.sku} (${r.name}).${r.par && r.par.pasin ? ` Parent ASIN ${r.par.pasin}.` : ''}`,
    `What our catalog data shows now (${longToday()}): no Best Sellers Rank on the detail page${(r.rk || {}).best90 ? `. It had a rank of #${bsInt(r.rk.best90)} in the last 90 days` : ''}.`,
    'Please check why the Best Sellers Rank is not showing, and whether the listing is placed in a ranked category. Please add these notes to a case and send me the case number.'];
  const ifSay = [
    ['"A rank only shows after a sale."', r.sold ? `Amazon shows ${bsInt(r.sold)}+ bought in the past month on this listing.` : 'Please check the sales on this ASIN. If it has sales, the rank should show.'],
    ['"The category is not ranked."', 'Which category is it in now? Our correct category is in the Category module. Please move it to a ranked one, or tell me which one you need.']];
  const call = ['1. SAY WHO YOU ARE', `"${chat[0].replace("Hi, I'm MJ", 'Hi, my name is MJ Baguhin, calling')}"`, '',
    '2. GIVE THE DETAILS', ...chat.slice(1, -1).map(m=> `"${m}"`), '', '3. MAKE THE ASK', `"${chat[chat.length - 1]}"`, '',
    '4. BEFORE YOU HANG UP', 'Ask for the case number and the agent\u2019s name. Write them down.', '',
    'IF THEY SAY...', ...ifSay.map(x=> `${x[0]}\n   Say: "${x[1]}"`)].join('\n');
  const body = [`I am requesting help with a listing on the ${r.mk} marketplace for ${brand}, where we are the brand owner.`, '',
    chat[1], '', chat[2], '', 'Could you please check why the Best Sellers Rank is not showing, and confirm once it is fixed?', '',
    'Thank you,', 'MJ Baguhin', `${brand}, Cross Path Capital LLC`].join('\n');
  const clean = t=> noDash(String(t));
  showDraft(`${r.sku} ${r.name}`, clean(body), {subject: clean(`No Best Sellers Rank: ${r.asin} on ${site}`), rows: [],
    pitch: {chat: chat.map(clean), call: clean(call), ifSay: ifSay.map(x=> [x[0], clean(x[1])]), cid: '', read: null, body: clean(body), follow: false,
            subject: clean(`No Best Sellers Rank: ${r.asin} on ${site}`)}});
}
