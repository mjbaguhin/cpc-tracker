}

/* ---------- case finder ----------
   Which flagged listings are worth a case with Amazon, rather than a price
   change. The idea: a case can only win when the CPT is WRONG, meaning the bot
   matched us to a different or smaller product. Each signal below points to a
   wrong match, and the points add up to a verdict. Change the numbers in
   CASE_RULES to tune it. */
const CASE_RULES = {
  bigGapPct:   20,   // our price is this % or more above the CPT: +2
  midGapPct:   10,   // this % or more: +1
  belowSimPct: 0,    // CPT is below the cheapest similar same-size mat: +2
  medianPct:   15,   // CPT is this % or more under the similar median: +1
  dropPct:     10,   // CPT fell this % or more in the last dropDays: +1
  dropDays:    14,
  heldPct:     10,   // CPT is this % or more under our list price while we sit at it
  strong:      4,    // points for "Strong case"
  possible:    2     // points for "Possible case"
};

function openCaseFor(asin){
  return CASES.find(c=> c.asin && c.asin === asin) || null;
}

/* What MJ needs to do with a listing. One rule, the one Haris works by:
   if we had to cut the price to the CPT to keep selling (or are stuck above
   it), and the CPT is 10% or more under our regular price, it needs a case.
   A case already on file (case tracker, or the Cases column of the
   Reference Pricing tab) turns that into a follow-up. */
/* Target, worked out from the data, nothing typed in.
   Haris's rule (Oct 15): compare the CPT with our SALE price for the size.
   The sale price we mean is the one most listings of that size and product
   line actually carry today, read from Amazon's daily inventory report
   (BigQuery, through ALM Console Data). The few listings stuck at a low CPT
   are the exception, so they never set the target. When two prices tie, the
   higher one wins, because a cut price is the stuck one.
   A product line is the SKU prefix (DMC for coir). It needs 3 or more
   listings of that size, otherwise there is no target and the older list
   price rule applies. */
const TARGET_MIN = 3;
let TARGETS = null;   // key "DMC|24x36" -> {price, n, of}
function buildTargets(){
  const by = {};

    const sale = row.usSale;
    if(sale === null || sale === undefined || !(sale > 0)) return;
    const size = sizeOf(row.name, row.sku);
    if(!size) return;
    const key = String(row.sku || '').split('-')[0].toUpperCase() + '|' + size;
    (by[key] = by[key] || []).push(Math.round(sale * 100) / 100);
  });
  TARGETS = {};
  Object.keys(by).forEach(k=>{
    const v = by[k];
    if(v.length < TARGET_MIN) return;
    const count = {};
    v.forEach(x=> count[x] = (count[x] || 0) + 1);
    const best = Object.keys(count).map(Number).sort((a,b)=> count[b] - count[a] || b - a)[0];
    TARGETS[k] = {price: best, n: count[best], of: v.length};
  });
}
function targetInfo(r){
  if(!ROWS.length) return null;
  if(!TARGETS) buildTargets();
  return TARGETS[String(r.sku || '').split('-')[0].toUpperCase() + '|' + r.size] || null;
}
function saleTarget(r){
  const t = r.size ? targetInfo(r) : null;

}

/* Amazon's latest email on a listing, from CPT Watch's morning Gmail check */
const MAIL_KIND = {
  rejected: ['Rejected',          'm-bad'],

  replied:  ['Amazon replied',    'm-warn'],
  restored: ['Buy Box back, CPT not fixed', 'm-warn'],
  received: ['Received, waiting', 'm-wait'],
  pending:  ['Pending, Amazon is checking', 'm-wait'],
  waiting:  ['Waiting on Amazon', 'm-wait'],
  fixed:    ['Fixed',             'm-ok']
};
function nextLine(r){
  const n = nextStep(r);
  if(!n) return mailLine(r);
  const last = (r.events || [])[0];
  return (last ? `<span class="mailst m-wait">Last: ${esc(EV_LABEL[last.kind] || last.kind)}${last.who === 'us' ? ' to ' + (last.ch === 'jassy' ? 'Jassy team' : 'case') : ''}, ${shortDate(last.d)}</span>` : '')+
    `<span class="mailst ${n.due === 'now' ? 'm-bad' : 'm-wait'}">Next: ${esc(n.text)}</span>`;
}
function mailLine(r){
  const m = r.mail;
  if(!m || !MAIL_KIND[m.kind]) return '';
  const k = MAIL_KIND[m.kind];
  const when = m.days === 0 ? 'today' : m.days === 1 ? 'yesterday' : m.days + ' days ago';
  return `<span class="mailst ${k[1]}">${k[0]}${m.needsReply ? ', reply' : ''} <span>${when}</span></span>`;

/* ---------- case timeline and next step ----------
   Built from Gmail by CPT Watch: what we sent (to a case or to the Andy
   Jassy team), what Amazon answered, and when. The follow-up rule:
     we sent, no answer for FOLLOW_DAYS     -> follow up on the same case
     Amazon rejected (Seller Support)       -> reply within a day with new proof;
                                               after 2 rejections, escalate to Jassy
     Amazon closed it without a fix         -> reopen within a day
     Jassy team rejected                    -> reply the same day with the strongest new facts (MJ, Oct 15) */
const FOLLOW_DAYS = 3, JASSY_WAIT_DAYS = 7;
const EV_LABEL = {
  sent: 'We sent', received: 'Amazon received it', rejected: 'Amazon rejected', resolved: 'Amazon closed the case',
  replied: 'Amazon replied', fixed: 'Amazon fixed it', restored: 'Amazon says Buy Box is back',
  pending: 'Amazon is checking (pending)'
};
function addDays(d, n){ const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return t.toISOString().slice(0,10); }
function shortDate(d){ return d ? new Date(d + 'T12:00:00').toLocaleDateString('en-US', {month:'short', day:'numeric'}) : ''; }
function todayStr(){ return new Date().toISOString().slice(0,10); }

function nextStep(r){
  const pc = caseStep(r);

}

/* Per case (Oct 19): one status per case number, from CPT Watch. The case
   that needs us comes first, so a reply on one case is never hidden by a
   newer email we sent on another one. */
function caseStep(r){
  if(r.action === 'oos') return null;
  const list = r.mailCases || [];
  if(!list.length) return null;
  const c = list[0], who = c.ch === 'jassy' ? 'Andy Jassy team' : 'Seller Support';
  const on = c.cid ? 'case ' + c.cid : 'the same email';
  const wait = c.ch === 'jassy' ? JASSY_WAIT_DAYS : FOLLOW_DAYS;
  const rejects = list.filter(x=> x.ch === 'case' && x.status === 'rejected').length +
                  (r.events || []).filter(x=> x.kind === 'rejected' && x.ch === 'case' && !list.some(y=> y.cid && y.cid === x.cid)).length;
  const jassyUsed = list.some(x=> x.ch === 'jassy') || (r.events || []).some(x=> x.ch === 'jassy');
  if(c.status === 'waiting' || c.status === 'received' || c.status === 'pending'){
    const from = c.status === 'waiting' ? c.lastUs : (c.lastAmazon || c.lastUs);
    if(!from) return null;
    const due = addDays(from, wait);
    const what = c.status === 'pending' ? `${who} sent it to another team and will update us` :
                 c.status === 'received' ? `${who} received it` : `Waiting for the ${who}`;
    return due > todayStr()
      ? {text:`${what}. Check in on ${shortDate(due)} if no update`, due, how:`Nothing to do yet on ${on}. If nothing by ${shortDate(due)}, use Draft follow-up. It asks for an update and repeats the strongest facts.`}
      : {text:`Check in now, no update since ${shortDate(from)}`, due:'now', how:`Reply on ${on}. Use Draft follow-up.`};
  }
  if(c.status === 'resolved') return {text:'Reopen it: Amazon closed the case without fixing', due:'now', how:`Reply on ${on}. Replying reopens it. Use Draft follow-up.`};
  if(c.status === 'rejected'){
    if(c.ch === 'jassy') return {text:'Andy Jassy team said no. Reply today with new facts', due:'now', how:'Use Draft follow-up. It answers what they said and leads with the strongest facts.'};
    if(rejects >= 2 && !jassyUsed) return {text:'Escalate to the Andy Jassy team (2 rejections)', due:'now', how:'Seller Support said no twice. Use Draft email to Andy Jassy team and list both case numbers.'};
    return {text:'Reply with new proof', due:'now', how:`Reply on ${on}. Use Draft follow-up.`};
  }
  if(c.status === 'restored') return {text:'Reply: we only have the Buy Box because we cut the price', due:'now', how:`Use Draft follow-up on ${on}. It asks them to raise the CPT itself.`};
  if(c.status === 'replied') return {text:`Read the ${who} reply and answer`, due:'now', how:`Their words are under Latest Amazon reply. Draft follow-up quotes them and answers.`};
  if(c.status === 'fixed') return {text:'Amazon says fixed. Check the CPT tomorrow', due:addDays(c.lastAmazon, 1), how:'If the CPT is still too low tomorrow, use Draft follow-up. It says it did not change.'};
  return null;
}

function nextStepOld(r){
  if(r.action === 'oos') return {text:'Out of stock. No case until stock is back', due:'later', how:'There is nothing to sell, so a case would not help yet. The tracker will flag it again when stock arrives.'};
  const ev = r.events || [];
  if(!ev.length){
    if(r.action === 'open') return {text:'Open a case, or email the Andy Jassy team', due:'now', how:'Use Draft email to Andy Jassy team, or Copy evidence and open a new case.'};
    return null;
  }
  const last = ev[0], ch = last.ch === 'jassy' ? 'Andy Jassy team' : 'case';
  const cid = last.cid || (r.caseIds || []).slice(-1)[0] || '';
  const rejects = ev.filter(x=> x.kind === 'rejected' && x.ch === 'case').length;
  const jassyUsed = ev.some(x=> x.ch === 'jassy');
  if(last.who === 'us' || last.kind === 'received'){
    const due = addDays(last.d, FOLLOW_DAYS);
    return due > todayStr()
      ? {text:`Waiting for Amazon. Follow up on ${shortDate(due)} if no answer`, due, how:`Amazon usually answers in 1 to 2 days. If nothing by ${shortDate(due)}, reply on ${cid ? 'case ' + cid : 'the same email'}.`}
      : {text:`Follow up now, no answer since ${shortDate(last.d)}`, due:'now', how:`Reply on ${cid ? 'case ' + cid : 'the same email thread'} and ask for an update. Use Draft follow-up.`};
  }
  if(last.kind === 'resolved') return {text:'Reopen it: Amazon closed the case without fixing', due:'now', how:`Open case ${cid} in Seller Central and reply. Replying reopens it. Say the CPT is still ${usd(r.cpt)}.`};
  if(last.kind === 'rejected'){
    if(last.ch === 'jassy')
      return {text:'Andy Jassy team said no. Reply today with new facts', due:'now',
              how:'Use Draft follow-up. It answers their reason and leads with the strongest facts below.'};
    if(rejects >= 2 && !jassyUsed) return {text:'Escalate to the Andy Jassy team (2 rejections)', due:'now', how:'Seller Support said no twice. Use Draft email to Andy Jassy team and list both case numbers.'};
    return {text:'Reply with new proof', due:'now', how:`Reply on case ${cid}. Point out the same-size mats with a higher CPT. Use Copy case evidence.`};
  }
  if(last.kind === 'restored') return {text:'Reply: we only have the Buy Box because we cut the price', due:'now',
    how:`Amazon says the Buy Box is back, but the CPT is still ${usd(r.cpt)}${r.target ? ', under our ' + usd(r.target) + ' sale price' : ''}. Use Draft follow-up: it thanks them and asks to raise the CPT itself.`};
  if(last.kind === 'replied') return {text:"Read Amazon's reply and answer", due:'now', how:'Amazon may be asking for something. Open the email and reply today, or ask Claude to read it and draft the answer.'};
  if(last.kind === 'fixed') return {text:'Amazon says fixed. Check the CPT tomorrow', due:addDays(last.d, 1), how:'If the CPT is still too low tomorrow, reply that it did not change.'};
  return null;
}

/* ---------- strongest facts ----------
   Only facts that are true and that help, strongest first. Each one is

const NUMW = ['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten'];
const numw = n=> n <= 10 ? NUMW[n] : String(n);

/* ---------- likely reference item ----------

function sharedDesign(r, x){

      (words.length ? `It carries the same design name as our listing (${words.map(w=> w.charAt(0).toUpperCase() + w.slice(1)).join(', ')}). ` : '') +
      (sameAsUs.length && unaffected.length ? `Only our ${r.size} designs that share a name with that brand's mats are held at ${usd(r.cpt)}. Our other ${numw(unaffected.length).toLowerCase()} ${r.size} designs, same size, material and backing, are not.` : 'The threshold appears to come from that single item.')});
  }
  const same = cptRows().filter(x=> x.asin !== r.asin && x.size === r.size && (x.sku || '').split('-')[0] === line && x.cpt !== null);

  // 1. Same threshold on different designs and prices: a generic reference
  const twins = same.filter(x=> x.cpt === r.cpt && (x.held || x.gap > 0));
  if(twins.length) F.push({w:5, t:`${numw(twins.length + 1)} of our ${r.size} listings with different designs (${[r].concat(twins).map(x=> x.sku).join(', ')}) ${twins.length === 1 ? 'both' : 'all'} show the exact same threshold of ${usd(r.cpt)}.`});

  // 2. Same brand, same size, same material, higher threshold
  const fair = same.filter(x=> !x.held && !(x.gap > 0) && x.cpt > r.cpt + 0.005);
  if(fair.length){
    const v = fair.map(x=> x.cpt), lo = Math.min(...v), hi = Math.max(...v);
    F.push({w:5, t:`${numw(fair.length)} other ${r.size} coir mats from our brand, same size and material, have a threshold of ${lo === hi ? usd(lo) : usd(lo) + ' to ' + usd(hi)}. Only this listing${twins.length ? ' and ' + twins.map(x=> x.sku).join(', ') + ' are' : ' is'} held at ${usd(r.cpt)}.`});
  }

  // 3. (removed) Our own or Featured Offer prices are not evidence: the threshold
  //    is set from outside retailers, so arguing with our price does not help.

  // 4. The threshold jumps around without any change on our side
  const pts = (r.h || []).filter(x=> x[1] !== null);
  if(pts.length >= 2){
    const vs = pts.map(x=> x[1]), lo = Math.min(...vs), hi = Math.max(...vs);
    if(hi > lo * 1.1) F.push({w:3, t:`Since ${shortDate(pts[0][0])} the threshold on this listing has ranged from ${usd(lo)} to ${usd(hi)}.`});
  }

  // 5. Demand and quality
  if(r.sold && r.sold >= 50) F.push({w:2, t:`Amazon shows "${r.sold}+ bought in past month" on this listing.`});
  else if(r.units30 && r.units30 >= 30) F.push({w:2, t:`We shipped ${r.units30} units of this listing in the last 30 days through FBA.`});

  // 6. Outside prices, only when every one helps
  const out = (r.sim || []).filter(x=> x.market !== 'Amazon' && !/barnyard/i.test(x.brand || '') && !/walmart/i.test(x.market || ''));
  if(out.length && out.every(x=> x.price > r.cpt)) F.push({w:3, t:`Every same-size coir mat we found outside Amazon (${out.length} listings) is priced above ${usd(r.cpt)}. The cheapest is ${usd(out[0].price)}.`});

  return F.sort((a,b)=> b.w - a.w);
}
function refLine(x){
  // No price: quoting it only confirms the threshold
  return `${x.brand ? x.brand + ' ' : ''}${x.name} at ${x.market}${x.link ? ' (' + x.link + ')' : ''}`;
}
/* "Our price on every channel we operate is at or above our Amazon price" (KB
   case evidence). Walmart comes from the Master SKU sheet; Shopify stays a
   bracket to fill. If Walmart is below our Amazon price, that is the cause, and
   the draft says to fix it first instead of claiming the line. */
function cptChannels(rows){
  const list = [].concat(rows).filter(Boolean);
  const bad = list.filter(r=>{ const w = rbWalmart(r.asin); return w !== null && r.ours !== null && w < r.ours - 0.005; });
  if(bad.length) return '[CHECK FIRST, then delete this line: our Walmart price is below our Amazon price on ' +
    bad.map(r=> `${r.sku} (Walmart ${usd(rbWalmart(r.asin))}, Amazon ${usd(r.ours)})`).join(', ') +
    '. The CPT playbook says to fix our own channels before opening a case.]';
  const parts = list.map(r=>{ const w = rbWalmart(r.asin); return `${list.length > 1 ? r.sku + ': ' : ''}Amazon ${usd(r.ours)}${w !== null ? ', Walmart ' + usd(w) : ''}, Shopify [price]`; });
  return 'Our price on every channel we operate is at or above our Amazon price: ' + parts.join('; ') + '.';
}

function outsideRisk(r){
  const out = (r.sim || []).filter(x=> x.market !== 'Amazon' && x.price < r.cpt - REF_TOL);
  return out.length ? out : null;
}

/* Case numbers from the last HISTORY_DAYS only, newest last */
function recentCaseIds(rows){
  const since = addDays(todayStr(), -HISTORY_DAYS);
  const ev = rows.flatMap(r=> r.events || []).filter(x=> x.cid && x.d >= since).sort((a,b)=> a.d < b.d ? -1 : 1);
  return [...new Set(ev.map(x=> x.cid))];
}

/* A brand new case: a clean start. Strongest facts first, and only one
   short line naming the recent case numbers, no history. */
function freshCase(r){
  const ids = recentCaseIds([r]);
  return [
    `Subject: Competitive External Price Dispute, Equivalency Mismatch, ASIN ${r.asin}, SKU ${r.sku}`, '',
    'Hello,', '',
    'I am disputing the accuracy of the Competitive External Price for the listing below. This is a validation of pricing change request. Please route it to the Pricing Audit team.', '',
    `ASIN: ${r.asin}`, `SKU: ${r.sku}`, 'Brand: Barnyard Designs', 'Marketplace: US', `Threshold shown: ${usd(r.cpt)}${r.moved ? ', since ' + r.moved : ''}`, '',
    cptProductLines(r), '',
    caseEvidence(r, true), '',
    cptChannels(r), '',
    'Please confirm whether the reference is our exact product or an equivalent item, and revalidate the threshold.', '',
    ids.length ? 'Earlier case on this: ' + ids.slice(-2).join(', ') + '.' : '',
    '', 'Thank you,', 'MJ Baguhin on behalf of Jack Fallon (Registered Brand Owner)', 'Cross Path Capital LLC'
  ].filter((x,i,a)=> !(x === '' && a[i-1] === '')).join('\n');
}

/* One fresh case for several listings at once (all held 24x36 mats, say) */
function freshCaseGroup(rows){
  const list = rows.filter(r=> r.action === 'open' || r.action === 'follow');
  if(!list.length) return '';
  if(list.length === 1) return freshCase(list[0]);
  const ids = recentCaseIds(list);
  const sizes = [...new Set(list.map(r=> r.size).filter(Boolean))];
  // Strongest facts of the first listing of each size lead the case
  // In a group case "this listing" is unclear, so each fact names its SKU
  const lead = sizes.map(z=> list.find(r=> r.size === z)).filter(Boolean)
    .flatMap(r=> strongFacts(r).slice(0, 3).map(f=> ({w: f.w, t: f.t.replace(/this listing/g, r.sku)})))
    .sort((a,b)=> b.w - a.w).map(f=> f.t);
  return [
    `Subject: Competitive External Price Dispute, Equivalency Mismatch, ${list.length} Barnyard Designs ASINs (${list.map(r=> r.asin).join(', ')})`, '',
    'Hello,', '',
    'I am disputing the accuracy of the Competitive External Price for the listings below. This is a validation of pricing change request. Please route it to the Pricing Audit team.', '',
    'Key facts:', ...[...new Set(lead)].slice(0, 5).map((t,i)=> `${i + 1}. ${t}`), '',
    'The listings:',
    // groupEvidence opens with its own greeting and intro; skip those here
    groupEvidence(list).split('\n').slice(4).join('\n'), '',
    ids.length ? 'Earlier case on this: ' + ids.slice(-2).join(', ') + '.' : '',
    '', 'Thank you,', 'MJ Baguhin on behalf of Jack Fallon (Registered Brand Owner)', 'Cross Path Capital LLC'
  ].filter((x,i,a)=> !(x === '' && a[i-1] === '')).join('\n');
}

/* One follow-up for several listings, strongest facts first */
function followUpGroup(rows){
  const list = rows.filter(r=> r.action === 'open' || r.action === 'follow');
  if(!list.length) return null;
  if(list.length === 1) return followUpEmail(list[0]);
  const newestRep = list.map(r=> r.latestReply).filter(Boolean).sort((a,b)=> a.d < b.d ? 1 : -1)[0];
  if(newestRep && newestRep.ch === 'jassy') return jassyFollowUp(list);
  const ids = recentCaseIds(list);
  const sizes = [...new Set(list.map(r=> r.size).filter(Boolean))];
  const lead = sizes.map(z=> list.find(r=> r.size === z)).filter(Boolean)
    .flatMap(r=> strongFacts(r).slice(0, 3).map(f=> ({w: f.w, t: f.t.replace(/this listing/g, r.sku)})))
    .sort((a,b)=> b.w - a.w).map(f=> f.t);
  const restored = list.some(r=> ((r.events || [])[0] || {}).kind === 'restored');
  // Reply on the newest case any of these listings has
  const newest = list.flatMap(r=> r.events || []).filter(x=> x.cid).sort((a,b)=> a.d < b.d ? 1 : -1)[0];
  if(newest){ const k = ids.indexOf(newest.cid); if(k > -1){ ids.splice(k, 1); ids.push(newest.cid); } }
  const body = ['Hello,', '',
    `I am following up on ${ids.length ? 'case ' + ids.slice(-1)[0] : 'our earlier request'} about ${list.map(r=> r.asin).join(', ')}.`, '',
    (restored ? 'Thank you for checking. My request is about the accuracy of the Competitive External Price itself. ' : '') +
      `I am disputing the accuracy of the Competitive External Price. As of ${longToday()}, Pricing Health shows these thresholds:`, '',
    ...list.map(r=> `- ${r.asin} (${r.sku}): threshold ${usd(r.cpt)}`), '',
    'Key facts:', ...[...new Set(lead)].slice(0, 5).map((t,i)=> `${i + 1}. ${t}`), '',
    cptChannels(list), '',
    'Could you please route this to the Pricing Audit team, confirm whether each reference is our exact product or an item assessed as equivalent, and revalidate the thresholds? Thank you.', '',
    ids.length ? 'Related cases: ' + ids.join(', ') : '', '',
    'Best regards,', 'MJ Baguhin on behalf of Jack Fallon (Registered Brand Owner)', 'Cross Path Capital LLC'].filter((x,i,a)=> !(x === '' && a[i-1] === '')).join('\n');
  const lastRep = list.map(r=> r.latestReply).filter(Boolean).sort((a,b)=> a.d < b.d ? 1 : -1)[0] || null;
  const toJassy = lastRep ? lastRep.ch === 'jassy' : list.some(r=> ((r.events || [])[0] || {}).ch === 'jassy');
  return {subject: lastRep && lastRep.subject ? (/^re:/i.test(lastRep.subject) ? lastRep.subject : 'RE: ' + lastRep.subject)
                   : `Follow-up: Competitive Price Threshold on ${list.map(r=> r.asin).join(', ')}`, body:body.split('\n').map(noDash).join('\n'),
          toJassy, to: toJassy ? (lastRep && /@amazon\./i.test(lastRep.from || '') && lastRep.ch === 'jassy' ? lastRep.from : MAIL.jassy) : '',
          caseId: (lastRep && lastRep.cid) || ids.slice(-1)[0] || ''};
}

/* Today's date written out, so every number in a draft is dated */
function longToday(){ return new Date().toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'}); }

/* Short case history for one or more listings, oldest first, one line per
   event: date, what happened, case number. Auto replies are left out. */
const HISTORY_DAYS = 30;
function caseHistory(rows){
  const seen = {}, out = [];
  const since = addDays(todayStr(), -HISTORY_DAYS);
  rows.flatMap(r=> (r.events || []).map(x=> Object.assign({sku:r.sku}, x)))
    .filter(x=> x.kind !== 'received' && x.d >= since)
    // Same day: our message comes before Amazon's answer to it
    .sort((a,b)=> a.d < b.d ? -1 : a.d > b.d ? 1 : (a.who === 'us' ? -1 : 0) - (b.who === 'us' ? -1 : 0))
    .forEach(x=>{
      const what = x.who === 'us'
        ? (x.ch === 'jassy' ? 'We wrote to the Andy Jassy team' : 'We wrote on the case')
        : ({rejected:'Amazon kept the threshold', resolved:'Amazon closed the case', restored:'Amazon said the Featured Offer is back, threshold unchanged',
            replied:'Amazon replied', fixed:'Amazon said it was fixed'})[x.kind] || 'Amazon replied';
      const key = x.d + what + (x.cid || '');
      if(seen[key]) return; seen[key] = 1;
      out.push(`- ${shortDate(x.d)}: ${what}${x.cid ? ' (case ' + x.cid + ')' : ''}`);
    });
  return out.length ? ['Recent history:'].concat(out.slice(-6)) : [];
}

/* ---------- answering Amazon's latest reply ----------
   CPT Watch saves the text of Amazon's newest real reply (r.latestReply).
   Every follow-up quotes the sentence that matters and answers that point,
   instead of assuming what Amazon said. */
const REASONS = [
  {k:'retailer', re:/another retailer|other retailers?|external|outside (?:of )?amazon|off[- ]amazon|elsewhere/i,
   a: r=> 'I am disputing the accuracy of the Competitive External Price. Please confirm whether the reference is our exact product or an item assessed as equivalent. The facts below are about that.'},
  {k:'noshare', re:/(?:cannot|can not|can't|unable to|not able to|not in a position to) (?:be )?shar|confidential|cannot disclose|unable to disclose/i,
   a: r=> 'We understand Amazon cannot name the retailer. We only ask you to confirm whether the reference is our exact product or an item assessed as equivalent, and to revalidate the threshold.'},
  {k:'auto', re:/automated|automatic|algorithm|system[- ]generated|our systems?/i,
   a: ()=> 'We understand the threshold is set by an automated system. That is why this is a validation of pricing change request. Please route it to the Pricing Audit team for revalidation.'},
  {k:'lower', re:/lower (?:your|the) price|reduce (?:your|the) price|adjust (?:your|the) price|price (?:your|the) item|match the/i,
   a: ()=> 'That is guidance on eligibility, which is not what I am asking. I am disputing that the competitive external price is accurate and requesting validation of the pricing change.'},
  {k:'pending', re:/pending|internal request|appropriate team|will follow up|once we have an update|investigat/i,
   a: ()=> 'Thank you for sending this to the pricing team. Could you share any update from them?'},
  {k:'restored', re:/featured offer/i,
   a: r=> `Thank you for checking. My request is about the accuracy of the Competitive External Price, which still shows ${usd(r.cpt)}. Please route it to the Pricing Audit team for revalidation.`},
  {k:'fixed', re:/eligible|reset|refreshed|updated/i,
   a: r=> `Thank you. As of ${longToday()}, the threshold on ${r.asin} is still ${usd(r.cpt)}, so the change has not taken effect.`},
  {k:'closed', re:/resolved|closed/i,
   a: r=> `The case was closed, but the threshold has not changed. As of ${longToday()} it is still ${usd(r.cpt)}.`}
];
function sentences(t){ return String(t || '').split(/(?<=[.!?])\s+/).map(x=> x.trim()).filter(x=> x.length > 15 && !/^(hello|hi|dear|greetings|my name is|thank you for (?:contacting|writing|your patience)|best regards|sincerely)/i.test(x)); }
function readReply(rep, r){
  if(!rep || !rep.text) return null;
  const ss = sentences(rep.text);
  const kindOrder = {rejected:['noshare','retailer','auto','lower'], pending:['pending'], received:['pending'], restored:['restored'],
                     fixed:['fixed'], resolved:['closed'], replied:['noshare','retailer','auto','lower','pending']};
  const keys = kindOrder[rep.kind] || kindOrder.replied;
  const hits = [];
  keys.forEach(k=>{ const R = REASONS.find(x=> x.k === k); const s0 = ss.find(x=> R.re.test(x)); if(s0 && !hits.some(h=> h.s === s0)) hits.push({k, s:s0, a:R.a(r)}); });
  // Rejections often give two reasons: answer up to two
  const use = rep.kind === 'rejected' || rep.kind === 'replied' ? hits.slice(0, 2) : hits.slice(0, 1);
  const quote = (use[0] ? use[0].s : (ss[0] || '')).replace(/["\u201c\u201d]/g, "'").slice(0, 240);
  return {quote, answers:use.map(h=> h.a), kinds:use.map(h=> h.k), date:rep.d, who:rep.ch === 'jassy' ? 'the Andy Jassy team' : 'Seller Support'};
}
function noDash(t){ return String(t).replace(/\s*[\u2013\u2014]\s*/g, ', '); }

/* ---------- Andy Jassy team follow-up (Oct 19 fix) ----------
   The first Jassy email already gave the full evidence. A follow-up must
   not repeat it. It answers the team's latest reply, says what changed
   since our last email, gives one key fact as a reminder, and asks for the
   pricing team's answer. It goes back on the same [CASE] so no new case
   is opened. */
function hasJassy(r){ return (r.mailCases || []).some(c=> c.ch === 'jassy') || (r.events || []).some(x=> x.ch === 'jassy'); }
function jassyInfo(rows){
  const cases = rows.flatMap(r=> (r.mailCases || []).filter(c=> c.ch === 'jassy'));
  const reps = cases.map(c=> c.reply && Object.assign({cid:c.cid, ch:'jassy'}, c.reply)).filter(Boolean)
    .sort((a,b)=> a.d < b.d ? 1 : -1);
  const sent = rows.flatMap(r=> (r.events || []).filter(x=> x.ch === 'jassy' && x.who === 'us')).sort((a,b)=> a.d < b.d ? 1 : -1);
  const lastSent = sent[0] || null;
  // A real answer from the team first. With none, the newest auto receipt,
  // but only when it is not older than our last email (then it is old news)
  let rep = reps.find(x=> x.kind !== 'received') || null;
  if(!rep){ const rc = reps[0]; if(rc && (!lastSent || rc.d >= lastSent.d)) rep = rc; }
  // The email that started this case: our first one with its number, or our
  // last one before the team's reply when the case number came only in their reply
  let firstSent = null;
  if(rep && rep.cid){
    const onCase = sent.filter(x=> x.cid === rep.cid);
    // Their subject quotes ours ("Your Email to Andy Jassy - RE: <our subject>")
    const quoted = sent.filter(x=> x.subj && String(rep.subject || '').indexOf(x.subj.replace(/^(re|fw|fwd):\s*/i, '').slice(0, 50)) !== -1);
    firstSent = onCase.length ? onCase[onCase.length - 1] : quoted.length ? quoted[quoted.length - 1] : (sent.find(x=> x.d <= rep.d) || null);
  } else firstSent = lastSent;
  return {rep, firstSent, lastSent};
}
function cptOn(r, d){
  const pts = (r.h || []).filter(x=> x[1] !== null && x[0] <= d);
  return pts.length ? pts[pts.length - 1][1] : null;
}
function jassyFollowUp(rows){

const CHAT_MAX = 480;
function chunk(t){
  if(t.length <= CHAT_MAX) return [t];
  const out = []; let cur = '';
  t.split(/(?<=[.!?])\s+/).forEach(x=>{ if((cur + ' ' + x).trim().length > CHAT_MAX && cur){ out.push(cur.trim()); cur = x; } else cur = (cur + ' ' + x).trim(); });
  if(cur) out.push(cur.trim());
  return out;
}
function pitchFacts(list){
  const sizes = [...new Set(list.map(r=> r.size).filter(Boolean))];
  const heads = list.length > 1 ? (sizes.length ? sizes.map(z=> list.find(r=> r.size === z)) : [list[0]]) : list;
  const all = heads.flatMap(r=> strongFacts(r).filter(f=> f.w >= 3).slice(0, 3).map(f=> list.length > 1 ? f.t.replace(/this listing/g, r.sku) : f.t));
  return [...new Set(all)].slice(0, 3);
}
function buildPitch(rows, mode, repOverride){

  const r0 = list[0];

  const read = mode === 'follow' ? readReply(rep, r0) : null;
  const ids = recentCaseIds(list);
  const cid = mode === 'follow' ? ((rep && rep.cid) || ((r0.mailCases || [])[0] || {}).cid || ids.slice(-1)[0] || '') : '';
  const asinTxt = one ? `ASIN ${one.asin} (SKU ${one.sku}, ${one.size ? one.size + ' ' : ''}${cptTitle(one)})` : `${list.length} ASINs: ${list.map(r=> r.asin + ' (' + r.sku + ')').join(', ')}`;
  // The threshold as Pricing Health shows it. Never our own price (KB CPT notes)
  const priceTxt = one
    ? `Pricing Health shows a Competitive Price Threshold of ${usd(one.cpt)}${one.moved ? ' since ' + shortDate(one.moved) : ''}.`
    : 'Pricing Health shows these Competitive Price Thresholds: ' + list.map(r=> `${r.asin} ${usd(r.cpt)}`).join(', ') + '.';
  const facts = pitchFacts(list);
  const ref = one && likelyRefs(one).length ? refLine(likelyRefs(one)[0]) : '';
  const older = mode === 'fresh' && ids.length ? ` Earlier case: ${ids.slice(-2).join(', ')}.` : '';
  const ask = `Please route this to the Pricing Audit team, confirm whether the reference is our exact product or an item assessed as equivalent, and revalidate the threshold.`;
  const ifSay = [

    ['"It is set by an automated system, we cannot change it."', 'That is why this is a validation of pricing change request. Please route it to the Pricing Audit team for revalidation.'],
    ['"Lower your price" or "here is how to become eligible."', 'That is guidance on eligibility, which is not what I am asking. I am disputing that the competitive external price is accurate and requesting validation of the pricing change.'],
    ['"Your price is not competitive with another retailer."', `Our price on every channel we operate is at or above our Amazon price. I am asking you to check whether the item used is equivalent to ours.${facts[0] ? ' For example: ' + facts[0] : ''}`]

  // Chat: short messages, one point each
  const chat = [];
  // Opening line from the CPT playbook, so the agent does not treat it as a pricing question
  chat.push(...chunk(`Hi, I am MJ from Barnyard Designs, writing on behalf of Jack Fallon, the Registered Brand Owner. ` +
    `I am disputing the accuracy of the Competitive External Price for ${asinTxt}. This is a validation of pricing change request. ` +
    'I am not asking how to become Featured Offer eligible.' + (cid ? ` This is about case ${cid}.` : older)));
  chat.push(...chunk(`${priceTxt} It is set by Amazon's automated system. I am disputing that the competitive external price has changed, and I want you to check whether the external price has changed.`));
  if(read) chat.push(...chunk(`On ${shortDate(read.date)}, ${read.who} said: "${read.quote}" ${read.answers.join(' ')}`));
  facts.forEach((f,i)=> chat.push(...chunk(`Fact ${i + 1}: ${f}`)));
  if(ref) chat.push(...chunk(`Is the reference ${ref}? If so, please compare the two products side by side.`));
  chat.push(ask + (cid ? ` Please add these notes to case ${cid}.` : ' Please open a case.'));
  chat.push('Before we finish, could you please confirm in writing that this is routed to the Pricing Audit team, send me the case ID, and confirm all the ASINs above are covered in that case?');

  // Call: what to say, in order
  const call = [
    'BEFORE THE CALL',
    `Have open: ${cid ? 'case ' + cid + ', ' : ''}this page, and the ASIN${one ? '' : 's'} above.`, '',
    '1. SAY WHO YOU ARE',
    `"Hi, my name is MJ Baguhin. I am calling for Barnyard Designs, on behalf of Jack Fallon, the Registered Brand Owner, about ${asinTxt}.${cid ? ' I am calling about case ' + cid.split('').join(' ') + '.' : ''}"`, '',
    '2. SAY THE PROBLEM',
    `"I am disputing the accuracy of the Competitive External Price. This is a validation of pricing change request, not a question about how to become Featured Offer eligible. ${priceTxt} It is set by Amazon's automated system."`, '',
    ...(read ? ['3. ANSWER WHAT AMAZON SAID LAST',

      `Say: "${read.answers.join(' ')}"`, ''] : []),
    `${read ? 4 : 3}. GIVE THE FACTS (slowly, one at a time)`,
    ...facts.map((f,i)=> `   ${String.fromCharCode(97 + i)}) "${f}"`),
    ...(ref ? [`   ${String.fromCharCode(97 + facts.length)}) "Is the reference ${ref}?"`] : []), '',

    'IF THEY SAY...',
    ...ifSay.map(x=> `${x[0]}\n   Say: "${x[1]}"`)
  ];
  return {chat:chat.map(noDash), call:call.map(noDash).join('\n'), ifSay:ifSay.map(x=> [x[0], noDash(x[1])]), cid, read};
}

const ACTIONS = {
  open:   {rank:0, label:'Open a case',        group:'Open a case with Amazon'},
  follow: {rank:1, label:'Follow up',          group:'Follow up on the case on file'},
  watch:  {rank:2, label:'Price to target',    group:'Priced above the CPT, no case needed'},
  oos:    {rank:2.5, label:'Out of stock, skip', group:'Out of stock, no case for now'},
  none:   {rank:3, label:'',                   group:'No action'}
};
function cptAction(r){
  // No stock, no sales to protect: do not spend time on a case until it is back
  if(r.avail === 0 && (r.held || r.gap > 0 || (r.target !== null && r.short > 0.005))) return 'oos';
  const onFile = (r.cases && r.cases.length) ? r.cases : (openCaseFor(r.asin) ? [openCaseFor(r.asin).id] : []);
  r.caseIds = onFile;
  // Coir: any CPT under our sale price for the size needs a case ("we want the CPT up anyways")
  if(r.target !== null){
    if(r.short > 0.005) return onFile.length ? 'follow' : 'open';
    return r.gap > 0 ? 'watch' : 'none';
  }
  const under = r.gap > 0 ? r.pct : (r.held ? r.listPct : null);
  if(under !== null && under >= CASE_RULES.heldPct) return onFile.length ? 'follow' : 'open';
  if(r.gap > 0) return 'watch';
  return 'none';
}

function caseVerdict(r){
  const why = [];
  if(!(r.gap > 0) && !r.held) return {level:'none', label:'Not flagged', points:0, why};
  let pts = 0;

  const pct = r.target !== null ? r.shortPct : (r.gap > 0 ? r.pct : r.listPct);
  if(r.target !== null && r.short > 0)
    why.push(`CPT ${usd(r.cpt)} is ${usd(r.short)} (${r.shortPct}%) under our ${r.size} sale price of ${usd(r.target)}`);
  else if(r.held) why.push(`Held down: we lowered the price to ${usd(r.ours)} to keep the Buy Box, but our regular price is ${usd(r.list)}`);
  if(pct >= CASE_RULES.bigGapPct){ pts += 2; why.push(`${r.held ? 'Regular price' : 'Our price'} is ${pct}% above the CPT, too far for a normal price difference`); }
  else if(pct >= CASE_RULES.midGapPct){ pts += 1; why.push(`${r.held ? 'Regular price' : 'Our price'} is ${pct}% above the CPT`); }

  const same = (r.sim || []).filter(x=> x.market !== 'Amazon');
  const pool = same.length ? same : (r.sim || []);
  if(pool.length){
    const lo = pool[0].price, med = median(pool);
    if(r.cpt < lo * (1 - CASE_RULES.belowSimPct / 100)){
      pts += 2; why.push(`CPT ${usd(r.cpt)} is below every similar ${r.size} mat we found (cheapest ${usd(lo)}), so Amazon likely matched a smaller or different product`);
    } else if(med && r.cpt <= med * (1 - CASE_RULES.medianPct / 100)){
      pts += 1; why.push(`CPT is ${Math.round((1 - r.cpt / med) * 100)}% under the median similar ${r.size} mat (${usd(med)})`);
    }
  }

  // A recent drop usually means a new match, which is the easiest to dispute
  const cut = new Date(Date.now() - CASE_RULES.dropDays * 86400000).toISOString().slice(0,10);
  const before = (r.h || []).filter(x=> x[0] < cut && x[1] !== null).slice(-1)[0];
  if(before && before[1] && r.cpt <= before[1] * (1 - CASE_RULES.dropPct / 100)){
    pts += 1; why.push(`CPT dropped from ${usd(before[1])} to ${usd(r.cpt)} in the last ${CASE_RULES.dropDays} days`);
  }

  if(r.tier === 'A' || r.tier === 'B'){ pts += 1; why.push(`Tier ${r.tier}, worth the effort`); }
  if(r.avail === 0){ pts -= 1; why.push('Out of stock right now, lower priority'); }

  const open = openCaseFor(r.asin);
  if(open) return {level:'open', label:'Case open', points:pts, why, open};
  if(pts >= CASE_RULES.strong)   return {level:'strong',   label:'Strong case',   points:pts, why};
  if(pts >= CASE_RULES.possible) return {level:'possible', label:'Possible case', points:pts, why};
  // Under the target, a case is wanted anyway (Haris: "we want the CPT up"), so no "weak" warning there
  return {level:'price', label:'Price fix', points:pts,
          why: r.target !== null && r.short > 0.005 ? why : why.concat(['Signals are weak, so a case is unlikely to win. This looks like a pricing call for Haris.'])};
}

/* Text for a case, built from the numbers on screen */
/* Our product, from the KB case script. Construction and pile height are only
   true after the listing is updated (KB CPT Research Notes, section 2), so the
   pile height stays a bracket for the latest V-Trust number. */
function cptProductLines(r){
  const coir = /^DMC-/.test(r.sku || '');
  return coir
    ? '[CHECK FIRST, then delete this line: the live listing shows Tufted and the V-Trust pile height (KB CPT notes, section 2). If not, update it before you send.]\n' +
      `Our product: ${r.size || '[size]'}, coir, tufted construction, PVC backing, [pile height] pile height (V-Trust inspection, [report date]).\n` +
      'The reference appears to be an item assessed as equivalent. The closest match we found, [retailer and item], is [construction], [size].\n' +
      'Tufted and flat woven are different constructions, not a surface treatment.'
    : `Our product: ${r.size || '[size]'}, [material], [construction].`;
}
function caseEvidence(r, inScript){
  const pool = (r.sim || []).filter(x=> x.market !== 'Amazon');
  const lines = [
    `ASIN: ${r.asin}   SKU: ${r.sku}`,
    `Product: ${r.name}${r.size ? ' (' + r.size + ' inches)' : ''}`,
    `Competitive Price Threshold shown in Pricing Health: ${usd(r.cpt)}`,
    cptChannels(r),
  ];
  if(inScript) lines.splice(0, 4);   // the KB case script already has these
  if(r.moved) lines.push('', `The threshold moved from ${usd(r.from)} to ${usd(r.cpt)} on ${r.moved}.`);
  // Outside prices are not listed here: many are below our CPT and would weaken
  // the case. strongFacts() adds them only when every one is above the CPT.
  const top = strongFacts(r).slice(0, 4);
  if(top.length){ lines.push('', 'Key facts:'); top.forEach((f,i)=> lines.push(`${i + 1}. ${f.t}`)); }
  const lr = likelyRefs(r);
  // A question, not a claim: we do not know which item Amazon used
  if(lr.length) lines.push('', 'Is the reference ' + refLine(lr[0]) + '? If so, please compare the two products side by side.');
  const fair = r.size ? fairSiblings(r.size, [r.asin]) : [];
  // Other listings of the same size stuck at this exact threshold
  const twins = r.size ? cptRows().filter(x=> x.asin !== r.asin && x.size === r.size && x.cpt === r.cpt &&
                  (x.held || x.gap > 0) && (x.sku || '').split('-')[0] === (r.sku || '').split('-')[0]) : [];
  if(twins.length && !top.length) lines.push('', `${twins.map(x=> 'ASIN ' + x.asin + ' (SKU ' + x.sku + ', ' + cptTitle(x) + ')').join(' and ')} `+
    `${twins.length > 1 ? 'are' : 'is'} held at the exact same ${usd(r.cpt)} threshold, although the designs differ. `+
    '');
  if(fair.length){
    lines.push('', top.length ? 'Details, the same-size listings with a higher threshold:' : siblingHead(fair, r.size, [r.cpt]));
    fair.slice(0, 6).forEach(x=> lines.push(`- ASIN ${x.asin} (SKU ${x.sku}, ${cptTitle(x)}): threshold ${usd(x.cpt)}`));
  }

  return lines.join('\n');
}

  move:    r=> daysSince(r.moved),
  sim:     r=> r.simMatch ? Math.abs(r.simMatch.diff) : null,
  verdict: r=> ACTIONS[r.action].rank * 10 - (r.verdict.points || 0),
  stock:   r=> r.avail,
  // CPT change over the last 30 days
  trend:   r=>{ const p = (r.h || []).slice(-30).filter(x=> x[1] !== null && x[1] !== undefined); return p.length > 1 ? p[p.length - 1][1] - p[0][1] : null; }
};

/* Tiny two-line trend for the row: CPT solid, our price dashed */
function miniSpark(h){
  const pts = (h || []).slice(-30);
  if(pts.length < 2) return '<span class="mut">\u2014</span>';
  const W = 110, H = 30, P = 3, vs = [];
  pts.forEach(x=>{ if(x[1] !== null) vs.push(x[1]); if(x[2] !== null && x[2] !== undefined) vs.push(x[2]); });
  if(!vs.length) return '<span class="mut">\u2014</span>';
  const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
  const X = i => P + i * (W - 2*P) / (pts.length - 1), Y = v => H - P - (v - lo) * (H - 2*P) / span;
  const path = k =>{ let d = '', pen = false;
    pts.forEach((x,i)=>{ const v = x[k];
      if(v === null || v === undefined){ pen = false; return; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; pen = true; });
    return d; };
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`+
    `<path d="${path(2)}" fill="none" stroke="var(--byd)" stroke-width="1.6" stroke-dasharray="4 3"/>`+
    `<path d="${path(1)}" fill="none" stroke="var(--accent)" stroke-width="1.8"/></svg>`;
}

/* "Barnyard Designs Natural Coco Coir Non-Slip Doormat (30x48, Welcome)"
   reads as "Welcome coir doormat": the style is what tells rows apart. */
function cptTitle(r){
  const n = String(r.name || '');
  const m = n.match(/\(([^)]*)\)\s*$/) || n.match(/\(([^)]*)\)/);
  if(m){
    const style = m[1].split(',').map(x=> x.trim()).filter(x=> x && !matSize(x)).join(', ');
    if(style && /coir|coco/i.test(n)) return style + ' coir doormat';
    if(style) return style;
  }
  return n.replace(/^Barnyard Designs\s*/i, '').replace(/^Seedboy\s*/i, '').split(/[|,]/)[0].trim() || r.sku;
}

function renderCpt(){

  // This view owns the screen: the shared table, bar and message step aside
  document.getElementById('msg').hidden = true;
  document.getElementById('bar').innerHTML = '';
  const v = document.getElementById('cptView');

  const all    = cptRows();
  const over   = all.filter(r=> r.gap !== null && r.gap > 0);
  const recent = all.filter(r=>{ const n = daysSince(r.moved); return n !== null && n <= CPT_RECENT; });
  const none   = CPT.length - all.length;
  const worst  = over.slice().sort((a,b)=> b.gap - a.gap)[0];
  const today  = new Date().toISOString().slice(0,10);
  const fresh  = CPT_META.updated && CPT_META.updated.slice(0,10) >= new Date(Date.now() - 2*86400000).toISOString().slice(0,10);

  // Filter and search
  let rows = all;
  if(CPT_F.show === 'over')   rows = over;
  if(CPT_F.show === 'moved')  rows = recent;
  if(CPT_F.show === 'held')   rows = all.filter(r=> r.held);
  if(CPT_F.show === 'reply')  rows = all.filter(r=> r.mail && r.mail.needsReply);
  if(CPT_F.show === 'due')    rows = all.filter(r=> { const n = nextStep(r); return n && n.due === 'now'; });
  if(CPT_F.show === 'need')   rows = all.filter(r=> r.action === 'open' || r.action === 'follow');
  if(CPT_F.show === 'cases')  rows = all.filter(r=> r.verdict.level === 'strong' || r.verdict.level === 'possible');
  // Column filters: min and max per column, tier, stock, open cases
  CPT_RANGE.forEach(c=>{
    const k = c[0] + (c[2] === '%' ? '' : ''), lo = CPT_F.min[c[0] + c[2]], hi = CPT_F.max[c[0] + c[2]];
    if(lo === undefined && hi === undefined) return;
    rows = rows.filter(r=>{
      const v = r[c[0]];
      if(v === null || v === undefined) return false;
      return (lo === undefined || v >= lo) && (hi === undefined || v <= hi);
    });
  });
  if(CPT_F.tiers.size) rows = rows.filter(r=> CPT_F.tiers.has(r.tier || 'N'));
  if(CPT_F.sizes.size) rows = rows.filter(r=> CPT_F.sizes.has(r.size || 'no size'));
  if(CPT_F.stockOnly)  rows = rows.filter(r=> r.avail !== null && r.avail > 0);
  if(CPT_F.hideOpen)   rows = rows.filter(r=> r.verdict.level !== 'open');
  if(CPT_F.q){
    const q = CPT_F.q.toLowerCase();
    rows = rows.filter(r=> (r.sku + ' ' + r.asin + ' ' + r.name).toLowerCase().indexOf(q) !== -1);
  }
  // A chosen column wins; otherwise flagged first, biggest gap on top.
  // Grouped views keep this order inside each family.
  if(CPT_F.sort && CPT_SORT[CPT_F.sort]) rows = sortBy(rows, CPT_SORT[CPT_F.sort], CPT_F.dir);
  CPT_SHOWN = rows;

  const tile = (k, val, cls, note) =>
    `<div class="cpt-tile"><div class="k">${k}</div><div class="v ${cls || ''}">${val}</div>`+
    `<div class="n">${note || '&nbsp;'}</div></div>`;

  let html = stockAlert() +
    '<section class="cpt-top">'+
      '<div class="cpt-head">'+
        '<h2>CPT tracker</h2>'+
        `<span class="sub">Amazon US, ${CPT.length} active ASINs checked</span>`+
        (CPT_META.updated ? `<span class="cpt-live${fresh ? '' : ' stale'}"><i></i>Updated ${esc(CPT_META.updated)} ET, daily</span>` : '')+
      '</div>'+
      '<div class="cpt-tiles">'+
        tile('Needs a case', all.filter(r=> r.action === 'open').length +
             `<span style="font-size:1rem;color:var(--c-night-mut)"> new, ${all.filter(r=> r.action === 'follow').length} follow up</span>`,
             all.some(r=> r.action === 'open' || r.action === 'follow') ? 'bad' : '',
             esc(all.filter(r=> r.action === 'open' || r.action === 'follow').map(r=> r.sku).slice(0,4).join(', ')) || 'Nothing to raise today')+
        (()=>{ const due = all.filter(r=> { const n = nextStep(r); return n && n.due === 'now'; });
           return tile('Do today', due.length, due.length ? 'bad' : 'good',
             due.length ? esc(due.map(r=> r.sku).slice(0,3).join(', ')) : 'No follow-ups due'); })()+
        tile('Priced above the CPT ' + qi('buybox'), over.length, over.length ? 'bad' : '',
             over.length ? 'Featured Offer at risk on these' : 'None, every price is at or under')+
        tile('Held at the CPT', all.filter(r=> r.held).length, all.some(r=> r.held) ? 'warn' : '',
             'Price cut to the CPT, under our regular price')+
        tile('CPT moved, last 7 days', recent.length, recent.length ? 'warn' : '',
             recent.length ? recent.map(r=> esc(r.sku)).slice(0,3).join(', ') + (recent.length > 3 ? '\u2026' : '') : 'No changes this week')+
        tile('ASINs with a CPT', all.length, '',
             none ? none + ' with no CPT today' : 'All ASINs have one')+
      '</div>'+
    '</section>'+
    rbBanner()+
    (RB ? (()=>{ const n = all.filter(r=> (r.rb || []).some(h=> h.sev === 'amazon')); return `<div class="why"><b>Rule screening:</b> ${n.length ? `${n.length} listing${n.length === 1 ? '' : 's'} break${n.length === 1 ? 's' : ''} an Amazon pricing rule (${esc(n.map(r=> r.sku).slice(0,4).join(', '))}${n.length > 4 ? '\u2026' : ''}). Open a listing to see which.` : 'No listing breaks an Amazon pricing rule.'} <button class="work" data-rbopen="1">Rulebook</button></div>`; })() : '')+
    mk2Note('Case drafts here are written for the US team and amazon.com. Change the marketplace and currency before you send one for Canada.')+
    '<div class="cpt-tools">' + mk2Seg() +
      '<div class="seg" id="cptSeg">'+
        [['all','All ' + all.length],
         ['need','Needs a case ' + all.filter(r=> r.action === 'open' || r.action === 'follow').length],
         ['over','Over CPT ' + over.length], ['moved','Moved 7 days ' + recent.length],
         ['held','Held at CPT ' + all.filter(r=> r.held).length],
         ['due','Follow-up due ' + all.filter(r=> { const n = nextStep(r); return n && n.due === 'now'; }).length]]
          .map(b=> `<button data-show="${b[0]}" aria-pressed="${CPT_F.show === b[0]}">${b[1]}</button>`).join('')+
      '</div>'+
      '<span class="mut" style="font-size:.8rem;margin-left:.3rem">Group by</span>'+
      '<div class="seg" id="cptGrp">'+
        [['action','What to do'], ['none','Flat list'], ['parent','Parent name'], ['psku','Parent SKU'], ['pasin','Parent ASIN']]
          .map(b=> `<button data-g="${b[0]}" aria-pressed="${CPT_F.group === b[0]}">${b[1]}</button>`).join('')+
      '</div>'+
      `<input id="cptQ" type="search" placeholder="Search SKU, ASIN or product" value="${esc(CPT_F.q)}" aria-label="Search CPT tracker">`+
      (CPT_F.sort ? '<button id="cptUnsort" title="Back to the default order">Clear sort</button>' : '')+
      (rows.some(r=> r.action === 'open' || r.action === 'follow') ? `<button id="cptCaseAll" class="work">Copy one case for the ${rows.filter(r=> r.action === 'open' || r.action === 'follow').length} shown</button>` : '')+
      '<button id="cptLog">Price change log</button>'+
      `<button id="cptGuide" aria-pressed="${!!CPT_F.guide}">What do these prices mean?</button>`+
      `<button id="cptMore" aria-pressed="${CPT_F.more}">Column filters${activeCptFilters() ? ' <span class="fbadge">' + activeCptFilters() + '</span>' : ''}</button>`+
      dlBtns() +
      `<span class="count">${rows.length} of ${all.length}</span>`+
    '</div>'+
    (CPT_F.guide ? priceGuide() : '')+
    (CPT_F.more ? cptFilterPanel() : '');

  if(!all.length){
    html += CPT_ERR
      ? '<div class="cpt-empty"><b>CPT feed not found yet</b>Run setupCptWatchDaily in the CPC Keepa Fetcher project. It creates cpt.json on its first run.</div>'
      : `<div class="cpt-empty"><b>${CPT.length ? 'No ASIN has a CPT today' : 'Loading CPT'}</b>${CPT.length ? 'Amazon is not holding any of our listings to a competitive price right now.' : ''}</div>`;
  } else if(!rows.length){
    html += '<div class="cpt-empty"><b>Nothing matches</b>Clear the search or pick All.</div>';
  } else {
    const H = (k, label, cls, d) =>
      `<th data-s="${k}" data-d="${d || 'asc'}" class="${cls || ''}">${label}${qi(TIP_BY_HEAD[label.toLowerCase()])}${sortArrow(CPT_F, k)}</th>`;
    html += '<table class="cpt-table"><thead><tr>'+
      H('product', 'Product')+
      H('ours', 'Our price', 'b-ours c', 'desc')+
      H('sale', 'Sale price', 'b-ours c', 'desc')+
      H('cpt', 'CPT', 'b-cpt c', 'desc')+
      H('gap', 'Gap', 'b-gap c', 'desc')+
      H('move', 'Last CPT move', 'b-move')+
      H('sim', 'Similar at CPT price', 'b-sim')+
      H('verdict', 'What to do', 'b-case')+
      `<th data-s="trend" data-d="asc">30-day trend${qi('trend')}${sortArrow(CPT_F, 'trend')}</th>`+
      '</tr></thead><tbody>'+
      cptBody(rows)+
      '</tbody></table>';
  }

  v.innerHTML = html;
  wireCpt(v, all);
}

/* Rows, optionally under one header per parent family. A family header
   shows how many of its children are held above the CPT. */
/* Sizes present in today's CPT rows, small to large */
function cptSizes(){
  const area = z=>{ const m = /^(\d+)x(\d+)$/.exec(z); return m ? m[1] * m[2] : 1e9; };
  return [...new Set(cptRows().map(r=> r.size || 'no size'))].sort((a,b)=> area(a) - area(b));
}

/* Listings of the same size whose CPT equals our own price. Same brand, same
   material, same size, yet Amazon's threshold is fine for them, which shows
   the flagged ones were matched to something else. */
function fairSiblings(size, except){
  // Same product line only (DMC- coir with DMC- coir), so a rubber 2-pack
  // never stands in as proof for a coir mat
  const lines = new Set(cptRows().filter(r=> except.indexOf(r.asin) !== -1).map(r=> (r.sku || '').split('-')[0]));
  return cptRows().filter(r=> r.size === size && except.indexOf(r.asin) === -1 &&
    (!lines.size || lines.has((r.sku || '').split('-')[0])) &&
    r.cpt !== null && r.ours !== null && r.cpt >= r.ours - 0.01 && !r.held && !(r.gap > 0));
}

/* "Amazon's threshold for these is $59.95 to $69.95, while this one is held at $40.28" */
function siblingHead(fair, size, held){
  const v = fair.map(x=> x.cpt), lo = Math.min(...v), hi = Math.max(...v);
  const range = lo === hi ? usd(lo) : usd(lo) + ' to ' + usd(hi);
  const h = [...new Set(held)];
  const heldTxt = h.length === 1 ? usd(h[0]) : h.map(usd).join(' and ');
  return `Same brand, same material, same ${size} size. Amazon's threshold for these listings is ${range}, ` +
         `while ${held.length > 1 ? 'the listings above are' : 'this one is'} held at ${heldTxt}:`;
}

/* One case for several ASINs at once, usually all flagged mats of one size */
function groupEvidence(rows){
  const flagged = rows.filter(r=> r.action === 'open' || r.action === 'follow');
  if(!flagged.length) return '';
  const sizes = [...new Set(flagged.map(r=> r.size).filter(Boolean))];
  const L = [];
  L.push('Request: revalidate the Competitive External Price on the ASINs below.', '');
  L.push('', '');
  flagged.forEach(r=>{
    L.push(`ASIN ${r.asin} (SKU ${r.sku}), ${r.size || ''} ${cptTitle(r)}`);
    L.push(`  Threshold shown in Pricing Health: ${usd(r.cpt)}.`);
    if(r.moved) L.push(`  The threshold changed from ${usd(r.from)} to ${usd(r.cpt)} on ${r.moved}.`);
  });
  const same = {};
  flagged.forEach(r=>{ if(r.size) (same[r.size] = same[r.size] || []).push(r.cpt); });
  Object.keys(same).forEach(z=>{
    const v = same[z];
    if(v.length > 1 && v.every(x=> x === v[0]))
      L.push('', `${v.length === 2 ? 'Both' : 'All ' + v.length} flagged ${z} listings share the exact same threshold (${usd(v[0])}), even though their designs differ. `+
                 '');
  });
  sizes.forEach(z=>{
    const fair = fairSiblings(z, flagged.map(r=> r.asin));
    if(fair.length){
      L.push('', siblingHead(fair, z, flagged.filter(r=> r.size === z).map(r=> r.cpt)));
      fair.slice(0, 8).forEach(r=> L.push(`  ASIN ${r.asin} (SKU ${r.sku}, ${cptTitle(r)}): threshold ${usd(r.cpt)}`));
    }
    const held = flagged.filter(r=> r.size === z);
    const lr = held.length ? likelyRefs(held[0]) : [];
    if(lr.length) L.push('', `For ${z}: the reference appears to be an item assessed as equivalent. The closest match we found is ${refLine(lr[0])}. ` +
      'Only our designs sharing a name with that brand\u2019s mats are held to this threshold. Please confirm whether this is the reference item.');
    const out = [];
    if(out.length){
      L.push('', `Comparable ${z} coir doormats sold outside Amazon:`);
      out.slice(0, 5).forEach(x=> L.push(`  ${x.market}, ${x.brand || 'brand not listed'}: ${usd(x.price)}${x.link ? '  ' + x.link : ''}`));
    }
  });
  // Our channels from data, not a claim we cannot check (KB CPT notes)
  L.push('', cptChannels(flagged), '',
         'Please route this to the Pricing Audit team, confirm whether each reference is our exact product or an item assessed as equivalent, and revalidate the thresholds.');
  return L.join('\n');
}

function activeCptFilters(){
  return Object.keys(CPT_F.min).length + Object.keys(CPT_F.max).length +
    (CPT_F.tiers.size ? 1 : 0) + (CPT_F.sizes.size ? 1 : 0) + (CPT_F.stockOnly ? 1 : 0) + (CPT_F.hideOpen ? 1 : 0);
}

function cptFilterPanel(){
  const box = c=>{
    const id = c[0] + c[2], lo = CPT_F.min[id], hi = CPT_F.max[id];
    return `<div class="rf"><label>${c[1]} <span class="mut">(${c[2]})</span></label>`+
      `<input type="number" step="any" data-min="${id}" placeholder="min" value="${lo === undefined ? '' : lo}" aria-label="${c[1]} minimum">`+
      `<span class="mut">to</span>`+
      `<input type="number" step="any" data-max="${id}" placeholder="max" value="${hi === undefined ? '' : hi}" aria-label="${c[1]} maximum"></div>`;
  };
  return '<div class="cpt-filters">'+
    '<div class="rf-grid">' + CPT_RANGE.map(box).join('') + '</div>'+
    '<div class="rf-row">'+
      '<span class="lbl2">Size</span>'+
      cptSizes().map(z=> `<button data-size="${esc(z)}" aria-pressed="${CPT_F.sizes.has(z)}">${esc(z)}</button>`).join('')+
    '</div>'+
    '<div class="rf-row">'+
      '<span class="lbl2">Tier</span>'+
      ['A','B','N','C','X'].map(t=> `<button data-tier="${t}" aria-pressed="${CPT_F.tiers.has(t)}">${t}</button>`).join('')+
      `<button id="fStock" aria-pressed="${CPT_F.stockOnly}">In stock only</button>`+
      `<button id="fOpen" aria-pressed="${CPT_F.hideOpen}">Hide ones with a case open</button>`+
      '<button id="fClear" class="act">Clear column filters</button>'+
    '</div>'+
    '<div class="rf-tip">Tip for case hunting: Gap % min 20, Tier A and B, In stock only, Hide ones with a case open. '+
      'Or just tap <b>Needs a case</b> above.</div>'+
  '</div>';
}

function cptBody(rows){
  const key = CPT_F.group;
  if(key === 'none') return rows.map(cptRowHtml).join('');
  if(key === 'action'){
    return ['open','follow','watch','oos','none'].map(a=>{
      const g = rows.filter(r=> r.action === a);
      if(!g.length) return '';
      const sub = a === 'open' ? 'The CPT is below our sale price for the size. No case on file.'
               : a === 'follow' ? 'Same, but a case is already on file. Reply on it with the latest numbers.'
               : a === 'watch' ? 'The CPT is at or above our sale price, so we can sell at the sale price without a case.'
               : a === 'oos' ? 'The CPT is too low, but we have no stock to sell. Raise a case when stock is back.'
               : 'Our price and the CPT agree.';
      const btns = (a === 'open' || a === 'follow')
        ? `<div class="agh-b">`+
          (a === 'follow' ? `<button class="work strong" data-gfu="${a}">Draft one follow-up for these ${g.length}</button>` : '')+
          `<button class="work strong" data-gfresh="${a}">Draft one fresh case for these ${g.length}</button>`+
          `<button class="work strong" data-gmail="${a}">${g.some(hasJassy) ? 'Draft one Jassy follow-up for these ' : 'Draft one Jassy email for these '}${g.length}</button>`+
          `<button class="work" data-gfind="${a}">Find related emails</button></div>` : '';
      return `<tr class="gh agh agh-${a}"><td colspan="9"><div class="agh-t">${esc(ACTIONS[a].group)} `+
             `<span class="agh-n">${g.length}</span></div><div class="agh-s">${sub}</div>${btns}</td></tr>` +
             g.map(cptRowHtml).join('');
    }).join('');
  }
  const SOLO = '\uffffstandalone';
  const groups = {};
  rows.forEach(r=>{
    const k = r[key] || SOLO;
    (groups[k] = groups[k] || []).push(r);
  });
  // Families with something over the CPT first, standalone listings last
  return Object.keys(groups).sort((a,b)=>{
    if((a === SOLO) !== (b === SOLO)) return a === SOLO ? 1 : -1;
    const need = k=> groups[k].filter(r=> r.action === 'open' || r.action === 'follow').length;
    return need(b) - need(a) || a.localeCompare(b);
  }).map(k=>{
    const g = groups[k];
    // Same rule as the What to do column: a case to open or follow up
    const need = g.filter(r=> r.action === 'open' || r.action === 'follow').length;
    const lows = g.filter(r=> r.short > 0.005).map(r=> r.short).concat(g.filter(r=> r.gap > 0).map(r=> r.gap));
    return parentHeader(k === SOLO ? g.map(r=> Object.assign({}, r, {parent:'', psku:'', pasin:''})) : g, 9, [
      need ? `<span class="pgh-tag bad">${need} need${need === 1 ? 's' : ''} a case</span>` : '<span class="pgh-tag ok">Nothing to do</span>',
      lows.length ? `<span><span class="k">CPT most too low by</span><b>${usd(Math.max(...lows))}</b></span>` : ''
    ].filter(Boolean)) + g.map(cptRowHtml).join('');
  }).join('');
}

function stockTag(r){
  const inb = null;   // live data only: inbound is from the uploaded FBA CSV, so it is not used
  if(r.avail === null || r.avail === undefined) return '<span class="stk-tag">Stock unknown</span>';
  if(r.avail === 0) return `<span class="stk-tag oos" data-tip="No units ready to ship. No case needed until stock is back.">Out of stock${inb ? ', ' + inb + ' on the way' : ''}</span>`;
  const low = r.avail < 30;
  return `<span class="stk-tag ${low ? 'low' : ''}" data-tip="${esc(TIPS.avail)}">${Number(r.avail).toLocaleString('en-US')} in stock${inb ? ', ' + inb + ' on the way' : ''}</span>`;
}

function cptRowHtml(r){
        const bad = r.gap !== null && r.gap > 0;
        const n = daysSince(r.moved);
        const hot = n !== null && n <= CPT_RECENT;
        const brandDot = /barnyard/i.test(r.name) || /^DMC|^FM|^HD/i.test(r.sku) ? 'var(--byd)' : 'var(--sb)';
        return `<tr class="row act-${r.action}" tabindex="0" data-asin="${esc(r.asin)}">`+
          '<td class="prod">'+
            `<div class="p-name" title="${esc(r.name)}"><span class="dot" style="background:${brandDot}"></span>${esc(cptTitle(r).slice(0,48))}</div>`+
            `<div class="p-id"><span>SKU</span>${skuL(r.sku, MK2)}${cpy(r.sku)}</div>`+
            `<div class="p-id"><span>ASIN</span>${asinL(r.asin, MK2)}${cpy(r.asin)}</div>`+
            (r.size ? `<span class="p-size">${esc(r.size)}</span>` : '')+
            stockTag(r)+
          '</td>'+
          `<td class="c"><span class="cpill ours" data-tip="${esc(TIPS.ours)}">${usd(r.ours)}</span></td>`+
          `<td class="c">${r.sale !== null && r.sale !== undefined
              ? `<span class="cpill sale" data-tip="${esc(TIPS.sale)}">${usd(r.sale)}</span>` +
                (r.list ? `<span class="was" data-tip="${esc(TIPS.list)}">List ${usd(r.list)}</span>` : '')
              : '<span class="mut">No sale</span>'}`+
             (r.target !== null ? `<span class="tgt" data-tip="${esc(targetTip(r))}">Target ${usd(r.target)}</span>` : '')+'</td>'+
          `<td class="c"><span class="cpill cpt" data-tip="${esc(TIPS.cpt)}">${usd(r.cpt)}</span></td>`+
          `<td class="c">${r.gap === null ? '<span class="mut">\u2014</span>' :
             bad ? `<span class="gap-badge over" data-tip="${esc(TIPS.over)}">+${usd(r.gap)} &middot; ${r.pct}%</span>`
             : r.target !== null && r.short > 0.005 ? `<span class="gap-badge over" data-tip="${esc(TIPS.under)}">CPT ${usd(r.short)} too low</span><span class="was">${r.shortPct}% under the target</span>`
             : r.held ? `<span class="gap-badge held" data-tip="${esc(TIPS.held)}">Held at CPT</span><span class="was">${r.listPct}% under list</span>`
                 : `<span class="gap-badge ok" data-tip="${esc(TIPS.ok)}">At or under</span>`}</td>`+
          `<td class="move">${r.moved
              ? `${usd(r.from)} to ${usd(r.cpt)}<span class="ago${hot ? ' hot' : ''}">${n === 0 ? 'today' : n === 1 ? 'yesterday' : n + ' days ago'}</span>`
              : '<span class="mut">No change seen</span>'}</td>`+
          `<td class="sim">${simCell(r)}</td>`+
          `<td>${r.action === 'none' ? '<span class="mut">\u2014</span>' :
             `<span class="ac ac-${r.action}" title="${esc(r.verdict.why.join('. '))}">${esc(ACTIONS[r.action].label)}</span>`+
             (r.action === 'follow' && r.caseIds.length ? `<span class="was mono">${esc(r.caseIds[r.caseIds.length - 1])}</span>` : '')}`+
             nextLine(r) +
             ((r.action === 'open' || r.action === 'follow')
               ? '<div class="draft-btns">'+
                 ((r.action === 'follow' || (r.events || []).length) ? `<button class="work fresh-btn" data-fu="${esc(r.asin)}">Draft a follow-up</button>` : '')+
                 `<button class="work fresh-btn" data-fresh="${esc(r.asin)}">Draft a fresh case</button></div>` : '') + '</td>'+
          `<td class="trend">${miniSpark(r.h)}</td>`+
          '</tr>';
}

  });
}

/* CPT (solid) and our price (dashed) on one scale, so the gap between them
   is the picture: lines apart means we are priced over the threshold. */
function sparkSvg(h){
  if(h.length < 2) return '';
  const W = 320, H = 64, P = 4;
  const vs = [];
  h.forEach(x=>{ if(x[1] !== null) vs.push(x[1]); if(x[2] !== null && x[2] !== undefined) vs.push(x[2]); });
  if(!vs.length) return '';
  const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
  const X = i => P + i * (W - 2*P) / (h.length - 1);
  const Y = v => H - P - (v - lo) * (H - 2*P) / span;
  function path(k){
    let d = '', pen = false;
    h.forEach((x,i)=>{
      const v = x[k];
      if(v === null || v === undefined){ pen = false; return; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      pen = true;
    });
    return d;
  }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" `+
    `aria-label="CPT and our price, ${usd(lo)} to ${usd(hi)}, over ${h.length} days">`+
    `<path d="${path(2)}" fill="none" stroke="var(--byd)" stroke-width="2" stroke-dasharray="5 4"/>`+
    `<path d="${path(1)}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`+
    `<div class="mut" style="font-size:.74rem;margin-bottom:.4rem">`+
    `<span style="color:var(--accent);font-weight:700">\u2014</span> CPT &nbsp; `+
    `<span style="color:var(--byd);font-weight:700">- -</span> Our price</div>`;
}

function simCell(r){
  const m = r.simMatch;
  if(!m) return '<span class="mut">\u2014</span>';
  const x = m.item, where = `<span class="where">${esc(x.market)}${x.brand ? ', ' + esc(x.brand) : ''}</span>`;
  const name = `<span class="where">${esc(String(x.name || '').slice(0, 40))}</span>`;
  const price = x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${usd(x.price)}</a>` : usd(x.price);
  if(m.exact) return `<span class="lo" style="color:#b42318" data-tip="Priced exactly at our CPT. Amazon most likely copied this price.">Matches CPT ${price}</span>${where}${name}`;
  const note = (m.diff > 0 ? usd(m.diff) + ' above' : usd(-m.diff) + ' below') + ' the CPT' + (m.onAmazon ? ', on Amazon' : '');
  return `<span class="lo">${price}</span><span class="was">Closest, ${note}</span>${where}${name}`;
}

function simBlock(r){
  if(!(r.gap > 0 || r.held) || !(r.size || (r.sim && r.sim.length))) return '';
  const all = r.sim || [];
  const amz = all.filter(x=> x.market === 'Amazon'), out = all.filter(x=> x.market !== 'Amazon');
  if(!all.length) return `<h2 style="margin-top:1.1rem">Similar ${r.size ? esc(r.size) + ' ' : ''}items</h2>`+
    `<p class="mut" style="font-size:.84rem">None found yet. Amazon prices update every morning. Add Walmart, Wayfair or Temu prices in the Outside Amazon tab.</p>`;
  // Amazon sellers never set the CPT, so only outside listings can be the match
  const near = r.cpt !== null ? out.filter(x=> Math.abs(x.price - r.cpt) <= 3) : [];
  return `<h2 style="margin-top:1.1rem">Similar ${r.size ? esc(r.size) + ' ' : ''}items</h2>`+
    '<dl>'+
    `<dt>On Amazon</dt><dd>${amz.length ? amz.length + ' listings, lowest ' + usd(amz[0].price) + ', median ' + usd(median(amz)) : '<span class="mut">none yet</span>'}</dd>`+
    `<dt>Outside Amazon</dt><dd>${out.length ? out.length + ' listings, lowest ' + usd(out[0].price) + ', median ' + usd(median(out)) : '<span class="mut">none added</span>'}</dd>`+
    (r.simMatch ? `<dt>Closest to the CPT</dt><dd${r.simMatch.exact ? ' class="warn"' : ''}>${esc(r.simMatch.item.market)}${r.simMatch.item.brand ? ', ' + esc(r.simMatch.item.brand) : ''}, ${usd(r.simMatch.item.price)}: ${r.simMatch.exact ? 'matches the CPT' : (r.simMatch.diff > 0 ? usd(r.simMatch.diff) + ' above' : usd(-r.simMatch.diff) + ' below') + ' the CPT'}</dd>` : '')+
    (near.length ? `<dt>Near the CPT</dt><dd class="warn">${near.length} priced within $3 of ${usd(r.cpt)}, possible source of the CPT</dd>` : '')+
    '</dl>'+
    '<table class="hist"><thead><tr><th>Where</th><th>Brand</th><th>Product</th><th class="num">Price</th></tr></thead><tbody>'+
    all.slice().sort((a,b)=> r.cpt === null ? a.price - b.price : Math.abs(a.price - r.cpt) - Math.abs(b.price - r.cpt)).slice(0, 10).map(x=>{
      const hot = x.market !== 'Amazon' && r.cpt !== null && Math.abs(x.price - r.cpt) <= 3;
      const nm = esc(String(x.name).slice(0, 60));
      return `<tr><td>${esc(x.market)}</td><td>${esc(x.brand || '')}</td>`+
        `<td>${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${nm}</a>` : nm}</td>`+
        `<td class="num ${hot ? 'warn' : ''}">${usd(x.price)}</td></tr>`;
    }).join('')+
    '</tbody></table>'+
    (all.length > 10 ? `<p class="mut" style="font-size:.78rem;margin-top:.3rem">The 10 closest to the CPT of ${all.length} shown.</p>` : '');
}

/* One row per day (the last reading of the day), with the change from the
   day before for both our price and the CPT */
function dailyRows(r){
  const byDay = {};
  (r.h || []).forEach(x=>{ byDay[x[0]] = {d:x[0], cpt:x[1], ours:x[2] === undefined ? null : x[2]}; });
  const days = Object.keys(byDay).sort().map(k=> byDay[k]);
  days.forEach((x,i)=>{
    const p = i ? days[i-1] : null;
    x.dCpt  = p && x.cpt !== null && p.cpt !== null ? Math.round((x.cpt - p.cpt) * 100) / 100 : null;
    x.dOurs = p && x.ours !== null && p.ours !== null ? Math.round((x.ours - p.ours) * 100) / 100 : null;
    x.first = !p;
  });
  return days;
}
const signed = v=> v === null || v === 0 ? '' : (v > 0 ? '+' : '-') + usd(Math.abs(v));

function dailyTable(r, everyDay){
  const rows = dailyRows(r).filter(x=> everyDay || x.first || x.dCpt || x.dOurs).reverse();
  if(!rows.length) return '<p class="mut" style="font-size:.84rem">No readings yet.</p>';
  return '<table class="hist"><thead><tr><th>Date</th><th class="num">Our price</th><th class="num">Change</th>'+
    '<th class="num">CPT</th><th class="num">Change</th>'+(r.target ? '<th class="num">CPT vs target</th>' : '')+'</tr></thead><tbody>'+
    rows.map(x=>{
      const over = x.ours !== null && x.cpt !== null && x.ours > x.cpt + 0.005;
      const vsT = r.target && x.cpt !== null ? Math.round((x.cpt - r.target) * 100) / 100 : null;
      return `<tr><td>${esc(shortDate(x.d))}</td>`+
        `<td class="num ${over ? 'warn' : ''}">${usd(x.ours)}</td>`+
        `<td class="num ${x.dOurs > 0 ? 'ok' : x.dOurs < 0 ? 'warn' : 'mut'}">${x.first ? 'first day' : signed(x.dOurs)}</td>`+
        `<td class="num"><b>${usd(x.cpt)}</b></td>`+
        `<td class="num ${x.dCpt > 0 ? 'ok' : x.dCpt < 0 ? 'warn' : 'mut'}">${x.first ? 'first day' : signed(x.dCpt)}</td>`+
        (r.target ? `<td class="num ${vsT < 0 ? 'warn' : 'ok'}">${vsT === null ? '' : vsT < 0 ? usd(-vsT) + ' too low' : 'OK'}</td>` : '')+'</tr>';
    }).join('')+'</tbody></table>';
}

/* Every price and CPT change across all listings, newest first */
function changeLog(days){
  const since = addDays(todayStr(), -(days || 30)), out = [];
  cptRows().forEach(r=> dailyRows(r).forEach(x=>{
    if(x.d < since || x.first) return;
    if(x.dCpt) out.push({d:x.d, r, what:'CPT', from:x.cpt - x.dCpt, to:x.cpt});
    if(x.dOurs) out.push({d:x.d, r, what:'Our price', from:x.ours - x.dOurs, to:x.ours});
  }));
  return out.sort((a,b)=> a.d < b.d ? 1 : a.d > b.d ? -1 : a.r.sku.localeCompare(b.r.sku));
}
function openChangeLog(){
  const log = changeLog(30), d = document.getElementById('detail');
  d.innerHTML = '<h2>Price change log</h2><h3>Every CPT and price change, last 30 days</h3>'+
    '<p class="mut" style="font-size:.82rem">Checked every morning. Green: went up. Red: went down. Tap Download for every day of every listing, for your own sheet.</p>'+
    (log.length ? '<table class="hist"><thead><tr><th>Date</th><th>SKU</th><th>What</th><th class="num">From</th><th class="num">To</th><th class="num">Change</th></tr></thead><tbody>'+
      log.map(x=>{ const ch = Math.round((x.to - x.from) * 100) / 100;
        return `<tr><td>${esc(shortDate(x.d))}</td><td class="mono">${skuL(x.r.sku)}${cpy(x.r.sku)}</td><td>${x.what}</td>`+
          `<td class="num">${usd(x.from)}</td><td class="num"><b>${usd(x.to)}</b></td><td class="num ${ch > 0 ? 'ok' : 'warn'}">${signed(ch)}</td></tr>`; }).join('')+
      '</tbody></table>' : '<p class="mut">No changes yet. The first changes show up after a few mornings of tracking.</p>')+
    '<p style="margin-top:.8rem"><button class="work" id="logCsv">Download every day (CSV)</button></p>';
  document.getElementById('logCsv').onclick = ()=>{
    const lines = [['Date','SKU','ASIN','Product','Our price','Our price change','CPT','CPT change','Target'].join(',')];
    cptRows().forEach(r=> dailyRows(r).forEach(x=> lines.push([x.d, r.sku, r.asin, '"' + String(r.name).replace(/"/g,'""') + '"',

/* ---------- Buy Box module ----------
   One row per active ASIN from buybox.json (Buy Box Watch, nightly, Keepa).
   Built to answer one question at a glance: do we have the Buy Box, and if
   not, why. Out of stock comes first, then another seller, then price.
   Stock is shown for the US and Canada side by side. */
let BB = [], BB_META = {}, BB_ERR = '';
const BB_F = {show:'all', q:'', sort:'', dir:1, tier:'', group:false};
const BB_CLS = {us:['Us', 'bbh-us'], amazon:['Amazon', 'bbh-amz'], other:['Other seller', 'bbh-oth'], none:['No Buy Box', 'bbh-none']};
const BB_WHY = {
  oos:     {t:'Out of stock in the US', c:'bad'},
  amazon:  {t:'Another seller has it (Amazon.com)', c:'bad'},
  seller:  {t:'Another seller has it', c:'bad'},
  cpt:     {t:'Our price is above the CPT', c:'bad'},
  nooffer: {t:'Our offer is not showing', c:'bad'},
  unknown: {t:'Reason not clear', c:'warn'}
};

function buildBb(j){ buildBbRaw(j); BB_US = BB; BB_US_META = BB_META; mk2Apply(); }
function buildBbRaw(j){
  BB_ERR = '';
  BB_META = {updated: j && j.updated || '', ourId: j && j.ourSellerId || ''};
  BB = (j && j.rows) || [];
}

function bbRows(){
  const cpt = CPT.length ? cptRows() : [];
  return BB.map(b=>{
    const row = (b.sku && ROWS.find(x=> x.sku === b.sku)) || ROWS.find(x=> x.asin === b.asin);
    const c = cpt.find(x=> x.asin === b.asin);
    const h = b.holder || {cls:'none'};
    const ours = b.ours;
    const r = Object.assign({}, b, {
      sku: b.sku || (row && row.sku) || '', name: (row && row.name) || (c && c.name) || b.asin,
      tier: b.tier || (row && row.tier) || '',
      // Inbound now comes only from BigQuery (blank until Sam's pull carries it)
      us: row ? row.usAvail : null, usIn: row ? row.usInbound : null,
      ca: row ? row.caAvail : null, caIn: row ? row.caInbound : null,
      cpt: c ? c.cpt : null, cptOver: !!(c && c.gap > 0),
      amzOn: !!(b.amazon && b.amazon.price !== null)
    });
    // Do we have it? Keepa's last check can name another seller while we
    // share the Buy Box at the same price. Same price as ours, and we held it
    // most of this week, counts as ours.
    const samePrice = b.bb !== null && ours !== null && Math.abs(b.bb - ours) < 0.011;
    r.has = h.cls === 'us' || ((h.cls === 'amazon' || h.cls === 'other') && samePrice && b.win && b.win.d7 >= 50);
    r.shared = r.has && h.cls !== 'us';
    // Why not, most likely cause first
    r.why = r.has ? '' :
      ((MK2 === 'CA' ? r.ca : r.us) === 0 || (ours === null && (MK2 === 'CA' ? r.ca : r.us) !== null && (MK2 === 'CA' ? r.ca : r.us) <= 0)) ? 'oos' :
      h.cls === 'amazon' ? 'amazon' :
      h.cls === 'other' ? 'seller' :
      r.cptOver ? 'cpt' :
      ours === null ? 'nooffer' : 'unknown';
    // Other New sellers on the listing, in plain words
    const others = [];
    if(r.amzOn) others.push(`Amazon.com ${usd(b.amazon.price)}${b.amazon.stock && b.amazon.stock !== 'in stock' ? ' (' + b.amazon.stock + ')' : ''}`);
    (b.rivals || []).filter(x=> x.cls === 'other' && x.p30 > 0).forEach(x=> others.push(x.name));
    r.others = others;
    r.next = bbNext(r);
    r.rb = rbScreenRow('bb', r);
    return r;
  });
}

/* One plain next step. Price decisions stay with Jack and Sam. */
function bbNext(r){
  if(r.has) return r.others.length ? 'Nothing now. Another seller is on this listing, keep an eye on it.' : '';
  return {
    oos:     (MK2 === 'CA' ? r.caIn : r.usIn) ? `Restock is on the way (${MK2 === 'CA' ? r.caIn : r.usIn} inbound).` : `Out of stock in ${MK2 === 'CA' ? 'Canada' : 'the US'}. Check the restock plan.`,
    amazon:  'Check who it is, then flag it to Jack.',
    seller:  'We have no resellers. Check who it is, then flag it to Jack.',
    cpt:     'Open it in the CPT tracker.',
    nooffer: 'Check the listing status in Seller Central.',
    unknown: 'Check Featured Offer eligibility in Seller Central.'
  }[r.why] || '';
}

const BB_SORT = {
  product: r=> r.name, has: r=> r.has ? 1 : 0, why: r=> r.why ? Object.keys(BB_WHY).indexOf(r.why) : 99,
  us: r=> r.us, ca: r=> r.ca, ours: r=> r.ours, bb: r=> r.bb, w30: r=> r.win ? r.win.d30 : null, rb: r=> -((r.rb || []).length),
  others: r=> (r.others || []).length
};

function bbBar(p){
  const v = Math.max(0, Math.min(100, Math.round(p || 0)));
  const c = v >= 95 ? 'g' : v >= 80 ? 'y' : 'r';
  return `<span class="bbbar"><i class="${c}" style="width:${v}%"></i></span><b class="bbpct ${c}">${v}%</b>`;
}
function bbStock(n, inbound){
  if(n === null || n === undefined) return '<span class="mut">\u2014</span>';
  return `<b class="bbstk ${n > 0 ? 'ok' : 'zero'}">${Number(n).toLocaleString()}</b>` +
         (inbound ? `<span class="was">+${Number(inbound).toLocaleString()} on the way</span>` : '');
}

function renderBb(){
  document.getElementById('msg').hidden = true;
  document.getElementById('bar').innerHTML = '';
  const v = document.getElementById('cptView');
  const all = bbRows();
  const yes = all.filter(r=> r.has), no = all.filter(r=> !r.has);
  const by = k=> no.filter(r=> r.why === k);
  const amzOn = all.filter(r=> r.others.length);
  const fresh = BB_META.updated && BB_META.updated.slice(0,10) >= new Date(Date.now() - 2*86400000).toISOString().slice(0,10);

  let rows = all;
  if(BB_F.show === 'yes')    rows = yes;
  if(BB_F.show === 'no')     rows = no;
  if(BB_F.show === 'oos')    rows = by('oos');
  if(BB_F.show === 'seller') rows = no.filter(r=> r.why === 'amazon' || r.why === 'seller');
  if(BB_F.show === 'other')  rows = no.filter(r=> ['cpt','nooffer','unknown'].indexOf(r.why) !== -1);
  if(BB_F.show === 'amz')    rows = amzOn;
  if(BB_F.show === 'rb')     rows = all.filter(r=> (r.rb || []).length);

             const inStock = all.filter(r=> r.why !== 'oos');
