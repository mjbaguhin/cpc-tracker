}

/* The email to the Andy Jassy team, in the same shape as MJ's earlier ones:
   who we are, what is wrong, the proof, what we ask, past case numbers. */
function jassyEmail(rows){
  const list = rows.filter(r=> r.action === 'open' || r.action === 'follow' || r.gap > 0 || r.held);
  if(!list.length) return null;
  const one = list.length === 1 ? list[0] : null;
  const subject = one
    ? `Inaccurate Automated Competitive Price Threshold on ${one.asin} (${one.size || ''} ${cptTitle(one)})` +
      (one.caseIds && one.caseIds.length ? `, Case ${one.caseIds[one.caseIds.length - 1]}` : '')
    : `Inaccurate Automated Competitive Price Threshold on ${list.length} Barnyard Designs coir doormat ASINs`;
  const ids = [...new Set(list.flatMap(r=> r.caseIds || []))];
  const body = [
    'Hello,', '',
    `I am writing on behalf of Barnyard Designs, the brand owner and only seller of the ASIN${one ? '' : 's'} below. ` +
    'Our brand account owner, Jack Fallon, is copied on this email.', '',
    one ? caseEvidence(one) : groupEvidence(list), '',
    ids.length ? 'Related cases: ' + ids.join(', ') + '. The replies so far kept the threshold without comparing a same-size item.' : '',
    ids.length ? '' : '',
    'Could a member of your team ask the pricing team for a manual review? Thank you for your help.', '',
    'Best regards,', 'MJ Baguhin', 'Barnyard Designs, Cross Path Capital LLC'
  ].filter((x,i,a)=> !(x === '' && a[i-1] === '')).join('\n');
  return {subject, body};
}
const CPT_F = {show:'all', q:'', group:'action', sort:'', dir:1,
  min:{}, max:{}, tiers:new Set(), sizes:new Set(), stockOnly:false, hideOpen:false, more:false};

// Columns that take a min/max filter
const CPT_RANGE = [
  ['ours', 'Our price', '$'], ['sale', 'Sale price', '$'], ['list', 'List price', '$'],
  ['cpt', 'CPT', '$'], ['gap', 'Gap', '$'], ['pct', 'Gap', '%']
];

// What each sortable CPT column sorts on
const CPT_SORT = {
  product: r=> cptTitle(r),
  ours:    r=> r.ours,
  sale:    r=> r.sale,
  cpt:     r=> r.cpt,
  gap:     r=> r.gap,
  move:    r=> daysSince(r.moved),
  sim:     r=> r.simLow ? r.simLow.price : null,
  verdict: r=> ACTIONS[r.action].rank * 10 - (r.verdict.points || 0)
};

/* Tiny two-line trend for the row: CPT solid, our price dashed */
function miniSpark(h){
  const pts = (h || []).slice(-30);
  if(pts.length < 2) return '<span class="mut">\u2014</span>';
  const W = 110, H = 30, P = 3, vs = [];
  pts.forEach(x=>{ if(x[1] !== null) vs.push(x[1]); if(x[2] !== null && x[2] !== undefined) vs.push(x[2]); });
  if(!vs.length) return '<span class="mut">\u2014</span>';
  const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
  const X = i => P + i * (W - 2*P) / (pts.length - 1), Y = v => H - P - (v - lo) * (H - 2*P) / span;
  const path = k =>{ let d = '', pen = false;
    pts.forEach((x,i)=>{ const v = x[k];
      if(v === null || v === undefined){ pen = false; return; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' '; pen = true; });
    return d; };
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">`+
    `<path d="${path(2)}" fill="none" stroke="var(--byd)" stroke-width="1.6" stroke-dasharray="4 3"/>`+
    `<path d="${path(1)}" fill="none" stroke="var(--accent)" stroke-width="1.8"/></svg>`;
}

/* "Barnyard Designs Natural Coco Coir Non-Slip Doormat (30x48, Welcome)"
   reads as "Welcome coir doormat": the style is what tells rows apart. */
function cptTitle(r){
  const n = String(r.name || '');
  const m = n.match(/\(([^)]*)\)\s*$/) || n.match(/\(([^)]*)\)/);
  if(m){
    const style = m[1].split(',').map(x=> x.trim()).filter(x=> x && !matSize(x)).join(', ');
    if(style && /coir|coco/i.test(n)) return style + ' coir doormat';
    if(style) return style;
  }
  return n.replace(/^Barnyard Designs\s*/i, '').replace(/^Seedboy\s*/i, '').split(/[|,]/)[0].trim() || r.sku;
}

function renderCpt(){

  // This view owns the screen: the shared table, bar and message step aside
  document.getElementById('msg').hidden = true;
  document.getElementById('bar').innerHTML = '';
  const v = document.getElementById('cptView');

  const all    = cptRows();
  const over   = all.filter(r=> r.gap !== null && r.gap > 0);
  const recent = all.filter(r=>{ const n = daysSince(r.moved); return n !== null && n <= CPT_RECENT; });
  const none   = CPT.length - all.length;
  const worst  = over.slice().sort((a,b)=> b.gap - a.gap)[0];
  const today  = new Date().toISOString().slice(0,10);
  const fresh  = CPT_META.updated && CPT_META.updated.slice(0,10) >= new Date(Date.now() - 2*86400000).toISOString().slice(0,10);

  // Filter and search
  let rows = all;
  if(CPT_F.show === 'over')   rows = over;
  if(CPT_F.show === 'moved')  rows = recent;
  if(CPT_F.show === 'held')   rows = all.filter(r=> r.held);
  if(CPT_F.show === 'reply')  rows = all.filter(r=> r.mail && r.mail.needsReply);
  if(CPT_F.show === 'need')   rows = all.filter(r=> r.action === 'open' || r.action === 'follow');
  if(CPT_F.show === 'cases')  rows = all.filter(r=> r.verdict.level === 'strong' || r.verdict.level === 'possible');
  // Column filters: min and max per column, tier, stock, open cases
  CPT_RANGE.forEach(c=>{
    const k = c[0] + (c[2] === '%' ? '' : ''), lo = CPT_F.min[c[0] + c[2]], hi = CPT_F.max[c[0] + c[2]];
    if(lo === undefined && hi === undefined) return;
    rows = rows.filter(r=>{
      const v = r[c[0]];
      if(v === null || v === undefined) return false;
      return (lo === undefined || v >= lo) && (hi === undefined || v <= hi);
    });
  });
  if(CPT_F.tiers.size) rows = rows.filter(r=> CPT_F.tiers.has(r.tier || 'N'));
  if(CPT_F.sizes.size) rows = rows.filter(r=> CPT_F.sizes.has(r.size || 'no size'));
  if(CPT_F.stockOnly)  rows = rows.filter(r=> r.avail !== null && r.avail > 0);
  if(CPT_F.hideOpen)   rows = rows.filter(r=> r.verdict.level !== 'open');
  if(CPT_F.q){
    const q = CPT_F.q.toLowerCase();
    rows = rows.filter(r=> (r.sku + ' ' + r.asin + ' ' + r.name).toLowerCase().indexOf(q) !== -1);
  }
  // A chosen column wins; otherwise flagged first, biggest gap on top.
  // Grouped views keep this order inside each family.
  if(CPT_F.sort && CPT_SORT[CPT_F.sort]) rows = sortBy(rows, CPT_SORT[CPT_F.sort], CPT_F.dir);
  CPT_SHOWN = rows;

  const tile = (k, val, cls, note) =>
    `<div class="cpt-tile"><div class="k">${k}</div><div class="v ${cls || ''}">${val}</div>`+
    `<div class="n">${note || '&nbsp;'}</div></div>`;

  let html =
    '<section class="cpt-top">'+
      '<div class="cpt-head">'+
        '<h2>CPT tracker</h2>'+
        `<span class="sub">Amazon US, ${CPT.length} active ASINs checked</span>`+
        (CPT_META.updated ? `<span class="cpt-live${fresh ? '' : ' stale'}"><i></i>Updated ${esc(CPT_META.updated)} ET, daily</span>` : '')+
      '</div>'+
      '<div class="cpt-tiles">'+
        tile('Needs a case', all.filter(r=> r.action === 'open').length +
             `<span style="font-size:1rem;color:var(--c-night-mut)"> new, ${all.filter(r=> r.action === 'follow').length} follow up</span>`,
             all.some(r=> r.action === 'open' || r.action === 'follow') ? 'bad' : '',
             esc(all.filter(r=> r.action === 'open' || r.action === 'follow').map(r=> r.sku).slice(0,4).join(', ')) || 'Nothing to raise today')+
        tile('Amazon emails to answer', all.filter(r=> r.mail && r.mail.needsReply).length,
             all.some(r=> r.mail && r.mail.needsReply) ? 'warn' : '',
             all.some(r=> r.mail) ? esc(all.filter(r=> r.mail && r.mail.needsReply).map(r=> r.sku).slice(0,3).join(', ')) || 'All answered' : 'Gmail check runs every morning')+
        tile('Priced above the CPT ' + qi('buybox'), over.length, over.length ? 'bad' : '',
             over.length ? 'Featured Offer at risk on these' : 'None, every price is at or under')+
        tile('Held at the CPT', all.filter(r=> r.held).length, all.some(r=> r.held) ? 'warn' : '',
             'Price cut to the CPT, under our regular price')+
        tile('CPT moved, last 7 days', recent.length, recent.length ? 'warn' : '',
             recent.length ? recent.map(r=> esc(r.sku)).slice(0,3).join(', ') + (recent.length > 3 ? '\u2026' : '') : 'No changes this week')+
        tile('ASINs with a CPT', all.length, '',
             none ? none + ' with no CPT today' : 'All ASINs have one')+
      '</div>'+
    '</section>'+
    '<div class="cpt-tools">'+
      '<div class="seg" id="cptSeg">'+
        [['all','All ' + all.length],
         ['need','Needs a case ' + all.filter(r=> r.action === 'open' || r.action === 'follow').length],
         ['over','Over CPT ' + over.length], ['moved','Moved 7 days ' + recent.length],
         ['held','Held at CPT ' + all.filter(r=> r.held).length],
         ['reply','Needs a reply ' + all.filter(r=> r.mail && r.mail.needsReply).length]]
          .map(b=> `<button data-show="${b[0]}" aria-pressed="${CPT_F.show === b[0]}">${b[1]}</button>`).join('')+
      '</div>'+
      '<span class="mut" style="font-size:.8rem;margin-left:.3rem">Group by</span>'+
      '<div class="seg" id="cptGrp">'+
        [['action','What to do'], ['none','Flat list'], ['parent','Parent name'], ['psku','Parent SKU'], ['pasin','Parent ASIN']]
          .map(b=> `<button data-g="${b[0]}" aria-pressed="${CPT_F.group === b[0]}">${b[1]}</button>`).join('')+
      '</div>'+
      `<input id="cptQ" type="search" placeholder="Search SKU, ASIN or product" value="${esc(CPT_F.q)}" aria-label="Search CPT tracker">`+
      (CPT_F.sort ? '<button id="cptUnsort" title="Back to the default order">Clear sort</button>' : '')+
      (rows.some(r=> r.gap > 0 || r.held) ? `<button id="cptCaseAll" class="work">Copy one case for the ${rows.filter(r=> r.gap > 0 || r.held).length} shown</button>` : '')+
      `<button id="cptGuide" aria-pressed="${!!CPT_F.guide}">What do these prices mean?</button>`+
      `<button id="cptMore" aria-pressed="${CPT_F.more}">Column filters${activeCptFilters() ? ' <span class="fbadge">' + activeCptFilters() + '</span>' : ''}</button>`+
      `<span class="count">${rows.length} of ${all.length}</span>`+
    '</div>'+
    (CPT_F.guide ? priceGuide() : '')+
    (CPT_F.more ? cptFilterPanel() : '');

  if(!all.length){
    html += CPT_ERR
      ? '<div class="cpt-empty"><b>CPT feed not found yet</b>Run setupCptWatchDaily in the CPC Keepa Fetcher project. It creates cpt.json on its first run.</div>'
      : `<div class="cpt-empty"><b>${CPT.length ? 'No ASIN has a CPT today' : 'Loading CPT'}</b>${CPT.length ? 'Amazon is not holding any of our listings to a competitive price right now.' : ''}</div>`;
  } else if(!rows.length){
    html += '<div class="cpt-empty"><b>Nothing matches</b>Clear the search or pick All.</div>';
  } else {
    const H = (k, label, cls, d) =>
      `<th data-s="${k}" data-d="${d || 'asc'}" class="${cls || ''}">${label}${qi(TIP_BY_HEAD[label.toLowerCase()])}${sortArrow(CPT_F, k)}</th>`;
    html += '<table class="cpt-table"><thead><tr>'+
      H('product', 'Product')+
      H('ours', 'Our price', 'b-ours c', 'desc')+
      H('sale', 'Sale price', 'b-ours c', 'desc')+
      H('cpt', 'CPT', 'b-cpt c', 'desc')+
      H('gap', 'Gap', 'b-gap c', 'desc')+
      `<th>30-day trend${qi('trend')}</th>`+
      H('move', 'Last CPT move', 'b-move')+
      H('sim', 'Cheapest similar', 'b-sim')+
      H('verdict', 'What to do', 'b-case')+
      '</tr></thead><tbody>'+
      cptBody(rows)+
      '</tbody></table>';
  }

  v.innerHTML = html;
  wireCpt(v, all);
}

/* Rows, optionally under one header per parent family. A family header
   shows how many of its children are held above the CPT. */
/* Sizes present in today's CPT rows, small to large */
function cptSizes(){
  const area = z=>{ const m = /^(\d+)x(\d+)$/.exec(z); return m ? m[1] * m[2] : 1e9; };
  return [...new Set(cptRows().map(r=> r.size || 'no size'))].sort((a,b)=> area(a) - area(b));
}

/* Listings of the same size whose CPT equals our own price. Same brand, same
   material, same size, yet Amazon's threshold is fine for them, which shows
   the flagged ones were matched to something else. */
function fairSiblings(size, except){
  // Same product line only (DMC- coir with DMC- coir), so a rubber 2-pack
  // never stands in as proof for a coir mat
  const lines = new Set(cptRows().filter(r=> except.indexOf(r.asin) !== -1).map(r=> (r.sku || '').split('-')[0]));
  return cptRows().filter(r=> r.size === size && except.indexOf(r.asin) === -1 &&
    (!lines.size || lines.has((r.sku || '').split('-')[0])) &&
    r.cpt !== null && r.ours !== null && r.cpt >= r.ours - 0.01 && !r.held && !(r.gap > 0));
}

/* "Amazon's threshold for these is $59.95 to $69.95, while this one is held at $40.28" */
function siblingHead(fair, size, held){
  const v = fair.map(x=> x.cpt), lo = Math.min(...v), hi = Math.max(...v);
  const range = lo === hi ? usd(lo) : usd(lo) + ' to ' + usd(hi);
  const h = [...new Set(held)];
  const heldTxt = h.length === 1 ? usd(h[0]) : h.map(usd).join(' and ');
  return `Same brand, same material, same ${size} size. Amazon's threshold for these listings is ${range}, ` +
         `while ${held.length > 1 ? 'the listings above are' : 'this one is'} held at ${heldTxt}:`;
}

/* One case for several ASINs at once, usually all flagged mats of one size */
function groupEvidence(rows){
  const flagged = rows.filter(r=> r.action === 'open' || r.action === 'follow');
  if(!flagged.length) return '';
  const sizes = [...new Set(flagged.map(r=> r.size).filter(Boolean))];
  const L = [];
  L.push('Request: re-validate the Competitive Price Threshold on the ASINs below.', '');
  L.push('We are Barnyard Designs, the brand owner and only seller of these coir doormats. '+
         'Each listing below shows a threshold far under our price, while identical listings of the same size, '+
         'material and brand are not flagged.', '');
  flagged.forEach(r=>{
    L.push(`ASIN ${r.asin} (SKU ${r.sku}), ${r.size || ''} ${cptTitle(r)}`);
    if(r.target !== null) L.push(`  Regular price ${r.list ? usd(r.list) : usd(r.ours)}, sale price ${usd(r.target)}. Threshold shown ${usd(r.cpt)}, ${r.shortPct}% below even our sale price.` +
      (r.ours <= r.cpt + 0.005 ? ` We have had to cut the price to ${usd(r.ours)} to keep the Featured Offer.` : ''));
    else if(r.held) L.push(`  Regular price ${usd(r.list)}. Threshold shown ${usd(r.cpt)}, ${r.listPct}% below it. We have had to cut the price to ${usd(r.ours)} to keep the Featured Offer.`);
    else L.push(`  Our price ${usd(r.ours)}${r.list ? ', list price ' + usd(r.list) : ''}. Threshold shown ${usd(r.cpt)}, ${r.belowPct}% below our price.`);
    if(r.moved) L.push(`  The threshold changed from ${usd(r.from)} to ${usd(r.cpt)} on ${r.moved}.`);
  });
  const same = {};
  flagged.forEach(r=>{ if(r.size) (same[r.size] = same[r.size] || []).push(r.cpt); });
  Object.keys(same).forEach(z=>{
    const v = same[z];
    if(v.length > 1 && v.every(x=> x === v[0]))
      L.push('', `All ${v.length} flagged ${z} listings share the exact same threshold (${usd(v[0])}), even though their designs and prices differ. `+
                 'That points to one generic reference item, not a match to our product.');
  });
  sizes.forEach(z=>{
    const fair = fairSiblings(z, flagged.map(r=> r.asin));
    if(fair.length){
      L.push('', siblingHead(fair, z, flagged.filter(r=> r.size === z).map(r=> r.cpt)));
      fair.slice(0, 8).forEach(r=> L.push(`  ASIN ${r.asin} (SKU ${r.sku}, ${cptTitle(r)}): threshold ${usd(r.cpt)}`));
    }
    const out = SIM.filter(x=> x.size === z && x.market !== 'Amazon').sort((a,b)=> a.price - b.price);
    if(out.length){
      L.push('', `Comparable ${z} coir doormats sold outside Amazon:`);
      out.slice(0, 5).forEach(x=> L.push(`  ${x.market}, ${x.brand || 'brand not listed'}: ${usd(x.price)}${x.link ? '  ' + x.link : ''}`));
    }
  });
  L.push('', 'Each of these is also sold on our own brand website, barnyarddesigns.com, at a price at or above our Amazon price.', '',
         'Please have the pricing team compare each flagged ASIN with a reference item of the same size and construction, and reset the threshold to at least our sale price for the size.');
  return L.join('\n');
}

function activeCptFilters(){
  return Object.keys(CPT_F.min).length + Object.keys(CPT_F.max).length +
    (CPT_F.tiers.size ? 1 : 0) + (CPT_F.sizes.size ? 1 : 0) + (CPT_F.stockOnly ? 1 : 0) + (CPT_F.hideOpen ? 1 : 0);
}

function cptFilterPanel(){
  const box = c=>{
    const id = c[0] + c[2], lo = CPT_F.min[id], hi = CPT_F.max[id];
    return `<div class="rf"><label>${c[1]} <span class="mut">(${c[2]})</span></label>`+
      `<input type="number" step="any" data-min="${id}" placeholder="min" value="${lo === undefined ? '' : lo}" aria-label="${c[1]} minimum">`+
      `<span class="mut">to</span>`+
      `<input type="number" step="any" data-max="${id}" placeholder="max" value="${hi === undefined ? '' : hi}" aria-label="${c[1]} maximum"></div>`;
  };
  return '<div class="cpt-filters">'+
    '<div class="rf-grid">' + CPT_RANGE.map(box).join('') + '</div>'+
    '<div class="rf-row">'+
      '<span class="lbl2">Size</span>'+
      cptSizes().map(z=> `<button data-size="${esc(z)}" aria-pressed="${CPT_F.sizes.has(z)}">${esc(z)}</button>`).join('')+
    '</div>'+
    '<div class="rf-row">'+
      '<span class="lbl2">Tier</span>'+
      ['A','B','N','C','X'].map(t=> `<button data-tier="${t}" aria-pressed="${CPT_F.tiers.has(t)}">${t}</button>`).join('')+
      `<button id="fStock" aria-pressed="${CPT_F.stockOnly}">In stock only</button>`+
      `<button id="fOpen" aria-pressed="${CPT_F.hideOpen}">Hide ones with a case open</button>`+
      '<button id="fClear" class="act">Clear column filters</button>'+
    '</div>'+
    '<div class="rf-tip">Tip for case hunting: Gap % min 20, Tier A and B, In stock only, Hide ones with a case open. '+
      'Or just tap <b>Needs a case</b> above.</div>'+
  '</div>';
}

function cptBody(rows){
  const key = CPT_F.group;
  if(key === 'none') return rows.map(cptRowHtml).join('');
  if(key === 'action'){
    return ['open','follow','watch','none'].map(a=>{
      const g = rows.filter(r=> r.action === a);
      if(!g.length) return '';
      const sub = a === 'open' ? 'The CPT is below our sale price for the size. No case on file.'
               : a === 'follow' ? 'Same, but a case is already on file. Reply on it with the latest numbers.'
               : a === 'watch' ? 'The CPT is at or above our sale price, so we can sell at the sale price without a case.'
               : 'Our price and the CPT agree.';
      const btns = (a === 'open' || a === 'follow')
        ? `<div class="agh-b"><button class="work strong" data-gmail="${a}">Draft one Jassy email for these ${g.length}</button>`+
          `<button class="work" data-gfind="${a}">Find related emails</button></div>` : '';
      return `<tr class="gh agh agh-${a}"><td colspan="9"><div class="agh-t">${esc(ACTIONS[a].group)} `+
             `<span class="agh-n">${g.length}</span></div><div class="agh-s">${sub}</div>${btns}</td></tr>` +
             g.map(cptRowHtml).join('');
    }).join('');
  }
  const SOLO = '\uffffstandalone';
  const groups = {};
  rows.forEach(r=>{
    const k = r[key] || SOLO;
    (groups[k] = groups[k] || []).push(r);
  });
  // Families with something over the CPT first, standalone listings last
  return Object.keys(groups).sort((a,b)=>{
    if((a === SOLO) !== (b === SOLO)) return a === SOLO ? 1 : -1;
    const oa = groups[a].filter(r=> r.gap > 0).length, ob = groups[b].filter(r=> r.gap > 0).length;
    return ob - oa || a.localeCompare(b);
  }).map(k=>{
    const g = groups[k], over = g.filter(r=> r.gap > 0).length;
    const gaps = g.filter(r=> r.gap > 0).map(r=> r.gap);
    return parentHeader(k === SOLO ? g.map(r=> Object.assign({}, r, {parent:'', psku:'', pasin:''})) : g, 9, [
      over ? `<span class="pgh-tag bad">${over} over CPT</span>` : '<span class="pgh-tag ok">All at or under the CPT</span>',
      gaps.length ? `<span><span class="k">Biggest gap</span><b>${usd(Math.max(...gaps))}</b></span>` : ''
    ].filter(Boolean)) + g.map(cptRowHtml).join('');
  }).join('');
}

function cptRowHtml(r){
        const bad = r.gap !== null && r.gap > 0;
        const n = daysSince(r.moved);
        const hot = n !== null && n <= CPT_RECENT;
        const brandDot = /barnyard/i.test(r.name) || /^DMC|^FM|^HD/i.test(r.sku) ? 'var(--byd)' : 'var(--sb)';
        return `<tr class="row act-${r.action}" tabindex="0" data-asin="${esc(r.asin)}">`+
          '<td class="prod">'+
            `<div class="p-name" title="${esc(r.name)}"><span class="dot" style="background:${brandDot}"></span>${esc(cptTitle(r).slice(0,48))}</div>`+
            `<div class="p-id"><span>SKU</span>${esc(r.sku)}</div>`+
            `<div class="p-id"><span>ASIN</span>${esc(r.asin)}</div>`+
            (r.size ? `<span class="p-size">${esc(r.size)}</span>` : '')+
          '</td>'+
          `<td class="c"><span class="cpill ours" data-tip="${esc(TIPS.ours)}">${usd(r.ours)}</span></td>`+
          `<td class="c">${r.sale !== null && r.sale !== undefined
              ? `<span class="cpill sale" data-tip="${esc(TIPS.sale)}">${usd(r.sale)}</span>` +
                (r.list ? `<span class="was" data-tip="${esc(TIPS.list)}">List ${usd(r.list)}</span>` : '')
              : '<span class="mut">No sale</span>'}`+
             (r.target !== null ? `<span class="tgt" data-tip="${esc(TIPS.target)}">Target ${usd(r.target)}</span>` : '')+'</td>'+
          `<td class="c"><span class="cpill cpt" data-tip="${esc(TIPS.cpt)}">${usd(r.cpt)}</span></td>`+
          `<td class="c">${r.gap === null ? '<span class="mut">\u2014</span>' :

/* CPT (solid) and our price (dashed) on one scale, so the gap between them
   is the picture: lines apart means we are priced over the threshold. */
function sparkSvg(h){
  if(h.length < 2) return '';
  const W = 320, H = 64, P = 4;
  const vs = [];
  h.forEach(x=>{ if(x[1] !== null) vs.push(x[1]); if(x[2] !== null && x[2] !== undefined) vs.push(x[2]); });
  if(!vs.length) return '';
  const lo = Math.min(...vs), hi = Math.max(...vs), span = (hi - lo) || 1;
  const X = i => P + i * (W - 2*P) / (h.length - 1);
  const Y = v => H - P - (v - lo) * (H - 2*P) / span;
  function path(k){
    let d = '', pen = false;
    h.forEach((x,i)=>{
      const v = x[k];
      if(v === null || v === undefined){ pen = false; return; }
      d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      pen = true;
    });
    return d;
  }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" `+
    `aria-label="CPT and our price, ${usd(lo)} to ${usd(hi)}, over ${h.length} days">`+
    `<path d="${path(2)}" fill="none" stroke="var(--byd)" stroke-width="2" stroke-dasharray="5 4"/>`+
    `<path d="${path(1)}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>`+
    `<div class="mut" style="font-size:.74rem;margin-bottom:.4rem">`+
    `<span style="color:var(--accent);font-weight:700">\u2014</span> CPT &nbsp; `+
    `<span style="color:var(--byd);font-weight:700">- -</span> Our price</div>`;
}

  return `<h2 style="margin-top:1.1rem">What to do</h2>`+
    `<p style="margin:.2rem 0 .4rem"><span class="ac ac-${r.action}">${esc(ACTIONS[r.action].label || 'No action')}</span>`+
    `<span class="mut" style="font-size:.8rem;margin-left:.5rem">${strength} for a wrong match (${v.points} points)</span></p>`+
    (r.caseIds && r.caseIds.length ? `<p class="mut" style="font-size:.84rem">Case on file: <span class="mono">${esc(r.caseIds.join(', '))}</span>. Reply on the newest one with the evidence below.</p>` : '')+
    (v.open ? `<p class="mut" style="font-size:.84rem">Case ${esc(v.open.id)} is already open for this ASIN (${esc(v.open.status || 'open')}). Reply on it instead of opening another.</p>` : '')+
    '<ul class="why-list">' + v.why.map(w=> `<li>${esc(w)}</li>`).join('') + '</ul>'+

    ((r.action === 'open' || r.action === 'follow')

      : '');

function simBlock(r){
  if(!r.size || !(r.gap > 0 || r.held)) return '';
  const all = r.sim || [];
  const amz = all.filter(x=> x.market === 'Amazon'), out = all.filter(x=> x.market !== 'Amazon');
  if(!all.length) return `<h2 style="margin-top:1.1rem">Similar ${esc(r.size)} coir mats</h2>`+
    `<p class="mut" style="font-size:.84rem">None found yet. Amazon prices update every morning. Add Walmart, Wayfair or Temu prices in the Outside Amazon tab.</p>`;
  // Amazon sellers never set the CPT, so only outside listings can be the match
  const near = r.cpt !== null ? out.filter(x=> Math.abs(x.price - r.cpt) <= 3) : [];
  return `<h2 style="margin-top:1.1rem">Similar ${esc(r.size)} coir mats</h2>`+
    '<dl>'+
    `<dt>On Amazon</dt><dd>${amz.length ? amz.length + ' listings, lowest ' + usd(amz[0].price) + ', median ' + usd(median(amz)) : '<span class="mut">none yet</span>'}</dd>`+
    `<dt>Outside Amazon</dt><dd>${out.length ? out.length + ' listings, lowest ' + usd(out[0].price) + ', median ' + usd(median(out)) : '<span class="mut">none added</span>'}</dd>`+
    (near.length ? `<dt>Near the CPT</dt><dd class="warn">${near.length} priced within $3 of ${usd(r.cpt)}, possible source of the CPT</dd>` : '')+
    '</dl>'+
    '<table class="hist"><thead><tr><th>Where</th><th>Brand</th><th>Product</th><th class="num">Price</th></tr></thead><tbody>'+
    all.slice(0, 10).map(x=>{
      const hot = x.market !== 'Amazon' && r.cpt !== null && Math.abs(x.price - r.cpt) <= 3;
      const nm = esc(String(x.name).slice(0, 60));
      return `<tr><td>${esc(x.market)}</td><td>${esc(x.brand || '')}</td>`+
        `<td>${x.link ? `<a href="${esc(x.link)}" target="_blank" rel="noopener">${nm}</a>` : nm}</td>`+
        `<td class="num ${hot ? 'warn' : ''}">${usd(x.price)}</td></tr>`;
    }).join('')+
    '</tbody></table>'+
    (all.length > 10 ? `<p class="mut" style="font-size:.78rem;margin-top:.3rem">Cheapest 10 of ${all.length} shown.</p>` : '');
}

function openCpt(r){
  const d = document.getElementById('detail');
  const steps = [];
  r.h.forEach((x,i)=>{
    const p = i ? r.h[i-1] : null;
    const ours = x[2] === undefined ? null : x[2];
    if(i === 0 || x[1] !== p[1] || ours !== (p[2] === undefined ? null : p[2]))
      steps.push([x[0], x[1], p ? p[1] : null, ours]);
  });

  d.innerHTML =
    `<h2>CPT tracker</h2>`+
    `<h3>${esc(r.sku)} ${esc(r.name)}</h3>`+
    '<dl>'+
    `<dt>ASIN</dt><dd class="mono">${esc(r.asin)}</dd>`+
    `<dt>Our price</dt><dd>${usd(r.ours)}${r.kOurs !== null ? '' : ' <span class="mut">(from ALM data, Keepa had none)</span>'}</dd>`+
    `<dt>CPT today</dt><dd class="${r.gap > 0 ? 'warn' : 'ok'}">${usd(r.cpt)}</dd>`+
    `<dt>Over by</dt><dd>${r.gap === null ? '\u2014' : r.gap > 0 ? usd(r.gap) + ' (' + r.pct + '%)' : 'Our price is at or under the CPT'}</dd>`+
    `<dt>Buy Box</dt><dd>${usd(r.bb)}</dd>`+
    '</dl>'+
    sparkSvg(r.h)+
    '<table class="hist"><thead><tr><th>Date</th><th class="num">Our price</th><th class="num">CPT</th><th class="num">CPT change</th></tr></thead><tbody>'+
    steps.slice().reverse().map(x=>{
      const ch = x[2] === null || x[1] === null ? '' : Math.round((x[1] - x[2]) * 100) / 100;
      const over = x[3] !== null && x[1] !== null && x[3] > x[1];
      return `<tr><td>${esc(x[0])}</td><td class="num ${over ? 'warn' : ''}">${usd(x[3])}</td><td class="num">${usd(x[1])}</td>`+
             `<td class="num ${ch > 0 ? 'ok' : ch < 0 ? 'warn' : 'mut'}">${ch === '' ? (x[2] === null ? 'first seen' : '') : ch === 0 ? '' : (ch > 0 ? '+' : '') + usd(ch).replace('$-','-$')}</td></tr>`;
    }).join('')+
    '</tbody></table>'+
    caseBlock(r)+
    simBlock(r)+
    `<div class="why">Only days when our price or the CPT changed are listed. Our price in red means it was above the CPT that day. Amazon does not say which retailer it used, so a step up or down is the clue to when its match changed.</div>`+
    `<p style="margin-top:.9rem"><button class="work" id="phBtn">Open Pricing Health</button></p>`;

  const mb2 = document.getElementById('mailBtn');
  if(mb2) mb2.onclick = ()=>{
    const m = jassyEmail([r]);
    if(m) window.open(gmailCompose(MAIL.jassy, MAIL.cc, m.subject, m.body), '_blank', 'noopener');
  };
  const om = document.getElementById('openMail');
  if(om && r.mail) om.onclick = ()=> window.open(r.mail.link, '_blank', 'noopener');
  const fb = document.getElementById('findBtn');
  if(fb) fb.onclick = ()=> window.open(gmailSearch([r.asin].concat(r.caseIds || [])), '_blank', 'noopener');
  const cb2 = document.getElementById('caseBtn');
  if(cb2) cb2.onclick = ()=>{
    if(r.action === 'follow' && r.caseIds.length){
      window.open(caseLink(r.caseIds[r.caseIds.length - 1]), '_blank', 'noopener');
      return;
    }
    // Open the tab first, then copy, so the pop-up blocker allows it
    window.open(CASE_URL, '_blank', 'noopener');
    const t = caseEvidence(r);
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=> cb2.textContent = 'Evidence copied, paste it into the case');
  };
  const ev = document.getElementById('evBtn');
  if(ev) ev.onclick = ()=>{
    const t = caseEvidence(r);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(()=> ev.textContent = 'Copied, paste it into the case')
      .catch(()=>{ window.prompt('Copy this text:', t); });
  };
  document.getElementById('phBtn').onclick = ()=>
    window.open('https://sellercentral.amazon.com/pricing/health', '_blank', 'noopener');
  document.getElementById('veil').hidden = false;
}

/* Search Department is published but never judged, because Keepa reports GL
   names rather than department names and is wrong on some SKUs. Saying so on
   screen is better than a column of grey circles nobody can explain. */
function sdNote(){
  const filled = CAT.filter(c=> c.checks['Search Department'] &&
                                c.checks['Search Department'].expected).length;
  return `<span class="mut">Search Department not checked, no reliable source`+
         (filled ? `, ${filled} have a Plytix value` : '')+`</span>`;
}

function renderCategory(){

  const set  = S.checks || CHECKS;
  let rows = catFailing();
  const all  = catFailing(false);
  const tbl  = document.getElementById('tbl');
  const tb   = document.getElementById('tbody');

  overview(S.taskName || 'Category checks',
    `${esc(S.mk)} marketplace, ${CAT.length} SKU checks loaded`,
    [['To do', `${rows.length}<span style="font-size:1rem;color:var(--night-mut)"> of ${all.length}</span>`,
       rows.length ? 'bad' : 'good', rows.length === all.length ? 'All shown' : 'Filters are hiding some']]
    .concat(set.map(k=>{
      const n = rows.filter(c=> c.checks[k] && c.checks[k].state === 'bad').length;
      return [k, n, n ? 'bad' : 'good', n ? 'Mismatch with Plytix' : 'All passing'];
    })));
  document.getElementById('bar').innerHTML =
    (set.indexOf('Search Department') !== -1 ? sdNote() : '')+
    '<span class="mut">Tap any red circle for the detail and a drafted case.</span>';

  if(!rows.length){
    tbl.hidden = true;
    msg(all.length ? 'Nothing matches these filters' :
        CAT.length ? 'Nothing to do here' : 'No check data',
        all.length ? all.length + ' SKUs need attention, but none match the current '+
                     'marketplace, brand, status or tier filters.' :
        CAT.length ? 'Every check in this task is passing. Back to the checklist.'
                   : 'Set PUB_CAT to the published Category tab URL.');
    return;
  }

  document.getElementById('msg').hidden = true;
  tbl.hidden = false;
  tbl.className = '';

  // Sort: a check column puts failing rows first; Tier follows A, B, N, C, X
  const CS = S.catS || (S.catS = {sort:'', dir:1});
  const catGet = k =>
    k === 'SKU' ? c=> c.sku : k === 'ASIN' ? c=> c.asin : k === 'Country' ? c=> c.country :
    k === 'Product' ? c=> c.name : k === 'Tier' ? c=> (TIER_RANK[c.tier] !== undefined ? TIER_RANK[c.tier] : 9) :
    k === 'Case' ? c=> c.caseId || null :
    c=> { const st = (c.checks[k] || {}).state; return st === 'bad' ? 0 : st === 'ok' ? 2 : 1; };
  if(CS.sort) rows = sortBy(rows, catGet(CS.sort), CS.dir);

  document.getElementById('hrow').innerHTML =
    ['SKU','ASIN','Country','Product','Tier'].concat(set).concat(['Case'])
      .map(h=>`<th data-s="${esc(h)}">${esc(h)}${sortArrow(CS, h)}</th>`).join('');
  wireSort(document.getElementById('hrow'), CS, render);

  tb.innerHTML = rows.map((c,i)=>
    '<tr>'+
    `<td class="mono id" data-sku="${esc(c.sku)}" data-asin="${esc(c.asin)}">`+
      `${esc(c.sku)}${stockLine(stockFor(c.sku, c.country))}</td>`+
    `<td class="mono id" data-sku="${esc(c.sku)}" data-asin="${esc(c.asin)}">${esc(c.asin)}</td>`+
    `<td>${esc(c.country)}</td>`+
    `<td class="name">${esc(c.name)}</td>`+
    `<td>${c.tier ? `<span class="tier t${esc(c.tier)}">${esc(c.tier)}</span>` : ''}</td>`+
    set.map(k=>{
      const ck = c.checks[k] || {state:'unknown'};
      const st = ck.state === 'ok' ? 'ok' : ck.state === 'bad' ? 'bad' : 'none';
      return `<td class="ind-cell"><span class="ind i-${st}" `+
             `data-row="${i}" data-check="${esc(k)}" `+
             `title="${esc(k)}: ${esc(ck.state)}"></span></td>`;
    }).join('')+
    `<td class="mono">${c.caseId ? esc(c.caseId) : '<span class="mut">\u2014</span>'}</td>`+
    '</tr>'
  ).join('');

  [...tb.querySelectorAll('.ind.i-bad')].forEach(el=> el.onclick = ()=>
    openDetail(rows[+el.dataset.row], el.dataset.check));
  wireIds(tb);
}

        `<textarea id="draft">${esc(caseText(row, check, ck))}</textarea>`)+
    '<div class="actions">'+
      (CASEABLE.indexOf(check) === -1 ? '' :
        '<button id="copyBtn" class="act">Copy and open case form</button>'+
        '<button id="copyOnly">Copy only</button>')+
      '<a href="https://sellercentral.amazon.com/hz/productclassify" target="_blank" '+
        'rel="noopener">Verify in classifier</a>'+
      `<a href="https://www.${row.country === 'CA' ? 'amazon.ca' : 'amazon.com'}`+
        `/dp/${encodeURIComponent(row.asin)}" target="_blank" rel="noopener">Detail page</a>`+
      '<button id="closeBtn">Close</button>'+
    '</div>';

  /* The tab is opened first and the copy happens after. Doing it the other
     way round loses the click gesture while the clipboard promise settles,
     and the browser blocks the popup. */
  const cbtn = document.getElementById('copyBtn');
  if(cbtn) cbtn.onclick = ()=>{
    window.open(CASE_URL, '_blank', 'noopener');
    const t = document.getElementById('draft');
    t.select();
    navigator.clipboard.writeText(t.value)
      .then(()=> cbtn.textContent = 'Copied, paste into the case')
      .catch(()=> cbtn.textContent = 'Case form open, press Ctrl+C to copy');
  };

  const conly = document.getElementById('copyOnly');
  if(conly) conly.onclick = ()=>{
    const t = document.getElementById('draft');
    t.select();
    navigator.clipboard.writeText(t.value)
      .then(()=> conly.textContent = 'Copied')
      .catch(()=> conly.textContent = 'Press Ctrl+C');
  };
  document.getElementById('closeBtn').onclick = closeDetail;

  document.getElementById('veil').hidden = false;
}

/* Case text following the six-block template. The provenance and the
   detail-page wording are left as explicit instructions rather than
   invented, because a fabricated node or an imagined product description
   is what gets a case rejected. */
/* Which checks a Seller Support case can actually fix. Buy Box, Stranded
   and the sync checks are not category corrections and must not produce a
   case draft, because a case asking Amazon to fix them goes nowhere. */
const CASEABLE = ['GL','Search Department','Product Type','ITK','Category Path'];

function caseText(row, check, ck){

  const site  = row.country === 'CA' ? 'amazon.ca' : 'amazon.com';
  const label = check === 'GL' ? 'GL (General Ledger) category'
              : check === 'Search Department' ? 'search department'
              : check === 'Product Type' ? 'product type'
              : check === 'ITK' ? 'item type keyword'
              : 'browse path';

  const subject = 'Category correction request, ASIN ' + row.asin + ', ' +
                  label + ' incorrect, ' + row.country;

  const body =
    'I am writing to request a correction to the ' + label + ' assigned to ASIN ' +
    row.asin + ' (SKU: ' + row.sku + ') on the ' + site + ' marketplace. This ' +
    'product is the ' + row.name + '. It is currently assigned ' +
    (ck.actual || 'no value') + ' for this attribute. The correct value is ' +
    (ck.expected || '[confirm]') + ', which matches the product detail page and ' +
    'our catalogue records. Could you please update the ' + label + ' to ' +
    (ck.expected || '[confirm]') + ' and confirm once applied?';

  return 'SUBJECT\n' + subject + '\n\nBODY\n' + body +
    '\n\n---\nBefore sending: confirm the value in the product classifier. For a ' +
    'browse node claim add the Browse Tree Guide name and row. Replace the product ' +
    'description with wording taken from the live detail page, since a case that ' +
    'quotes the page is far harder to reject.';
}


/* ---------- column sorting (CPT, Category, Cases) ----------
   Tap a header to sort by it, tap again to flip. Blanks always go last,
   whichever way, so a missing value never floats to the top. */
function sortBy(rows, getter, dir){
  return rows.slice().sort((a,b)=>{
    const x = getter(a), y = getter(b);
    const xe = x === null || x === undefined || x === '', ye = y === null || y === undefined || y === '';
    if(xe || ye) return xe === ye ? 0 : (xe ? 1 : -1);
    if(typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return String(x).localeCompare(String(y), undefined, {numeric:true}) * dir;
  });
}
function sortArrow(state, k){
  return state.sort === k ? `<span class="ar"> ${state.dir > 0 ? '\u2191' : '\u2193'}</span>` : '';
}
function wireSort(scope, state, redraw){
  [...scope.querySelectorAll('th[data-s]')].forEach(th=>{
    th.style.cursor = 'pointer';
    th.title = 'Sort by ' + th.textContent.trim();
    th.onclick = ()=>{
      const k = th.dataset.s;
      if(state.sort === k) state.dir = -state.dir;
      else { state.sort = k; state.dir = th.dataset.d === 'desc' ? -1 : 1; }
      redraw();
    };
  });
}

function qi(key){ return TIPS[key] ? `<span class="qi" tabindex="0" data-tip="${esc(TIPS[key])}">?</span>` : ''; }

// One floating tip for the whole page
(function(){
  const tip = document.createElement('div');
  tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  let anchor = null;
  function show(el){
    anchor = el; tip.textContent = el.dataset.tip; tip.hidden = false;
    const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth - 24);
    tip.style.maxWidth = w + 'px';
    let x = r.left + r.width / 2 - w / 2;
    x = Math.max(12, Math.min(x, window.innerWidth - w - 12));
    tip.style.left = x + 'px';
    const below = r.bottom + 8, h = tip.offsetHeight;
    tip.style.top = (below + h > window.innerHeight - 8 ? r.top - h - 8 : below) + 'px';
  }
  function hide(){ anchor = null; tip.hidden = true; }
  document.addEventListener('mouseover', e=>{ const el = e.target.closest && e.target.closest('[data-tip]'); if(el) show(el); });
  document.addEventListener('mouseout',  e=>{ const el = e.target.closest && e.target.closest('[data-tip]'); if(el && !el.contains(e.relatedTarget)) hide(); });
  document.addEventListener('focusin',   e=>{ if(e.target.dataset && e.target.dataset.tip) show(e.target); });
  document.addEventListener('focusout',  hide);
  // Phones: a tap on a (?) shows the tip instead of sorting the column
  document.addEventListener('click', e=>{
    const q = e.target.closest && e.target.closest('.qi');
    if(q){ e.stopPropagation(); e.preventDefault(); anchor === q ? hide() : show(q); }
    else if(anchor && !(e.target.closest && e.target.closest('[data-tip]'))) hide();
  }, true);
  window.addEventListener('scroll', hide, true);
})();

/* ---------- parent family header ---------- */

/* One header row for a parent family. kids carry parent, psku and pasin.
   extra is a list of [label, html] shown after the IDs. */
function parentHeader(kids, colspan, extra){
  const f = kids.find(k=> k.parent || k.psku || k.pasin) || {};
  const solo = !f.parent && !f.psku && !f.pasin;
  const name = solo ? 'Standalone SKUs' : (f.parent || f.psku || f.pasin);
  const bits = [];
  if(solo) bits.push('<span>Not part of a variation family</span>');
  if(!solo && f.psku)  bits.push(`<span><span class="k">Parent SKU</span><span class="mono">${esc(f.psku)}</span></span>`);
  if(!solo && f.pasin) bits.push(`<span><span class="k">Parent ASIN</span><a href="https://www.amazon.com/dp/${esc(f.pasin)}" target="_blank" rel="noopener">${esc(f.pasin)}</a></span>`);
  bits.push(`<span><b>${kids.length}</b> ${solo ? (kids.length === 1 ? 'SKU' : 'SKUs') : (kids.length === 1 ? 'child' : 'children')}</span>`);
  (extra || []).forEach(x=> bits.push(x));
  return `<tr class="gh pgh${solo ? ' solo' : ''}"><td colspan="${colspan}">`+
    `<div class="pgh-name">${solo ? '\u25a0' : '\u25bc'} ${esc(name)}</div>`+
    `<div class="pgh-meta">${bits.join('')}</div></td></tr>`;
}

/* Colour each column header by what it measures, the same groups in every
   view, so a colour always means the same kind of number. */
const BANDS = [
  [/^(rating|30d|reviews|bsr)$/i, 'bd-rate'],
  [/^(list|sale|feat|price|our price)$/i, 'bd-price'],
  [/^(gl|search department|product type|itk|category path|bsr synced|reviews synced)$/i, 'bd-check'],
  [/^(case|case id|age|type)$/i, 'bd-case'],
  [/^(available|inbound|health|stock)$/i, 'bd-stock']
];
function bandHeaders(){
  [...document.querySelectorAll('#hrow th')].forEach(th=>{
    const t = th.textContent.replace(/[\u25b2\u25bc\u2191\u2193]/g,'').trim();
    th.classList.remove('bd-rate','bd-price','bd-check','bd-case','bd-stock');
    const hit = BANDS.find(b=> b[0].test(t));
    if(hit) th.classList.add(hit[1]);
    const key = TIP_BY_HEAD[t.toLowerCase()];
    if(key && !th.querySelector('.qi')) th.insertAdjacentHTML('beforeend', qi(key));
    // Status is a case field in Cases, a catalog field everywhere else
    if(S.view === 'cases' && /^status$/i.test(t)) th.classList.add('bd-case');
  });
}

/* ---------- render ---------- */

function render(){
  renderView();
  chrome();
  if(S.view === 'cpt') document.getElementById('ov').hidden = true;
  else bandHeaders();
}

function renderView(){

  const isCpt = S.view === 'cpt';
  document.getElementById('cptView').hidden  = !isCpt;
  document.getElementById('mainWrap').hidden = isCpt;
  document.getElementById('bar').hidden      = isCpt;

  if(S.view === 'checklist'){ renderChecklist(); return; }
  if(S.view === 'cases'){ renderCases(); return; }
  if(S.view === 'cpt'){ renderCpt(); return; }
  if(S.view === 'category'){ renderCategory(); return; }

  const rows = visible();
  strip(rows);

  const tbl = document.getElementById('tbl');
  const tb  = document.getElementById('tbody');

  if(!rows.length){
    tbl.hidden = true;
    msg('Nothing matches', ROWS.length ?
      'Loosen a filter, or press Reset all filters.' : 'No catalog rows in data.json.');
    return;
  }
  document.getElementById('msg').hidden = true;
  tbl.hidden = false;
  tbl.className = S.allCols ? '' : 'trim';

  document.getElementById('hrow').innerHTML = COLS.map(c=>
    `<th data-k="${c.k}" class="${c.opt?'opt':''}">${c.t}${S.sort===c.k?`<span class="ar"> ${S.dir>0?'\u2191':'\u2193'}</span>`:''}</th>`
  ).join('');
  [...document.querySelectorAll('th')].forEach(th=> th.onclick = ()=>{
    const k = th.dataset.k;
    S.dir = (S.sort === k) ? -S.dir : 1;
    S.sort = k; render();
  });

  let html = '';

  if(S.group === 'none'){
    rows.forEach((r,i)=> html += tr(r, i));
  }else{
    const g = {};
    rows.forEach(r=>{ const k = r[S.group] || '\u2014 no parent \u2014'; (g[k] = g[k] || []).push(r); });
    // Headers with their rows always beneath. Collapsing them behind a
    // twisty meant every group needed opening before anything was readable.
    Object.keys(g).sort((a,b)=>{
      const na = /no parent/.test(a), nb = /no parent/.test(b);
      return na !== nb ? (na ? 1 : -1) : a.localeCompare(b);
    }).forEach(k=>{
      const kids = g[k];
      const rated = kids.map(r=>r.cur).filter(v=>v!==null);
      const lo = rated.length ? Math.min(...rated).toFixed(1) : null;
      const hi = rated.length ? Math.max(...rated).toFixed(1) : null;
      const stock = kids.reduce((s,r)=>s+(r.avail||0),0);
      const oos = kids.filter(r=>r.avail === 0).length;

      const avg = rated.length ? (rated.reduce((a,b)=> a+b, 0) / rated.length).toFixed(1) : null;
      html += parentHeader(kids, COLS.length, [
        rated.length ? `<span><span class="k">Rating</span><b>${lo===hi ? lo : lo + ' to ' + hi}\u2605</b>${rated.length > 1 ? ' (avg ' + avg + ')' : ''}</span>` : '',
        `<span><span class="k">Stock</span><b>${stock}</b> units</span>`,
        oos ? `<span class="pgh-tag bad">${oos} out of stock</span>` : ''
      ].filter(Boolean));

      kids.forEach(r=> html += tr(r, rows.indexOf(r)));
    });
  }

  tb.innerHTML = html;

  // A red circle should do something wherever it appears. In this view there
  // is no case to draft, so it explains itself and says whose job it is.
  [...tb.querySelectorAll('.ind.i-bad,.ind.i-warn')].forEach(el=>{
    if(!el.dataset.ind) return;
    el.onclick = ()=> openPriceDetail(rows[+el.dataset.row], el.dataset.ind);
  });
}


function openPriceDetail(row, kind){

  const st = IND[kind](row);
  const w  = PRICE_WHY[kind] || {};
  const d  = document.getElementById('detail');

  const money = v => (v === null || v === undefined) ? '\u2014' : v.toFixed(2);

  d.innerHTML =
    `<h2>${esc(w.title || kind)} \u00b7 ${esc(S.mk)}</h2>`+
    `<h3>${esc(row.sku)} \u00b7 ${esc(row.name)}</h3>`+
    `<div class="why">${esc(w[st] || '')}</div>`+
    '<dl>'+
    `<dt>ASIN</dt><dd class="mono">${esc(row.asin)}</dd>`+
    `<dt>List price</dt><dd>${money(row.list)}</dd>`+
    `<dt>Sale price</dt><dd>${money(row.sale)}</dd>`+
    `<dt>Featured offer</dt><dd>${money(row.feat)}</dd>`+
    `<dt>Selling at</dt><dd>${money(row.sale > 0 ? row.sale : row.list)}</dd>`+
    '</dl>'+
    `<div class="why">${esc(w.fix || '')}</div>`+
    '<div class="actions">'+
      `<a href="https://www.${S.mk === 'CA' ? 'amazon.ca' : 'amazon.com'}`+
        `/dp/${encodeURIComponent(row.asin)}" target="_blank" rel="noopener">Detail page</a>`+
      '<button id="closeBtn">Close</button>'+
    '</div>';

  document.getElementById('closeBtn').onclick = closeDetail;
  document.getElementById('veil').hidden = false;
}

function tr(r, IDX){
  return '<tr>' + COLS.map(c=>{
    let v = r[c.k], cls = c.cls || '';
    if(c.num) cls += ' num';
    if(c.opt) cls += ' opt';

    if(c.ind){
      const st = IND[c.ind](r);
      const t  = (IND_TITLE[c.ind] && IND_TITLE[c.ind][st]) || st;
      const price = v === null ? '' : ' ' + v.toFixed(2);
      return `<td class="ind-cell ${cls}"><span class="ind i-${st}" `+
             `data-ind="${c.ind}" data-row="${IDX}" `+
             `title="${esc(t)}${esc(price)}"></span></td>`;
    }

    if(c.k === 'sku' || c.k === 'asin'){
      const body = v ? esc(v) : '<span class="mut">\u2014</span>';

      // Stock sits under the SKU only, not under the ASIN
      let stock = '';
      if(c.k === 'sku'){
        const st = stockState(r);
        if(st !== 'none'){
          stock = `<span class="stk s-${st}">${r.avail}`+
                  (st === 'oos' && r.inbound > 0 ? ` \u00b7 ${r.inbound} in` : '')+
                  '</span>';
        }
      }

      return `<td class="${cls.trim()}" data-sku="${esc(r.sku)}" `+
             `data-asin="${esc(r.asin)}">${body}${stock}</td>`;
    }

    if(c.k === 'brand')
      v = v ? `<span class="pill ${v==='Seedboy'?'b-sb':'b-byd'}">${v==='Seedboy'?'SB':'BYD'}</span>` : '';
    else if(c.k === 'status')
      v = v ? `<span class="${/^active$/i.test(v) ? 'ok' : 'mut'}">${esc(v)}</span>`
            : '<span class="mut">\u2014</span>';
    else if(c.k === 'tier' || c.k === 'ptier')
      v = v ? `<span class="tier t${v}">${v}</span>` : '<span class="mut">\u2014</span>';
    else if(c.k === 'cur')
      v = v === null ? '<span class="mut">\u2014</span>'
        : `<span class="${v < 4.5 ? 'warn' : ''}">${v.toFixed(1)}</span>`;
    else if(c.k === 'd30')
      v = v === null ? '<span class="mut">\u2014</span>'
        : (v === 0 ? '<span class="mut">0</span>'
        : `<span class="${v < 0 ? 'warn' : 'ok'}">${v > 0 ? '+' : ''}${v.toFixed(1)}</span>`);
    else if(c.k === 'avail')
      v = v === null ? '<span class="mut">\u2014</span>'
        : (v === 0 ? '<span class="warn">0</span>' : v);
    else if(c.k === 'inbound')
      v = (v === null || v === 0) ? '<span class="mut">\u2014</span>' : v;
    else if(c.k === 'health')
      v = v ? `<span class="${/healthy/i.test(v)?'ok':'warn'}">${esc(v)}</span>` : '<span class="mut">\u2014</span>';
    else if(v === null || v === '')
      v = '<span class="mut">\u2014</span>';
    else v = esc(v);

    return `<td class="${cls.trim()}">${v}</td>`;
  }).join('') + '</tr>';
}

function strip(rows){
  const oos = rows.filter(r=>r.avail === 0).length;
  const low = rows.filter(r=>r.cur !== null && r.cur < 4.5).length;
  const nl  = rows.filter(r=>stList(r) === 'bad').length;
  const nf  = rows.filter(r=>stFeat(r) === 'bad').length;

  overview('Catalog', `${esc(S.mk)} marketplace, ratings ${esc(META.when || '?')}`, [
    ['SKUs shown', `${rows.length}<span style="font-size:1rem;color:var(--night-mut)"> of ${ROWS.length}</span>`, '',
       rows.length === ROWS.length ? 'No filters on' : 'Filtered'],
    ['Out of stock', oos, oos ? 'bad' : 'good', 'Available is zero'],
    ['Under 4.5\u2605', low, low ? 'warn' : 'good', 'Current rating'],
    ['No list price', nl, nl ? 'bad' : 'good', 'List price missing'],
    ['Above featured', nf, nf ? 'bad' : 'good', 'Not the featured offer']
  ]);
  document.getElementById('bar').innerHTML =
    `<span class="mut"><span class="ind i-ok"></span>ok `+
    `<span class="ind i-bad" style="margin-left:.4rem"></span>attention `+
    `<span class="ind i-none" style="margin-left:.4rem"></span>not set</span>`+
    `<button id="colBtn">${S.allCols ? 'Fewer columns' : 'All columns'}</button>`;

  const cb = document.getElementById('colBtn');
  if(cb) cb.onclick = ()=>{ S.allCols = !S.allCols; render(); };
}

/* Header line and nav badges. Called from every view, not just Catalog, so
   the counts never sit stale while you are somewhere else. */
function chrome(){
  if(!ROWS.length && !CAT.length && !CASES.length) return;
  document.getElementById('meta').innerHTML =
    `<b>${META.skus||0}</b> SKUs \u00b7 ${esc(S.mk)} \u00b7 ratings ${esc(META.when||'?')}`+
    (META.tokens!==undefined && META.tokens!==null ? ` \u00b7 ${META.tokens} tokens` : '')+
    (META.note ? ` \u00b7 <span style="color:#f0b6a8">${esc(META.note)}</span>` : '')+
    (sourceNote() ? ' \u00b7 ' + sourceNote() : '');

  // Count active filters so the collapsed state still tells you something
  // is on. A hidden filter you have forgotten about is worse than no filter.
  const n = S.brands.size + S.statuses.size + S.tiers.size + S.ptiers.size +
            S.stock.size + S.price.size + (S.q ? 1 : 0) +
            (S.group !== 'none' ? 1 : 0);
  const t = document.getElementById('toggle');
  t.innerHTML = 'Filters' + (n ? `<span class="badge">${n}</span>` : '');

  // Total outstanding across every task, so the number means the same thing
  // wherever you are rather than moving as you drill in.
  const open = TASKS.reduce((s,tk)=> s + (tk.checks ? catFailing(true, tk.checks).length : 0), 0);
  document.getElementById('homeBtn').innerHTML =
    'Checklist' + (open ? `<span class="badge">${open}</span>` : '');

  const nCat = catFailing(true, CHECKS).length;
  document.getElementById('quickCat').innerHTML =
    'Category' + (nCat ? `<span class="badge">${nCat}</span>` : '');

  if(CPT.length){
    const need = cptRows().filter(r=> r.action === 'open' || r.action === 'follow').length;
    document.getElementById('cptBtn').innerHTML = 'CPT tracker' + (need ? `<span class="badge">${need}</span>` : '');
  }
  document.getElementById('casesBtn').innerHTML =
    'Cases' + (CASES.length ? `<span class="badge">${CASES.length}</span>` : '');
}

function msg(title, sub){
  const m = document.getElementById('msg');
  m.hidden = false;
  m.innerHTML = `<b>${esc(title)}</b>${sub?esc(sub):''}`;
  document.getElementById('tbl').hidden = true;
}

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- csv ---------- */

function csv(){
  const rows = visible();
  if(!rows.length) return;
  const cell = v => (v===null||v===undefined) ? '' :
    (/[",\n]/.test(String(v)) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v));

  const out = [COLS.map(c=>c.t).join(',')]
    .concat(rows.map(r=> COLS.map(c=>cell(r[c.k])).join(',')))
    .join('\n');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out], {type:'text/csv'}));
  a.download = 'alm-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- wiring ---------- */

function segment(id, key){
  const box = document.getElementById(id);
  [...box.querySelectorAll('button')].forEach(b=> b.onclick = ()=>{
    [...box.querySelectorAll('button')].forEach(x=> x.setAttribute('aria-pressed','false'));
    b.setAttribute('aria-pressed','true');
    S[key] = b.dataset.brand || b.dataset.group;
    if(key === 'group') S.open.clear();
    render();
  });
}
segment('groupSeg','group');

[...document.querySelectorAll('#mkSeg button')].forEach(b=> b.onclick = ()=>{
  [...document.querySelectorAll('#mkSeg button')]
    .forEach(x=> x.setAttribute('aria-pressed','false'));
  b.setAttribute('aria-pressed','true');
  S.mk = b.dataset.mk;
  applyMk();
  render();
});

// Drawn immediately, before any fetch, so the filters are never blank.
chips('brandBox','brands','brandAll',BRANDS);
chips('statusBox','statuses','statusAll',STATUS);
chips('tierBox', 'tiers', 'tierAll', TIERS);
chips('ptierBox','ptiers','ptierAll',TIERS);

[...document.querySelectorAll('[data-stock]')].forEach(b=> b.onclick = ()=>{
  const k = b.dataset.stock;
  S.stock.has(k) ? S.stock.delete(k) : S.stock.add(k);
  b.setAttribute('aria-pressed', S.stock.has(k));
  render();
});

[...document.querySelectorAll('[data-price]')].forEach(b=> b.onclick = ()=>{
  const k = b.dataset.price;
  S.price.has(k) ? S.price.delete(k) : S.price.add(k);
  b.setAttribute('aria-pressed', S.price.has(k));
  render();
});

document.getElementById('brandAll').onclick  = ()=> clearChips('brands','brandBox','brandAll');
document.getElementById('statusAll').onclick = ()=> clearChips('statuses','statusBox','statusAll');
document.getElementById('tierAll').onclick  = ()=> clearChips('tiers','tierBox','tierAll');
document.getElementById('ptierAll').onclick = ()=> clearChips('ptiers','ptierBox','ptierAll');

function clearChips(key, box, allBtn){
  S[key].clear();
  [...document.getElementById(box).querySelectorAll('button')]
    .forEach(b=> b.setAttribute('aria-pressed','false'));
  document.getElementById(allBtn).setAttribute('aria-pressed','true');
  render();
}

let t;
document.getElementById('q').oninput = e=>{
  clearTimeout(t);
  t = setTimeout(()=>{ S.q = e.target.value.trim(); render(); }, 180);
};

/* ---------- panel ---------- */

const panel = document.getElementById('panel');
const tBtn  = document.getElementById('toggle');
const split = document.getElementById('split');

function setPanel(open){
  panel.hidden = !open;
  split.hidden = !open;          // nothing to resize when it is closed
  tBtn.setAttribute('aria-expanded', open);
}

tBtn.onclick = ()=> setPanel(panel.hidden);

// Closed by default on a phone, where the filters would otherwise take the
// whole screen. Open on a laptop, where there is room for both.
// Closed by default: the overview band is the first thing to read, and the
// Filters button (with its count badge) opens this when it is needed.
setPanel(false);

// Element looked up directly rather than through the const declared further
// down. Referencing that const before its declaration line throws, which
// stopped the script before load() was ever called.
document.getElementById('homeBtn').setAttribute('aria-pressed', 'true');


/* Drag the divider to set the split yourself. Pointer events rather than
   mouse events, so a finger on the tablet works the same as a mouse.
   Height is held in memory only, so a reload returns to the default. */
split.addEventListener('pointerdown', e=>{
  if(panel.hidden) return;
  e.preventDefault();
  split.setPointerCapture(e.pointerId);

  const y0 = e.clientY;
  const h0 = panel.getBoundingClientRect().height;

  const move = ev=>{
    const h = Math.max(0, Math.min(window.innerHeight * 0.8, h0 + (ev.clientY - y0)));
    panel.style.maxHeight = 'none';
    panel.style.height = h + 'px';
  };

  const up = ()=>{
    split.removeEventListener('pointermove', move);
    split.removeEventListener('pointerup', up);
    split.removeEventListener('pointercancel', up);
  };

  split.addEventListener('pointermove', move);
  split.addEventListener('pointerup', up);
  split.addEventListener('pointercancel', up);
});

// Double click puts it back to the default height
split.ondblclick = ()=>{
  panel.style.height = '';
  panel.style.maxHeight = '';
};


/* Fullscreen, which is the real fix for a small screen on a tablet */
const fsBtn = document.getElementById('fs');

fsBtn.onclick = ()=>{
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(err=>{
    console.warn('Fullscreen refused:', err && err.message);
  });
};

document.addEventListener('fullscreenchange', ()=>{
  fsBtn.textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
});

/* ---------- navigation ---------- */

const homeBtn    = document.getElementById('homeBtn');
const catalogBtn = document.getElementById('catalogBtn');

const quickCat   = document.getElementById('quickCat');

const casesBtn = document.getElementById('casesBtn');
const cptBtn   = document.getElementById('cptBtn');

let PANEL_BEFORE_CPT = null;

function go(view){
  // The CPT view has its own controls, so the filter panel folds away while
  // it is open and comes back as it was when you leave.
  if(view === 'cpt' && S.view !== 'cpt'){
    PANEL_BEFORE_CPT = !document.getElementById('panel').hidden;
    setPanel(false);
  } else if(view !== 'cpt' && S.view === 'cpt' && PANEL_BEFORE_CPT !== null){
    setPanel(PANEL_BEFORE_CPT);
    PANEL_BEFORE_CPT = null;
  }
  S.view = view;
  if(view !== 'category'){ S.checks = null; S.taskName = ''; }
  homeBtn.setAttribute('aria-pressed', view === 'checklist');
  quickCat.setAttribute('aria-pressed', view === 'category');
  casesBtn.setAttribute('aria-pressed', view === 'cases');
  cptBtn.setAttribute('aria-pressed', view === 'cpt');
  catalogBtn.setAttribute('aria-pressed', view === 'catalog');
  render();
}

casesBtn.onclick = ()=> go('cases');
cptBtn.onclick   = ()=> go('cpt');

homeBtn.onclick    = ()=> go('checklist');
catalogBtn.onclick = ()=> go('catalog');

// Straight to the category checks, without going via the checklist
quickCat.onclick = ()=>{
  S.checks   = ['GL','Search Department','Product Type','ITK','Category Path'];
  S.taskName = 'Correct Categories (US & CA)';
  go('category');
  quickCat.setAttribute('aria-pressed', 'true');
};

document.getElementById('veil').onclick = e=>{
  if(e.target.id === 'veil') closeDetail();
};
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape') closeDetail();
});

document.getElementById('bRefresh').onclick = ()=> load(true);
document.getElementById('bCsv').onclick = csv;
document.getElementById('bReset').onclick = ()=>{
  S.stock.clear(); S.price.clear();
  S.group='none'; S.q=''; S.sort='sku'; S.dir=1; S.open.clear();
  document.getElementById('q').value = '';

  const bs = [...document.getElementById('groupSeg').querySelectorAll('button')];
  bs.forEach((b,i)=> b.setAttribute('aria-pressed', i===0));

  [...document.querySelectorAll('[data-stock],[data-price]')]
    .forEach(b=> b.setAttribute('aria-pressed','false'));

  clearChips('brands','brandBox','brandAll');
  clearChips('statuses','statusBox','statusAll');
  clearChips('tiers','tierBox','tierAll');
  clearChips('ptiers','ptierBox','ptierAll');
};

load();
</script>
