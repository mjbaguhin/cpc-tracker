<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALM Console</title>

<!-- Two icon references on purpose. The PNG is a real file, which Chrome
     picks up most reliably, and the ?v= defeats its very sticky favicon
     cache. The inline SVG is the fallback so the tab is never a blank globe
     even before the PNG has uploaded. -->
<link rel="icon" type="image/png" sizes="180x180" href="alm-icon.png?v=2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101418'/%3E%3Cg fill='%23e9edf2'%3E%3Crect x='13' y='17' width='24' height='6' rx='3'/%3E%3Crect x='13' y='29' width='18' height='6' rx='3'/%3E%3Crect x='13' y='41' width='22' height='6' rx='3'/%3E%3C/g%3E%3Ccircle cx='45' cy='32' r='6' fill='%23c0472f'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="alm-icon.png?v=2">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-title" content="ALM">
<style>
:root{
  --ink:#101418;
  --slab:#ffffff;
  --field:#e9edf2;
  --line:#d3dae3;
  --line-soft:#e6ebf1;
  --muted:#68727f;
  --byd:#9a5f2e;
  --sb:#3f6f36;
  --warn:#a83a26;
  --ok:#256b5c;
  --accent:#22456f;
  --accent-soft:#dde6f2;
}

*{box-sizing:border-box;margin:0;padding:0}

/* App shell. The page itself never scrolls; only the table does. That is
   what lets the table header stay put, and it stops the filters eating the
   screen on a phone. */
html{height:100%}
body{
  background:var(--field);
  color:var(--ink);
  font:15px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.86em;letter-spacing:-.01em}

/* ---------- masthead ---------- */
header{
  background:var(--ink);color:#fff;
  padding:.6rem 1rem;
  flex:0 0 auto;
  display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;
}
header h1{
  font-size:.74rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.18em;
}
#meta{font-size:.7rem;color:#93a0b0;letter-spacing:.02em}
#meta b{color:#ccd6e2;font-weight:600}

#toggle,#fs,#homeBtn,#quickCat,#casesBtn,#catalogBtn,#cptBtn{
  font-size:.74rem;padding:.24rem .6rem;
  background:transparent;color:#fff;border:1px solid #3a4652;
}
#homeBtn{margin-left:auto}
#homeBtn[aria-pressed="true"],#quickCat[aria-pressed="true"],
#casesBtn[aria-pressed="true"],
#cptBtn[aria-pressed="true"],
#catalogBtn[aria-pressed="true"]{
  background:#2f4a6d;border-color:#4a6fa5;
}
#toggle:hover,#fs:hover,#homeBtn:hover,#quickCat:hover,#casesBtn:hover,#catalogBtn:hover,#cptBtn:hover{background:#1c232b}
#toggle .badge,#homeBtn .badge,#quickCat .badge,#casesBtn .badge,#cptBtn .badge{
  display:inline-block;margin-left:.35rem;padding:0 .32rem;
  background:#a83a26;border-radius:8px;font-size:.68rem;font-weight:700;
}

/* checklist rows read as tappable, since the whole row is the target */
tr.task{cursor:pointer}
tr.case{cursor:pointer}
tr.cpt{cursor:pointer}
tr.cpt:hover td{background:var(--accent-soft)}
.gap-bad{color:var(--warn);font-weight:600}
.gap-ok{color:var(--ok)}
.hist{width:100%;border-collapse:collapse;margin-top:.8rem;min-width:0}
.hist th,.hist td{padding:.3rem .5rem;border-bottom:1px solid var(--line-soft);text-align:left;font-size:.84rem}
.hist td.num,.hist th.num{text-align:right}
.spark{display:block;margin:.6rem 0 .2rem}

/* ---------- CPT tracker view ----------
   Two zones. A dark overview band on top, the same night-desk look as the
   review monitor, with the four numbers that say whether today is a problem.
   Under it, one row per ASIN with banded column headers, like the rating
   tracker, so price, threshold and gap read as separate instruments. */
#cptView{
  --c-night:#15181d; --c-night2:#1d2128; --c-night-line:#2b313a; --c-night-mut:#8a94a3;
  --c-ours:#1f6b4f; --c-cpt:#22456f; --c-gap:#4e3a8e; --c-move:#7c2f28; --c-sim:#3d4a57;
  --c-pill:#eef2f6;
  background:var(--field);
}
#cptView[hidden],#bar[hidden],#mainWrap[hidden]{display:none}

.cpt-top{background:var(--c-night);color:#e8edf3;padding:1.1rem 1.25rem 1.2rem}
.cpt-head{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;margin-bottom:1rem}
.cpt-head h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.cpt-head .sub{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.78rem;color:var(--c-night-mut)}
.cpt-live{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--c-night-line);
  border-radius:6px;padding:.18rem .55rem;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.76rem;color:#cfd7e2}
.cpt-live i{width:.45rem;height:.45rem;border-radius:50%;background:#3fbf7f;display:inline-block}
.cpt-live.stale i{background:#d9a13b}

.cpt-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:.7rem}
.cpt-tile{background:var(--c-night2);border:1px solid var(--c-night-line);border-radius:8px;padding:.8rem .95rem;min-width:0}
.cpt-tile .k{font-size:.78rem;color:var(--c-night-mut);margin-bottom:.35rem}
.cpt-tile .v{font-size:1.9rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.cpt-tile .v.bad{color:#ff8a73}
.cpt-tile .v.warn{color:#f2c46b}
.cpt-tile .n{font-size:.78rem;color:var(--c-night-mut);margin-top:.3rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:820px){ .cpt-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} }

.cpt-tools{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.7rem 1.25rem;background:var(--slab);border-bottom:1px solid var(--line)}
.cpt-tools .seg button{font-size:.8rem;padding:.28rem .7rem}
.cpt-tools input{flex:1 1 14rem;min-width:10rem;font:inherit;font-size:.85rem;padding:.38rem .6rem;border:1px solid var(--line);border-radius:6px}
.cpt-tools .count{margin-left:auto;font-size:.8rem;color:var(--muted)}

.cpt-table{width:100%;min-width:62rem;border-collapse:separate;border-spacing:0;background:var(--slab)}
.cpt-table thead th{position:sticky;top:0;z-index:2;color:#fff;font-size:.72rem;font-weight:700;
  text-transform:none;letter-spacing:.02em;padding:.75rem .7rem;border:0;background:var(--c-night);white-space:nowrap}
.cpt-table thead th.b-ours{background:var(--c-ours)}
.cpt-table thead th.b-cpt{background:var(--c-cpt)}
.cpt-table thead th.b-gap{background:var(--c-gap)}
.cpt-table thead th.b-move{background:var(--c-move)}
.cpt-table thead th.b-sim{background:var(--c-sim)}
.cpt-table thead th:first-child{border-top-left-radius:8px}
.cpt-table thead th:last-child{border-top-right-radius:8px}
.cpt-table th.c,.cpt-table td.c{text-align:center}
/* The catalog table pins its first two columns; this one does not */
.cpt-table th,.cpt-table td{position:static;min-width:0;max-width:none;box-shadow:none !important}
.cpt-table thead th{position:sticky}
.cpt-table tr:hover td{background:transparent}
.cpt-table td.c{font-family:inherit;font-size:inherit}
.cpt-table td.prod{min-width:19rem}
.cpt-table td{border-left:0 !important;border-right:0 !important;padding:.85rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:middle;white-space:nowrap}
.cpt-table tr.row{cursor:pointer}
.cpt-table tr.row:hover td{background:#f5f8fb}
.cpt-table tr.row:focus-visible td{outline:2px solid var(--accent);outline-offset:-2px}

.p-name{font-weight:700;font-size:.95rem;max-width:22rem;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:.45rem}
.p-name .dot{width:.5rem;height:.5rem;margin:0;flex:0 0 auto}
.p-id{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.78rem;color:#2257a5;margin-top:.15rem}
.p-id span{color:var(--muted);margin-right:.25rem}
.p-size{display:inline-block;margin-top:.3rem;font-size:.72rem;padding:.08rem .45rem;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}

.cpill{display:inline-block;min-width:5.6rem;font-size:.95rem;text-align:center;padding:.3rem .6rem;border-radius:6px;border:1px solid var(--line);
  background:var(--c-pill);font-weight:700;font-variant-numeric:tabular-nums}
.cpill.ours{background:#e7f4ee;border-color:#b9dccb;color:var(--c-ours)}
.cpill.sale{background:#fff;border-color:#b9dccb;color:var(--c-ours);font-weight:600}
.was{display:block;font-size:.74rem;color:var(--muted);margin-top:.2rem}
.cpt-table tr.cpt-gh td{background:#f3f5f9;border-bottom:1px solid var(--line);padding:.6rem .7rem;
  box-shadow:inset 3px 0 0 var(--accent) !important;font-size:.85rem}
.cpt-gh .gname{font-weight:700;color:var(--ink)}
.cpt-gh .gid{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.76rem;color:var(--id, #2257a5);margin-left:.4rem}
.cpt-gh .gcount{color:var(--muted);margin-left:.5rem}
.cpt-gh .gover{margin-left:.5rem;padding:.1rem .45rem;border-radius:5px;background:#fbe7e3;color:var(--warn);font-weight:700;font-size:.76rem}
.cpt-gh .gok{margin-left:.5rem;padding:.1rem .45rem;border-radius:5px;background:#e4f3ee;color:var(--ok);font-weight:600;font-size:.76rem}
.act-row{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.7rem}
button.work.strong{background:#b42318;border-color:#b42318;color:#fff}
button.work.strong:hover{background:#8f1d12;border-color:#8f1d12}
.agh-b{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.55rem}
.agh-b button{font-size:.78rem}
.pguide{background:#fbfaff;border-bottom:1px solid var(--line);padding:.9rem 1.25rem}
.pg-h{font-weight:800;font-size:.95rem;margin-bottom:.5rem;color:#3b1d8f}
.pg-one{font-size:.88rem;margin:0 0 .6rem;padding:.55rem .7rem;border-radius:8px;background:#fff;border:1px solid #ddd6fe}
.pg-row{display:grid;grid-template-columns:8.5rem 1fr;gap:.8rem;padding:.35rem 0;border-bottom:1px solid #ece8fb;font-size:.85rem}
.pg-t{font-weight:700}
.pg-d{color:#374151;line-height:1.45}
.pg-steps{margin:.4rem 0 .3rem 1.2rem}
.pg-steps li{margin:.15rem 0}
.pg-end{font-weight:700;color:#8f1d12}
.pg-ex{margin-top:.7rem;padding:.6rem .75rem;border-radius:8px;background:#ede9fe;font-size:.85rem;line-height:1.5}
@media(max-width:600px){ .pg-row{grid-template-columns:1fr;gap:.15rem} }
#tip{position:fixed;z-index:9999;background:#15181d;color:#f1f4f8;font-size:.82rem;line-height:1.45;
  padding:.55rem .7rem;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;font-weight:500;text-transform:none;letter-spacing:0}
#tip[hidden]{display:none}
.qi{display:inline-flex;align-items:center;justify-content:center;width:1.05rem;height:1.05rem;margin-left:.35rem;
  border-radius:50%;background:rgba(255,255,255,.22);color:inherit;font-size:.68rem;font-weight:800;cursor:help;vertical-align:middle}
.qi:hover,.qi:focus{background:rgba(255,255,255,.4);outline:none}
.cpt-tile .qi,.ov-tile .qi{background:rgba(255,255,255,.14)}
[data-tip]:not(.qi){cursor:help}
.mailst{display:block;margin-top:.3rem;font-size:.74rem;font-weight:700}
.mailst span{font-weight:500;color:var(--muted)}
.mailst.m-bad{color:#b42318}
.mailst.m-warn{color:#8a5a0b}
.mailst.m-wait{color:#475569}
.mailst.m-ok{color:var(--ok)}
.ac{display:inline-block;padding:.3rem .65rem;border-radius:6px;font-weight:700;font-size:.82rem;white-space:nowrap}
.ac-open{background:#b42318;color:#fff}
.ac-follow{background:#22456f;color:#fff}
.ac-watch{background:#fdf1d8;color:#8a5a0b}
.cpt-table tr.act-open td{background:#fff6f4}
.cpt-table tr.act-open td:first-child{box-shadow:inset 4px 0 0 #b42318 !important}
.cpt-table tr.act-follow td{background:#f4f8fd}
.cpt-table tr.act-follow td:first-child{box-shadow:inset 4px 0 0 #22456f !important}
.cpt-table tr.act-open:hover td{background:#ffece8}
.cpt-table tr.act-follow:hover td{background:#e9f1fb}
.cpt-table tr.agh td{padding:.75rem 1rem !important;border-bottom:1px solid var(--line)}
.agh-t{font-weight:800;font-size:.95rem}
.agh-n{display:inline-block;margin-left:.35rem;padding:0 .45rem;border-radius:9px;font-size:.78rem;color:#fff;background:#64748b}
.agh-s{font-size:.78rem;color:var(--muted);margin-top:.15rem}
.cpt-table tr.agh-open td{background:#fde7e3 !important;box-shadow:inset 6px 0 0 #b42318 !important}
.cpt-table tr.agh-open .agh-t{color:#8f1d12}
.cpt-table tr.agh-open .agh-n{background:#b42318}
.cpt-table tr.agh-follow td{background:#e6eef8 !important;box-shadow:inset 6px 0 0 #22456f !important}
.cpt-table tr.agh-follow .agh-t{color:#1b3a5f}
.cpt-table tr.agh-follow .agh-n{background:#22456f}
.cpt-table tr.agh-watch td{background:#fdf6e6 !important;box-shadow:inset 6px 0 0 #c8912e !important}
.cpt-table tr.agh-none td{background:#f3f5f9 !important;box-shadow:inset 6px 0 0 #94a3b8 !important}
.vd{display:inline-block;padding:.28rem .6rem;border-radius:6px;font-weight:700;font-size:.82rem;white-space:nowrap}
.vd-strong{background:#7c2f28;color:#fff}
.vd-possible{background:#fbe7e3;color:var(--warn)}
.vd-price{background:#eef1f5;color:#475569}
.vd-open{background:#e6eef8;color:var(--accent)}
.cpt-table thead th.b-case{background:var(--c-move)}
.why-list{margin:.2rem 0 0 1.1rem;font-size:.86rem;line-height:1.45}
.why-list li{margin:.15rem 0}
.fbadge{display:inline-block;margin-left:.3rem;padding:0 .35rem;border-radius:8px;background:var(--warn);color:#fff;font-size:.7rem}
.cpt-filters{background:#fff;border-bottom:1px solid var(--line);padding:.75rem 1.25rem .9rem}
.rf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:.55rem 1.5rem}
.rf{display:flex;align-items:center;gap:.4rem}
.rf label{font-size:.8rem;font-weight:600;color:var(--ink);min-width:6.5rem}
.rf input{flex:0 0 5.4rem;width:5.4rem;min-width:0;font:inherit;font-size:.85rem;padding:.3rem .45rem;border:1px solid var(--line);border-radius:6px}
.rf-row{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;margin-top:.7rem}
.rf-row .lbl2{font-size:.8rem;font-weight:600;color:var(--muted);margin-right:.2rem}
.rf-tip{margin-top:.6rem;font-size:.8rem;color:var(--muted)}
.cpill.cpt{background:#e6eef8;border-color:#bccde6;color:var(--c-cpt)}
.gap-badge{display:inline-block;font-size:.9rem;padding:.3rem .6rem;border-radius:6px;font-weight:700;font-variant-numeric:tabular-nums}
.gap-badge.over{background:#fbe7e3;color:var(--warn)}
.gap-badge.ok{background:#e4f3ee;color:var(--ok)}
.tgt{display:block;font-size:.74rem;font-weight:700;color:#4e3a8e;margin-top:.15rem}
.gap-badge.held{background:#fdf1d8;color:#8a5a0b}
.move{font-variant-numeric:tabular-nums}
.move .ago{display:block;font-size:.76rem;color:var(--muted);margin-top:.15rem}
.move .ago.hot{color:var(--warn);font-weight:700}
.sim .lo{font-weight:700;font-variant-numeric:tabular-nums}
.sim .where{display:block;font-size:.76rem;color:var(--muted);margin-top:.15rem}
td.trend svg{display:block}
.cpt-empty{padding:2.5rem 1.25rem;text-align:center;color:var(--muted)}
.cpt-empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:.3rem}
tr.case:hover td{background:var(--accent-soft)}
td.id2{max-width:11rem;overflow:hidden;text-overflow:ellipsis}
.go{color:var(--muted);font-size:.75rem}
tr.task:hover .go{color:var(--accent)}
button.work{
  font-size:.76rem;padding:.2rem .55rem;
  border-color:var(--accent);color:var(--accent);font-weight:600;
}
button.work:hover{background:var(--accent);color:#fff}

tr.task:hover td{background:var(--accent-soft)}
tr.task td{padding:.7rem .6rem}

/* ---------- detail overlay ---------- */
#veil{
  position:fixed;inset:0;background:rgba(16,20,24,.55);
  display:flex;align-items:flex-end;justify-content:center;z-index:60;
}
#veil[hidden]{display:none}

#detail{
  background:var(--slab);width:min(46rem,100%);
  max-height:88dvh;overflow-y:auto;
  border-radius:6px 6px 0 0;
  padding:1.1rem 1.2rem 1.4rem;
}
@media(min-width:701px){
  #veil{align-items:center}
  #detail{border-radius:4px}
}

#detail h2{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;
  color:var(--muted);font-weight:700;margin-bottom:.15rem;
}
#detail h3{font-size:1.02rem;margin-bottom:.8rem}
#detail .why{
  background:var(--field);border-left:3px solid var(--warn);
  padding:.6rem .75rem;font-size:.86rem;margin-bottom:.9rem;
}
#detail dl{display:grid;grid-template-columns:8rem 1fr;gap:.3rem .8rem;
  font-size:.84rem;margin-bottom:1rem}
#detail dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;
  letter-spacing:.08em;padding-top:.15rem}
#detail dd{word-break:break-word}

#draft{
  width:100%;min-height:13rem;font:inherit;font-size:.8rem;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  padding:.6rem;border:1px solid var(--line);border-radius:2px;
  background:var(--field);resize:vertical;
}
.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.actions a{
  font-size:.8rem;padding:.34rem .68rem;border:1px solid var(--line);
  border-radius:2px;text-decoration:none;color:var(--ink);background:var(--slab);
}
.actions a:hover{background:var(--field)}

/* clickable circles */
td.ind-cell .ind{cursor:default}
td.ind-cell .ind.i-bad,td.ind-cell .ind.i-warn{cursor:pointer}
td.ind-cell .ind.i-bad:hover{outline:2px solid var(--warn);outline-offset:2px}

/* ---------- controls ---------- */
#panel{
  background:var(--slab);
  border-bottom:1px solid var(--line);
  padding:.7rem 1rem;
  flex:0 0 auto;
  overflow-y:auto;
  /* Capped so the table always gets most of the screen. Scrolls inside
     itself, and the divider below lets this be dragged to any height. */
  max-height:32dvh;
}
#panel[hidden]{display:none}

/* Drag handle. Pointer events rather than mouse events, so it works with
   a finger on the tablet as well as a mouse. */
#split{
  flex:0 0 auto;
  height:.8rem;
  background:var(--field);
  border-bottom:1px solid var(--line);
  cursor:row-resize;
  display:flex;align-items:center;justify-content:center;
  touch-action:none;
}
#split::before{
  content:'';width:2.4rem;height:3px;border-radius:2px;background:var(--line);
}
#split:hover::before{background:var(--muted)}
#split[hidden]{display:none}

.grp{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:.5rem}
.grp:last-child{margin-bottom:0}
.lbl{
  font-size:.63rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.13em;color:var(--muted);
  min-width:5.4rem;
}

button{
  font:inherit;font-size:.8rem;
  padding:.34rem .68rem;
  border:1px solid var(--line);
  background:var(--slab);color:var(--ink);
  border-radius:2px;cursor:pointer;
  transition:background .12s,border-color .12s;
}
button:hover{background:var(--field)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{
  background:var(--accent);border-color:var(--accent);color:#fff;
}
button.act{border-color:var(--ink)}
button.act:hover{background:var(--ink);color:#fff}

.seg{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);border-radius:0}
.seg button:last-child{border-right:0}

input[type=search]{
  font:inherit;font-size:.8rem;padding:.34rem .6rem;
  border:1px solid var(--line);border-radius:2px;
  background:var(--slab);min-width:12rem;flex:1;max-width:22rem;
}
input[type=search]:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* ---------- count bar ---------- */
#bar{
  flex:0 0 auto;
  background:var(--slab);
  border-bottom:1px solid var(--line);
  padding:.4rem 1rem;
  font-size:.73rem;color:var(--muted);
  display:flex;gap:.9rem;align-items:center;
  overflow-x:auto;white-space:nowrap;
}
#bar b{color:var(--ink);font-weight:600}
#bar button{
  font-size:.7rem;padding:.16rem .5rem;margin-left:auto;flex:0 0 auto;
}
.dot{width:.5rem;height:.5rem;border-radius:50%;display:inline-block;margin-right:.3rem}

/* ---------- table ---------- */
/* The scroll container is here, not the page, so sticky positions resolve
   against this box. That is what makes the header hold still. */
.wrap{
  flex:1 1 auto;
  overflow:auto;
  background:var(--slab);
  -webkit-overflow-scrolling:touch;
}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:60rem}
th,td{padding:.42rem .6rem;text-align:left;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);font-weight:700;
  background:var(--slab);
  position:sticky;top:0;z-index:5;cursor:pointer;
  border-bottom:1px solid var(--line);
}
th:hover{color:var(--ink)}
th .ar{color:var(--accent)}
td.num{text-align:right}
tr:hover td{background:#f6f8fb}

/* SKU and ASIN both stay visible while scrolling sideways. They belong
   together: one searches Seller Central, the other opens the live page. */
th:first-child,td:first-child{
  position:sticky;left:0;background:var(--slab);z-index:4;
  min-width:8.5rem;max-width:8.5rem;
}
th:nth-child(2),td:nth-child(2){
  position:sticky;left:8.5rem;background:var(--slab);z-index:4;
  box-shadow:1px 0 0 var(--line-soft);
}
th:first-child,th:nth-child(2){z-index:6}
tr:hover td:first-child,tr:hover td:nth-child(2){background:#f6f8fb}

/* the quiet stock line under a SKU */
.stk{
  display:block;margin-top:.12rem;
  font-size:.64rem;letter-spacing:.01em;color:var(--muted);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  text-decoration:none;
}
.stk::before{
  content:'';display:inline-block;
  width:.36rem;height:.36rem;border-radius:50%;
  margin-right:.28rem;vertical-align:middle;background:var(--muted);
}
.s-ok::before{background:var(--ok)}
.s-low::before{background:#c8912e}
.s-low{color:#8a6417}
.s-oos::before{background:var(--warn)}
.s-oos{color:var(--warn);font-weight:600}

td.id{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:3px;text-decoration-color:var(--line)}
td.id:hover{color:var(--accent);text-decoration-color:var(--accent)}
td.id:hover .stk{color:inherit}

@media(max-width:640px){
  th:first-child,td:first-child{min-width:7rem;max-width:7rem}
  th:nth-child(2),td:nth-child(2){left:7rem}
}

td.name{white-space:normal;min-width:14rem;max-width:24rem;font-size:.82rem}

/* group headers */
tr.gh td{
  background:var(--accent-soft);
  border-bottom:1px solid var(--line);
  border-top:1px solid var(--line);
  font-weight:600;font-size:.8rem;
  position:sticky;top:1.6rem;z-index:3;
}
tr.gh td:first-child{background:var(--accent-soft)}
tr.gh .cnt{color:var(--muted);font-weight:400;font-size:.75rem}
tr.gh .tw{display:inline-block;width:.9rem;color:var(--accent)}

/* pills */
.pill{
  display:inline-block;padding:.05rem .38rem;border-radius:2px;
  font-size:.66rem;font-weight:700;letter-spacing:.04em;
  border:1px solid currentColor;
}
.b-byd{color:var(--byd)}
.b-sb{color:var(--sb)}
.tier{
  display:inline-block;min-width:1.3rem;text-align:center;
  padding:.05rem .3rem;border-radius:2px;
  font-size:.68rem;font-weight:700;
  background:var(--ink);color:#fff;
}
.tier.tC,.tier.tX{background:var(--muted)}

.warn{color:var(--warn);font-weight:600}
.ok{color:var(--ok)}
.mut{color:var(--muted)}

/* price indicators */
.ind{
  display:inline-block;width:.62rem;height:.62rem;border-radius:50%;
  border:1px solid rgba(0,0,0,.18);
}
.i-ok{background:var(--ok)}
.i-bad{background:var(--warn)}
.i-warn{background:#c8912e}
.i-none{background:transparent;border:1px dashed var(--line)}
td.ind-cell{text-align:center}

#legend{
  padding:.35rem 1rem .6rem;font-size:.7rem;color:var(--muted);
  display:flex;gap:1rem;flex-wrap:wrap;align-items:center;
}
#legend .ind{margin-right:.25rem;vertical-align:middle}

#msg{padding:2.5rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;flex:1 1 auto}
#msg b{display:block;color:var(--ink);font-size:1rem;margin-bottom:.3rem}

/* On a narrow screen the secondary columns are hidden so the ones that
   matter fit without sideways scrolling. "All columns" in the count bar
   brings them back. */
@media(max-width:820px){
  table.trim .opt{display:none}
  table.trim{min-width:0}
}

@media(max-width:640px){
  .lbl{min-width:100%;margin-bottom:.1rem}
  #panel{padding:.6rem .7rem;max-height:62dvh}
  header{padding:.5rem .7rem;gap:.5rem}
  header h1{font-size:.68rem;letter-spacing:.14em}
  #meta{font-size:.66rem;flex:1 1 100%;order:3}
  #bar{padding:.4rem .7rem;gap:.7rem}
  th,td{padding:.5rem .5rem}
  td.name{min-width:10rem;font-size:.8rem}
}

/* =====================================================================
   THEME. One look across every view, taken from the review monitor and
   the rating tracker: a dark overview band with the day's numbers on top,
   then a light work area whose table has a dark header and colour-banded
   column groups, so price, rating, stock and checks read as separate
   instruments. Everything here overrides the plainer rules above.
   ===================================================================== */
:root{
  --night:#15181d; --night2:#1d2128; --night-line:#2b313a; --night-mut:#8a94a3;
  --band-rate:#1f6b4f; --band-price:#22456f; --band-check:#4e3a8e;
  --band-case:#7c2f28; --band-stock:#3d4a57;
  --id:#2257a5;
}
body{background:#eef1f5}

/* header */
header{background:var(--night);padding:.7rem 1.25rem;gap:.6rem;border-bottom:1px solid var(--night-line)}
header h1{font-size:.95rem;letter-spacing:.02em;text-transform:none;font-weight:800}
header h1::after{content:"";display:inline-block;width:.42rem;height:.42rem;border-radius:50%;
  background:#3fbf7f;margin-left:.45rem;vertical-align:middle}
#meta{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.72rem}
#toggle,#fs,#homeBtn,#quickCat,#casesBtn,#catalogBtn,#cptBtn{
  font-size:.8rem;padding:.38rem .8rem;border-radius:7px;border-color:var(--night-line);color:#dfe5ee}
#homeBtn[aria-pressed="true"],#quickCat[aria-pressed="true"],#casesBtn[aria-pressed="true"],
#catalogBtn[aria-pressed="true"],#cptBtn[aria-pressed="true"]{background:#2c4f7c;border-color:#4a76b0;color:#fff}

/* overview band */
#ov{background:var(--night);color:#e8edf3;padding:1.05rem 1.25rem 1.15rem;flex:0 0 auto}
#ov[hidden]{display:none}
.ov-head{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;margin-bottom:.9rem}
.ov-head h2{font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
.ov-head .sub{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.76rem;color:var(--night-mut)}
.ov-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(11.5rem,1fr));gap:.7rem}
.ov-tile{background:var(--night2);border:1px solid var(--night-line);border-radius:8px;padding:.75rem .9rem;min-width:0}
.ov-tile .k{font-size:.78rem;color:var(--night-mut);margin-bottom:.3rem}
.ov-tile .v{font-size:1.75rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.ov-tile .v.bad{color:#ff8a73}
.ov-tile .v.warn{color:#f2c46b}
.ov-tile .v.good{color:#6fd3a3}
.ov-tile .n{font-size:.76rem;color:var(--night-mut);margin-top:.28rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:700px){ .ov-tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .ov-tile .v{font-size:1.4rem} }

/* filter panel: a light toolbar card */
#panel{background:#fff;border-bottom:1px solid var(--line);padding:.85rem 1.25rem}
.lbl{text-transform:none;letter-spacing:0;font-size:.78rem;font-weight:600;color:var(--muted);min-width:6.5rem}
button{border-radius:7px}
.seg{border-radius:7px}
.seg button{border-radius:0}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button.act{border-color:var(--line);font-weight:600}
button.act:hover{background:var(--accent);border-color:var(--accent)}
input[type=search]{border-radius:7px}

/* the strip under the band: legend, notes, small controls */
#bar{background:#fff;border-bottom:1px solid var(--line);padding:.55rem 1.25rem;font-size:.8rem}
#bar:empty{display:none}

/* table */
.wrap{background:#fff}
th{
  background:var(--night);color:#fff;font-size:.72rem;letter-spacing:.02em;text-transform:none;
  padding:.75rem .7rem;border-bottom:0;
}
th:hover{color:#fff;filter:brightness(1.12)}
th .ar{color:#9fc3ff}
th.bd-rate{background:var(--band-rate)}
th.bd-price{background:var(--band-price)}
th.bd-check{background:var(--band-check)}
th.bd-case{background:var(--band-case)}
th.bd-stock{background:var(--band-stock)}
th:first-child,th:nth-child(2){background:var(--night)}
td{padding:.7rem .7rem;border-bottom:1px solid var(--line-soft)}
tr:hover td{background:#f5f8fb}
td.mono.id{color:var(--id);font-weight:600}
td.name{font-weight:600;color:var(--ink)}
tr.gh td{background:#f3f5f9;color:var(--ink);font-weight:700;font-size:.82rem;padding:.6rem .7rem;
  border-bottom:1px solid var(--line)}
tr.gh td:first-child{background:#f3f5f9;box-shadow:inset 3px 0 0 var(--accent)}
.tier{border-radius:5px;min-width:1.5rem;padding:.12rem .35rem;font-size:.72rem}
.pill{border-radius:5px;padding:.1rem .45rem}
.ind{width:.85rem;height:.85rem}
button.work{border-radius:7px;padding:.3rem .7rem}
#msg{background:#fff}

/* detail sheet */
#detail{border-radius:12px}
@media(min-width:701px){ #detail{border-radius:12px} }
#detail h2{letter-spacing:.04em}
#detail .why{border-radius:6px}
th.bd-check{text-align:center}
#bar .ind{vertical-align:-1px;margin-right:.3rem}
/* checklist: the status dot needs a narrow first column, not the SKU width */
table.chk th:first-child,table.chk td:first-child{min-width:3rem;max-width:3rem;width:3rem;text-align:center}
table.chk th:nth-child(2),table.chk td:nth-child(2){left:3rem;text-align:left;width:100%}
table.chk td.name{font-size:.92rem}
table.chk tr.gh td{text-align:left;max-width:none;width:auto}

/* Parent family header, as in the rating tracker: a violet band across the
   whole table with the parent's name first and its IDs and totals after.
   The catalog pins its first column, which squeezed this header into the
   SKU width and hid it, so the band opts out of that. */
tr.pgh td{
  position:static !important;min-width:0 !important;max-width:none !important;
  white-space:normal;text-align:left;
  background:linear-gradient(90deg,#ede9fe,#f6f4ff) !important;
  border-top:2px solid #c4b5fd;border-bottom:1px solid #c4b5fd;
  box-shadow:inset 5px 0 0 #7c3aed !important;padding:.7rem .9rem .7rem 1.1rem !important;
}
.pgh-name{font-size:.95rem;font-weight:800;color:#3b1d8f}
.pgh-meta{display:flex;flex-wrap:wrap;gap:.35rem .9rem;margin-top:.3rem;font-size:.78rem;color:#5b3fb5}
.pgh-meta b{font-weight:700}
.pgh-meta .k{color:#7d6bbf;margin-right:.25rem}
.pgh-meta a{color:#5b21b6;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.pgh-meta .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.pgh-tag{padding:.05rem .45rem;border-radius:5px;font-weight:700}
.pgh-tag.bad{background:#fbe7e3;color:var(--warn)}
.pgh-tag.ok{background:#e4f3ee;color:var(--ok)}
tr.pgh.solo td{background:linear-gradient(90deg,#eef1f5,#f7f8fa) !important;border-color:var(--line);
  box-shadow:inset 5px 0 0 #64748b !important}
tr.pgh.solo .pgh-name{color:#334155}
tr.pgh.solo .pgh-meta{color:#64748b}
</style>
</head>
<body>

<header>
  <h1>ALM Console</h1>
  <span id="meta">Loading</span>
  <button id="homeBtn">Checklist</button>
  <button id="quickCat">Category</button>
  <button id="casesBtn">Cases</button>
  <button id="cptBtn">CPT tracker</button>
  <button id="catalogBtn">Catalog</button>
  <button id="toggle" aria-expanded="true">Filters</button>
  <button id="fs" title="Fullscreen">Full screen</button>
</header>
<section id="ov" hidden></section>

<div id="panel">

  <div class="grp">
    <span class="lbl">Data</span>
    <button class="act" id="bRefresh">Refresh data</button>
    <button class="act" id="bCsv">Download CSV</button>
    <button class="act" id="bReset">Reset all filters</button>
    <input type="search" id="q" placeholder="Search SKU, ASIN, product, parent">
  </div>

  <div class="grp">
    <span class="lbl">Marketplace</span>
    <div class="seg" id="mkSeg">
      <button data-mk="US" aria-pressed="true">US</button>
      <button data-mk="CA" aria-pressed="false">CA</button>

  </div>

  <div class="grp">
    <span class="lbl">SKU status</span>

  </div>

  <div class="grp">
    <span class="lbl">SKU tier</span>
    <button id="tierAll" aria-pressed="true">All tiers</button>

  <div class="grp">
    <span class="lbl">Parent tier</span>

  <div class="grp">
    <span class="lbl">Stock</span>
    <button data-stock="oos" aria-pressed="false">Out of stock</button>

  <div class="grp">

      <button data-group="psku" aria-pressed="false">Parent SKU</button>

</div>

<div id="split" title="Drag to resize, double click to reset"></div>

<div id="bar"></div>
<div id="msg">Loading catalog</div>
<div class="wrap" id="cptView" hidden></div>
<div class="wrap" id="mainWrap"><table id="tbl" hidden>
  <thead><tr id="hrow"></tr></thead>
  <tbody id="tbody"></tbody>
</table></div>

<div id="veil" hidden>
  <div id="detail" role="dialog" aria-modal="true"></div>
</div>

<script>
const SRC = 'https://raw.githubusercontent.com/mjbaguhin/cpc-tracker/main/data.json';

// ALM Console Data, published to web as CSV. Carries all 831 Plytix SKUs
// with status, tier, parents, and US and CA stock and prices. data.json
// supplies rating, reviews and BSR for the active ones.
const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJzdMWKepuICHrxxJXuYxMJPiRIh7iifhDaRLHhb6j57Motm4XMyS0GIPqqM_tzbVY1drpOXslDbH-/pub?gid=1429581451&single=true&output=csv';

// Category tab of the same sheet, published separately.
// Open cases, normalised out of the case tracker
const PUB_CASES = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJzdMWKepuICHrxxJXuYxMJPiRIh7iifhDaRLHhb6j57Motm4XMyS0GIPqqM_tzbVY1drpOXslDbH-/pub?gid=403229889&single=true&output=csv';

// Daily Competitive Price Threshold per ASIN, written by CPT Watch in the
// CPC Keepa Fetcher project. Same repo as data.json.
const CPT_SRC = 'https://raw.githubusercontent.com/mjbaguhin/cpc-tracker/main/cpt.json';

// Other brands' coir mats in our sizes: Amazon from Keepa (weekly), plus the
// Outside Amazon tab (Walmart, Wayfair, Temu and so on, added by hand).
const SIM_SRC = 'https://raw.githubusercontent.com/mjbaguhin/cpc-tracker/main/similar.json';

// Amazon's case creation entry point
const CASE_URL = 'https://sellercentral.amazon.com/help/center?redirectSource=HelpHub';

const PUB_CAT = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRJzdMWKepuICHrxxJXuYxMJPiRIh7iifhDaRLHhb6j57Motm4XMyS0GIPqqM_tzbVY1drpOXslDbH-/pub?gid=619932151&single=true&output=csv';

// Tier priority. Used to derive a parent tier from its children.
const TIER_RANK = {A:0, B:1, N:2, C:3, X:4};

// Filters are drawn from these fixed lists, not from the loaded data, so the
// controls are always visible even before data.json arrives or if it fails.
// Display ORDER hints only, not the list of chips. Chips are built from the
// values actually present in the data, so anything real is filterable and
// anything absent never appears. Hardcoding this list is how "In Dev"
// became a button that matched nothing.
const TIERS  = ['A','B','N','C','X'];
const STATUS = ['Active','In Development','Inactive'];
const BRANDS = [['Barnyard Designs','BYD'], ['Seedboy','SB']];

/* Values present in the data, ordered by the hint above, with anything
   unexpected appended rather than dropped. */
function present(key, order){
  const seen = [...new Set(ROWS.map(r=>r[key]).filter(Boolean))];
  const rank = v =>{ const i = order.indexOf(v); return i === -1 ? 99 : i; };
  return seen.sort((a,b)=> rank(a) - rank(b) || String(a).localeCompare(b));
}

const COLS = [
  {k:'sku',    t:'SKU',       cls:'mono id'},
  {k:'asin',   t:'ASIN',      cls:'mono id'},
  {k:'name',   t:'Product',   cls:'name'},
  {k:'brand',  t:'Brand',     opt:true},
  {k:'status', t:'Status'},
  {k:'tier',   t:'Tier'},
  {k:'ptier',  t:'P.Tier',    opt:true},
  {k:'cur',    t:'Rating',    num:true},
  {k:'d30',    t:'30D',       num:true, opt:true},
  {k:'rev',    t:'Reviews',   num:true, opt:true},
  {k:'bsr',    t:'BSR',       num:true, opt:true},
  {k:'avail',  t:'Available', num:true, opt:true},
  {k:'inbound',t:'Inbound',   num:true, opt:true},
  {k:'health', t:'Health',    opt:true},
  {k:'list',   t:'List',  ind:'list'},
  {k:'sale',   t:'Sale',  ind:'sale'},
  {k:'feat',   t:'Feat',  ind:'feat'},
  {k:'psku',   t:'Parent SKU',cls:'mono', opt:true},
  {k:'pasin',  t:'Parent ASIN',cls:'mono', opt:true},
  {k:'parent', t:'Parent name', opt:true}
];

let ROWS = [];
let META = {};
const S = {
  mk:'US', allCols:false, view:'checklist', checks:null, taskName:'',
  brands:new Set(), statuses:new Set(), tiers:new Set(), ptiers:new Set(),
  stock:new Set(), price:new Set(),
  group:'none', q:'', sort:'sku', dir:1, open:new Set()
};

/* ---------- load ---------- */

let PUBROWS = [];

/* Two stage. The published sheets are small and carry everything the
   checklist and category views need, so they paint first. data.json is much
   the largest file, holds 180 days of rating history per ASIN, and supplies
   only four columns, so waiting on it before showing anything was the main
   reason this felt slow. */
async function load(fresh){

  msg('Loading');

  const [pub, cat, cas] = await Promise.all([
    grab(PUB, 'text', fresh).catch(e => ({err:'ALM Console Data: ' + e.message})),
    PUB_CAT ? grab(PUB_CAT, 'text', fresh).catch(e => ({err:e.message}))
            : Promise.resolve(null),
    PUB_CASES ? grab(PUB_CASES, 'text', fresh).catch(e => ({err:e.message}))
              : Promise.resolve(null)
  ]);

  if(pub && pub.err){
    msg('Could not load ALM Console Data', pub.err +
        '. Check the sheet is still published: File, Share, Publish to web.');
    return;
  }

  buildCategory(cat);
  buildCases(cas);
  PUBROWS = csvParse(pub);
  build({}, PUBROWS, 'ratings loading');

  // CPT feed is small and independent, so it never holds up the first paint
  grab(CPT_SRC, 'json', fresh)
    .then(j => { buildCpt(j); if(S.view === 'cpt') render(); else chrome(); })
    .catch(e => { CPT_ERR = e.message; if(S.view === 'cpt') render(); });
  grab(SIM_SRC, 'json', fresh)
    .then(j => { SIM = (j && j.items) || []; SIM_META = {updated: j && j.updated || ''};
                 if(S.view === 'cpt') render(); })
    .catch(e => console.warn('similar.json unavailable:', e.message));

  // Ratings arrive after the first paint and trigger a rebuild
  grab(SRC, 'json', fresh)
    .then(j => build(j, PUBROWS, ''))
    .catch(e => {
      console.warn('data.json unavailable:', e.message);
      build({}, PUBROWS, 'ratings unavailable');
    });
}


/* ---------- category audit ---------- */

let CAT = [];   // one entry per SKU and country, with its four checks

function buildCategory(text){
  CAT = [];
  if(!text || text.err) {
    if(text && text.err) console.warn('Category feed:', text.err);
    return;
  }

  const byKey = {};

  csvParse(text).forEach(r=>{
    const sku = (r.SKU || '').trim();
    if(!sku) return;

    const key = sku + '|' + (r.Country || '');
    if(!byKey[key]){
      byKey[key] = {
        sku, country:(r.Country || '').trim(), asin:(r.ASIN || '').trim(),
        status:(r.Status || '').trim(), tier:(r.Tier || '').trim(),
        name:r.Name || '', caseId:(r.CaseID || '').trim(),
        caseDate:(r.CaseDate || '').trim(), caseNotes:r.CaseNotes || '',
        checks:{}
      };
      CAT.push(byKey[key]);
    }

    byKey[key].checks[(r.Check || '').trim()] = {
      state:(r.Healthy || 'unknown').trim(),
      expected:(r.Expected || '').trim(),
      actual:(r.Actual || '').trim()
    };
  });
}

// Which short day it is now, in ET, since that is the working day the rest
// of the catalogue runs on rather than wherever the browser happens to be.
function todayShort(){
  const d = new Date().toLocaleDateString('en-US',
              {weekday:'short', timeZone:'America/New_York'});
  return d.slice(0,3);
}

/* Rows with at least one failing check, honouring the filter rail.
   The category feed carries country, status and tier but not brand, so
   brand is resolved from the catalog rows by SKU. Ignoring the filters
   here was a bug: the marketplace toggle read US while CA rows showed. */
function catFailing(applyFilters, checkSet){

  const set = checkSet || S.checks || CHECKS;

  const brandOf = {};
  if(applyFilters !== false && S.brands.size){
    ROWS.forEach(r=>{ if(r.sku) brandOf[r.sku] = r.brand; });
  }

  const q = S.q.toLowerCase();

  return CAT.filter(c=>{

    if(!set.some(k=> c.checks[k] && c.checks[k].state === 'bad')) return false;
    if(applyFilters === false) return true;

    if(c.country && c.country !== S.mk) return false;
    if(S.brands.size && !S.brands.has(brandOf[c.sku])) return false;
    if(S.statuses.size && !S.statuses.has(c.status)) return false;
    if(S.tiers.size && !S.tiers.has(c.tier)) return false;

    if(q && !(c.sku+' '+c.asin+' '+c.name).toLowerCase().includes(q)) return false;

    return true;
  });
}

/* The cache is only bypassed on an explicit refresh. Busting it on every
   load meant re-downloading everything each time the page opened. */
async function grab(url, as, fresh){
  const u = fresh ? url + (url.includes('?') ? '&' : '?') + 't=' + Date.now() : url;
  const r = await fetch(u, fresh ? {cache:'no-store'} : {});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return as === 'json' ? r.json() : r.text();
}

/* Minimal CSV reader. Handles quoted fields, embedded commas, escaped
   quotes and CRLF, which product titles and descriptions all contain. */
function csvParse(text){
  const rows = [];
  let row = [], val = '', q = false;

  for(let i = 0; i < text.length; i++){
    const ch = text[i];

    if(q){
      if(ch === '"'){
        if(text[i+1] === '"'){ val += '"'; i++; }
        else q = false;
      } else val += ch;
      continue;
    }

    if(ch === '"')       { q = true; }
    else if(ch === ',')  { row.push(val); val = ''; }
    else if(ch === '\n') { row.push(val); rows.push(row); row = []; val = ''; }
    else if(ch !== '\r') { val += ch; }
  }
  if(val !== '' || row.length){ row.push(val); rows.push(row); }

  if(!rows.length) return [];
  const head = rows[0].map(h => h.trim());
  return rows.slice(1).filter(r => r.length > 1).map(r=>{
    const o = {};
    head.forEach((h,i)=> o[h] = (r[i] === undefined ? '' : r[i]));
    return o;
  });
}

function build(j, pub, warnNote){

  const d = j.data || {};

  // The inventory file dates ride along on every row, so the age of the
  // stock data can be shown without publishing anything extra.
  const src = k => { const r = pub.find(x=> (x[k] || '').trim()); return r ? r[k].trim() : ''; };

  META = {
    when: j.fetched_at_et || j.fetched_at || 'unknown',
    tokens: j.tokens_left, skus: pub.length, note: warnNote || '',
    srcUs: src('US_Source'), srcCa: src('CA_Source')
  };

  // Parent tier: the strongest tier among children sharing a parent SKU.
  const ptier = {};
  pub.forEach(r=>{
    const ps = (r.ParentSKU || '').trim();
    if(!ps) return;
    const rank = TIER_RANK[(r.Tier || '').trim()];
    if(rank === undefined) return;
    if(ptier[ps] === undefined || rank < ptier[ps]) ptier[ps] = rank;
  });
  const rankTier = {};
  Object.keys(TIER_RANK).forEach(k=> rankTier[TIER_RANK[k]] = k);

  ROWS = pub.map(r=>{
    const asin = (r.ASIN || '').trim();
    const x    = d[asin] || {};
    const cur  = num(x.cur), r30 = num(x.r30);
    const ps   = (r.ParentSKU || '').trim();

    return {
      sku:(r.SKU || '').trim(), asin,
      name:r.Name || '', brand:(r.Brand || '').trim(),
      status:(r.Status || '').trim(), tier:(r.Tier || '').trim(),
      ptier: ps && ptier[ps] !== undefined ? rankTier[ptier[ps]] : '',

      cur, d30: (cur!==null && r30!==null) ? Math.round((cur-r30)*10)/10 : null,
      rev:num(x.rev), bsr:num(x.bsr),

      // Both marketplaces held at once. applyMk copies the active set into
      // the plain fields the table, filters and sort all read.
      usAvail:num(r.US_Available), usInbound:num(r.US_Inbound), usHealth:r.US_Health || '',
      usList:num(r.US_List), usSale:num(r.US_Sale), usFeat:num(r.US_Feat),
      caAvail:num(r.CA_Available), caInbound:num(r.CA_Inbound), caHealth:'',
      caList:num(r.CA_List), caSale:num(r.CA_Sale), caFeat:num(r.CA_Feat),

      psku:ps, pasin:(r.ParentASIN || '').trim(), parent:r.ParentName || ''
    };
  });

  applyMk();

  // Rebuild every chip row from what the data actually contains, so no
  // phantom buttons and nothing real left unfilterable.
  const st  = present('status', STATUS);
  const tvs = [...new Set(present('tier', TIERS).concat(present('ptier', TIERS)))];

  chips('statusBox','statuses','statusAll', st);
  chips('tierBox',  'tiers',   'tierAll',   tvs);
  chips('ptierBox', 'ptiers',  'ptierAll',  tvs);

  // If a value vanished between refreshes, drop it from the active filter
  // rather than leaving a selection that silently matches nothing.
  [['statuses', st], ['tiers', tvs], ['ptiers', tvs]].forEach(([k, ok])=>{
    [...S[k]].forEach(v=>{ if(!ok.includes(v)) S[k].delete(v); });
  });

  render();
}

/* Copies the selected marketplace's stock and price onto the generic
   fields, so nothing downstream has to know which marketplace is active. */
function applyMk(){
  const p = S.mk === 'CA' ? 'ca' : 'us';
  ROWS.forEach(r=>{
    r.avail   = r[p+'Avail'];
    r.inbound = r[p+'Inbound'];
    r.health  = r[p+'Health'];
    r.list    = r[p+'List'];
    r.sale    = r[p+'Sale'];
    r.feat    = r[p+'Feat'];
  });

  const n = ROWS.filter(r=> r.list !== null).length;
  const el = document.getElementById('mkNote');
  if(el) el.textContent = n + ' SKUs with ' + S.mk + ' price data' +
    (S.mk === 'CA' ? ', and CA has no health column' : '');
}

const num = v => (v===null||v===undefined||v===''||isNaN(Number(v))) ? null : Number(v);

/* How old a yyyy-mm-dd stamp is, in whole days, against today in ET. Used to
   say plainly when the stock and prices on screen are not from today. */
function ageDays(stamp){
  if(!stamp) return null;
  const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/New_York'});
  const a = Date.parse(today), b = Date.parse(stamp);
  if(isNaN(a) || isNaN(b)) return null;
  return Math.round((a - b) / 86400000);
}

/* One short line about where the stock numbers came from and how stale they
   are. Silent when the file is current, because a note you always see is a
   note you stop reading. */
function sourceNote(){
  const stamp = S.mk === 'CA' ? META.srcCa : META.srcUs;
  if(!stamp) return '';
  const d = ageDays(stamp);
  if(d === null) return '';
  if(d <= 0) return `<span class="mut">stock from today</span>`;
  const stale = d > 2;
  return `<span class="${stale ? 'warn' : 'mut'}">stock from ${esc(stamp)}`+
         `, ${d} day${d===1?'':'s'} old${stale ? '' : ''}</span>`;
}

/* ---------- price indicators ----------
   These are our own definitions, not a copy of Amazon's icons. Amazon's
   tooltip wording does not match the numbers it appears next to, so
   reproducing it would mean guessing. What each circle means here is
   stated in the legend and in the cell tooltip, so it can be trusted. */

// List price present and above zero.
function stList(r){
  return r.list > 0 ? 'ok' : 'bad';
}

// Sale price present and genuinely below the list price.
function stSale(r){
  if(!(r.sale > 0))  return 'none';        // no sale set
  if(!(r.list > 0))  return 'warn';        // sale with no list price to compare
  return r.sale < r.list ? 'ok' : 'bad';   // bad means the sale is not a discount
}

// Our price is at or below the featured offer, so we are competitive.
// Compared against the price we actually sell at, which is the sale price
// when one is running, not the list price. Comparing list against featured
// made almost every row red, because the featured offer reflects the
// discounted price.
function stFeat(r){
  if(!(r.feat > 0)) return 'none';         // no featured offer on the ASIN
  const our = r.sale > 0 ? r.sale : r.list;
  if(!(our > 0)) return 'none';
  return our <= r.feat + 0.005 ? 'ok' : 'bad';
}

const IND = {list:stList, sale:stSale, feat:stFeat};

/* Stock, shown as a small line under the SKU. Deliberately quiet: a dot and
   a number, muted unless something is wrong. Out of stock is the only state
   that earns colour, since that is the one worth spotting mid scroll. */
/* The category feed carries no stock, but the catalog rows do and both are
   keyed by SKU. So it is joined here rather than republished. Country is
   taken from the category row itself, not the marketplace toggle, because a
   CA row should show CA stock even while looking at US. */
function stockFor(sku, country){
  const r = ROWS.find(x=> x.sku === sku);
  if(!r) return null;
  const p = country === 'CA' ? 'ca' : 'us';
  return { avail:r[p+'Avail'], inbound:r[p+'Inbound'], health:r[p+'Health'] };
}

function stockLine(st){
  if(!st) return '';
  const s2 = stockState({avail:st.avail, health:st.health});
  if(s2 === 'none') return '';
  return `<span class="stk s-${s2}">${st.avail}`+
         (s2 === 'oos' && st.inbound > 0 ? ` \u00b7 ${st.inbound} in` : '')+
         '</span>';
}

function stockState(r){
  if(r.avail === null || r.avail === undefined) return 'none';
  if(r.avail === 0) return 'oos';
  if(/low/i.test(r.health || '')) return 'low';
  return 'ok';
}

const IND_TITLE = {
  list:{ok:'List price set', bad:'List price is empty or zero'},
  sale:{ok:'Sale price is below list price', bad:'Sale price is not below list price',
        warn:'Sale price set but no list price to compare', none:'No sale price set'},
  feat:{ok:'Our selling price is at or below the featured offer',
        bad:'Our selling price is above the featured offer',

/* What a red price circle actually means, and whose job it is. Pricing is

  feat:{ title:'Featured offer',

    fix:'Pricing is Haris\u2019s, so this is one to flag rather than change.' }

const uniq = a => [...new Set(a.filter(Boolean))].sort(
  (x,y)=>(TIER_RANK[x]??9)-(TIER_RANK[y]??9) || String(x).localeCompare(y));

// vals may be plain values or [value, label] pairs.
function chips(boxId, key, allBtnId, vals){
  const box = document.getElementById(boxId);
  box.innerHTML = '';
  vals.forEach(item=>{
    const v = Array.isArray(item) ? item[0] : item;
    const l = Array.isArray(item) ? item[1] : item;
    const b = document.createElement('button');
    b.textContent = l;
    b.dataset.v = v;
    b.setAttribute('aria-pressed', S[key].has(v));
    b.onclick = ()=>{
      S[key].has(v) ? S[key].delete(v) : S[key].add(v);
      b.setAttribute('aria-pressed', S[key].has(v));
      document.getElementById(allBtnId).setAttribute('aria-pressed', S[key].size === 0);
      render();
    };
    box.appendChild(b);
  });
}

/* ---------- filter ---------- */

function visible(){
  const q = S.q.toLowerCase();
  return ROWS.filter(r=>{
    if(S.brands.size && !S.brands.has(r.brand)) return false;
    if(S.statuses.size && !S.statuses.has(r.status)) return false;
    if(S.tiers.size  && !S.tiers.has(r.tier))   return false;
    if(S.ptiers.size && !S.ptiers.has(r.ptier)) return false;

    if(S.stock.size){
      let hit = false;
      if(S.stock.has('oos')     && r.avail === 0) hit = true;
      if(S.stock.has('in')      && r.avail > 0)   hit = true;
      if(S.stock.has('inbound') && r.inbound > 0) hit = true;
      if(!hit) return false;
    }

    if(S.price.size){
      let hit = false;
      if(S.price.has('nolist')  && stList(r) === 'bad') hit = true;
      if(S.price.has('nosale')  && stSale(r) === 'none') hit = true;
      if(S.price.has('badsale') && stSale(r) === 'bad') hit = true;
      if(S.price.has('nofeat')  && stFeat(r) === 'bad') hit = true;
      if(!hit) return false;
    }

    if(q && !(r.sku+' '+r.asin+' '+r.name+' '+r.psku+' '+r.pasin+' '+r.parent)
              .toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    const x = a[S.sort], y = b[S.sort];
    if(x === null && y === null) return 0;
    if(x === null) return 1;            // blanks always sink
    if(y === null) return -1;
    return (typeof x === 'number' ? x-y : String(x).localeCompare(String(y))) * S.dir;
  });
}

/* ---------- checklist ---------- */

function renderChecklist(){

  const tbl = document.getElementById('tbl');
  const tb  = document.getElementById('tbody');

  const today = todayShort();
  const done  = TASKS.filter(t=> t.checks && catFailing(true, t.checks).length === 0).length;

  // What is actually due today: everything daily plus today's own tasks
  const dueToday = TASKS.filter(t=> t.day === 'Daily' || t.day === today);
  const openToday = dueToday.reduce((s,t)=> s + (t.checks ? catFailing(true, t.checks).length : 0), 0);

  const nCatAll = catFailing(true, CHECKS).length;
  const dueN = dueToday.length;
  overview('Checklist', `${esc(DAY_FULL[today] || today)}, ${esc(S.mk)} marketplace`, [
    ['To do today', openToday, openToday ? 'bad' : 'good',
       openToday ? 'Across ' + dueN + ' tasks due today' : 'Nothing due today'],
    ['Tasks clear', `${done}<span style="font-size:1rem;color:var(--night-mut)"> of ${TASKS.length}</span>`,
       done === TASKS.length ? 'good' : '', 'Tasks with live checks and nothing open'],
    ['Category issues', nCatAll, nCatAll ? 'bad' : 'good', 'All five category checks'],
    ['Open cases', CASES.length, CASES.length ? 'warn' : '', 'From the case tracker']
  ]);
  document.getElementById('bar').innerHTML =
    '<span class="mut">Tap a row to open the task in ClickUp. Tap the count to work through it.</span>';

  if(!CAT.length){
    tbl.hidden = true;
    msg('No check data', 'Run buildCategoryData in almPublishCat, then publish '+
        'the Category tab and set PUB_CAT.');
    return;
  }

  document.getElementById('msg').hidden = true;
  tbl.hidden = false;
  tbl.className = 'chk';

  document.getElementById('hrow').innerHTML =
    ['', 'Task', 'To do'].map(h=>`<th>${h}</th>`).join('');

  // Group by day, in a fixed order, with anything unrecognised at the end
  const groups = {};
  TASKS.forEach((t,i)=>{
    const d = DAY_ORDER.indexOf(t.day) === -1 ? 'Unscheduled' : t.day;
    (groups[d] = groups[d] || []).push(i);
  });

  let html = '';

  DAY_ORDER.forEach(day=>{

    const list = groups[day];
    if(!list || !list.length) return;

    const n = list.reduce((s,i)=> s + (TASKS[i].checks
                ? catFailing(true, TASKS[i].checks).length : 0), 0);
    const isToday = (day === today) || day === 'Daily';

    html += `<tr class="gh"><td colspan="3">`+
      `${esc(DAY_FULL[day] || day)}`+
      (isToday ? ' <span class="ok" style="font-size:.72rem">\u00b7 today</span>' : '')+
      ` <span class="cnt">${n ? n + ' to do' : 'clear'}</span></td></tr>`;

    list.forEach(i=>{
      const t = TASKS[i];

      // No checks array means the console has no data for this task yet, so
      // it shows as a reminder rather than a misleading zero.
      if(!t.checks){
        html += '<tr class="task" data-i="'+i+'">'+
          '<td class="ind-cell"><span class="ind i-none"></span></td>'+
          `<td class="name">${esc(t.name)} <span class="go">\u2197</span></td>`+
          '<td class="num mut" style="font-size:.72rem">no data yet</td>'+
          '</tr>';
        return;
      }

      const n2      = catFailing(true, t.checks).length;
      const unknown = CAT.filter(c=> t.checks.some(k=>
                        c.checks[k] && c.checks[k].state === 'unknown')).length;

      html += '<tr class="task" data-i="'+i+'">'+
        `<td class="ind-cell"><span class="ind i-${n2 ? 'bad' : 'ok'}"></span></td>`+
        `<td class="name"><b>${esc(t.name)}</b> <span class="go">\u2197</span>`+
          (unknown && !n2 ? `<br><span class="mut" style="font-size:.75rem">`+
            `${unknown} not evaluated</span>` : '')+
        '</td>'+
        `<td class="num">`+
          (n2 ? `<button class="work" data-i="${i}">${n2} to do</button>`
              : '<span class="ok">clear</span>')+
        '</td>'+
        '</tr>';
    });
  });

  tb.innerHTML = html;
  wireIds(tb);

  // The row is the task, so tapping it opens the task in ClickUp, where it
  // can be closed. The count is the way into the work itself.
  [...tb.querySelectorAll('tr.task')].forEach(el=> el.onclick = ()=>{
    const t = TASKS[+el.dataset.i];
    window.open('https://app.clickup.com/t/' + t.id, '_blank', 'noopener');
  });

  [...tb.querySelectorAll('button.work')].forEach(b=> b.onclick = e=>{
    e.stopPropagation();
    const t = TASKS[+b.dataset.i];
    S.checks = t.checks;
    S.taskName = t.name;
    S.view = 'category';
    render();
  });
}

let CASES = [];

const CASE_TYPES = ['Category','Listing copy','Review removal','Removal order','Other'];

function buildCases(text){
  CASES = [];
  if(!text || text.err){
    if(text && text.err) console.warn('Cases feed:', text.err);
    return;
  }
  CASES = csvParse(text).map(r=>({
    type:(r.Type || 'Other').trim(),
    status:(r.Status || '').trim(),
    id:(r.CaseID || '').trim(),
    opened:(r.Opened || '').trim(),
    age:num(r.AgeDays),
    marketplace:(r.Marketplace || '').trim(),
    sku:(r.SKU || '').trim(),
    asin:(r.ASIN || '').trim(),
    summary:(r.Summary || '').trim(),
    link:(r.Link || '').trim(),
    tab:(r.Tab || '').trim()
  })).filter(c=> c.id || c.sku || c.summary);
}

/* A case open this long is almost certainly forgotten rather than pending.
   Worth saying so, since the tracker gave no way to see it. */
const CASE_STALE = 90;
const CASE_DEAD  = 270;

function caseState(c){
  if(c.age === null) return 'none';
  if(c.age >= CASE_DEAD)  return 'bad';
  if(c.age >= CASE_STALE) return 'warn';
  return 'ok';
}

function renderCases(){

  const tbl = document.getElementById('tbl');
  const tb  = document.getElementById('tbody');

                    'ASIN':c=> c.asin, 'Summary':c=> c.summary, 'Status':c=> c.status};
  // Default: grouped by type, oldest first. A chosen column shows one flat list.
  const rows = XS.sort ? sortBy(CASES, CASE_GET[XS.sort], XS.dir) : CASES.slice().sort((a,b)=>{
    const ta = CASE_TYPES.indexOf(a.type), tb2 = CASE_TYPES.indexOf(b.type);
    if(ta !== tb2) return (ta===-1?99:ta) - (tb2===-1?99:tb2);
    return (b.age === null ? -1 : b.age) - (a.age === null ? -1 : a.age);
  });

  const stale = rows.filter(c=> caseState(c) === 'warn').length;
  const dead  = rows.filter(c=> caseState(c) === 'bad').length;

  const byT = {};
  rows.forEach(c=>{ byT[c.type] = (byT[c.type] || 0) + 1; });
  const topT = Object.keys(byT).sort((a,b)=> byT[b] - byT[a])[0];

    ['Open cases', rows.length, rows.length ? 'warn' : 'good', topT ? 'Most are ' + esc(topT.toLowerCase()) : 'Nothing open'],
    ['Over ' + CASE_STALE + ' days', stale + dead, stale + dead ? 'warn' : 'good', 'Likely forgotten, not pending'],
    ['Over ' + CASE_DEAD + ' days', dead, dead ? 'bad' : 'good', 'Close or reopen these'],
    ['Oldest open', oldest >= 0 ? oldest + 'd' : '\u2014', oldest >= CASE_DEAD ? 'bad' : '', 'Days since it was opened']
  ]);
  document.getElementById('bar').innerHTML =
    '<span class="mut">Tap a case to open it in Seller Central. Tap a column header to sort.</span>'+
    (XS.sort ? '<button id="caseUnsort">Back to grouped by type</button>' : '');
  const cu = document.getElementById('caseUnsort');
  if(cu) cu.onclick = ()=>{ XS.sort = ''; XS.dir = 1; render(); };

  if(!rows.length){
    tbl.hidden = true;
    msg('No open cases', CASES.length ? 'Everything in the tracker is closed.'
        : 'Run buildCaseList in almPublishCases, then publish the Cases tab.');
    return;
  }

  document.getElementById('msg').hidden = true;
  tbl.hidden = false;
  tbl.className = '';

  document.getElementById('hrow').innerHTML =
    ['Case ID','Age','Type','SKU','ASIN','Summary','Status']
      .map(h=>`<th data-s="${h}" data-d="${h === 'Age' ? 'desc' : 'asc'}">${esc(h)}${sortArrow(XS, h)}</th>`).join('');
  wireSort(document.getElementById('hrow'), XS, render);

  let html = '', lastType = null;

  rows.forEach(c=>{

    if(!XS.sort && c.type !== lastType){
      const n = rows.filter(x=> x.type === c.type).length;
      html += `<tr class="gh"><td colspan="7">${esc(c.type)}`+
              ` <span class="cnt">${n}</span></td></tr>`;
      lastType = c.type;
    }

    const st = caseState(c);

    html += `<tr class="case" data-link="${esc(c.link)}" data-id="${esc(c.id)}">`+
      `<td class="mono id2">${c.id ? esc(c.id.slice(0,60)) : '<span class="mut">no case id</span>'}</td>`+
      `<td class="num"><span class="${st==='bad'?'warn':st==='warn'?'':'mut'}"`+
        `${st==='warn'?' style="color:#8a6417"':''}>`+
        `${c.age === null ? '\u2014' : c.age + 'd'}</span></td>`+
      `<td class="mut">${esc(c.type)}</td>`+
      `<td class="mono">${esc(c.sku.slice(0,40))}</td>`+
      `<td class="mono">${esc(c.asin.slice(0,40))}</td>`+
      `<td class="name">${esc(c.summary.slice(0,120))}</td>`+
      `<td class="mut">${esc(c.status.slice(0,40))}</td>`+
      '</tr>';
  });

  tb.innerHTML = html;

  [...tb.querySelectorAll('tr.case')].forEach(el=> el.onclick = ()=>{
    const id = el.dataset.id.replace(/[^0-9]/g, '');
    const link = el.dataset.link ||
      (id ? 'https://sellercentral.amazon.com/cu/case-dashboard/view-case?caseID=' + id : '');
    if(link) window.open(link, '_blank', 'noopener');
  });
}


/* ---------- CPT tracker ---------- */

/* One row per ASIN from cpt.json: today's Competitive Price Threshold, our
   live offer price as Keepa saw it (sale included), the Buy Box price, and up
   to 120 days of both. If Keepa has no price for us, the US columns of ALM
   Console Data are the fallback. */
let CPT = [], CPT_META = {}, CPT_ERR = '';
let SIM = [], SIM_META = {};

/* Size of one of our mats, read from its name: "(30x48, Border)" -> 30x48.
   A 17x30 mat is compared with 18x30 too, the common market size. */
function matSize(text){
  const t = String(text || '').replace(/[\u201d\u2033]/g, '"');
  const m = t.match(/(\d{2})\s*(?:"|in)?\s*[xX\u00d7]\s*(\d{2})/);
  if(!m) return '';
  const a = +m[1], b = +m[2];
  return Math.min(a,b) + 'x' + Math.max(a,b);
}
/* Size of one of our listings. The name is tried first ("(30x48, Border)").
   Coir mats are named by length only ("Border 36\" Coir Mat"), so their SKU
   suffix decides, matching the reference sheet: no suffix 17x30, -36 24x36,
   -48 30x48, -72 36x72. Anything else falls back to its length in inches. */
const COIR_SIZE = {'': '17x30', '36': '24x36', '48': '30x48', '72': '36x72'};
function sizeOf(name, sku){
  const full = matSize(name);
  if(full) return full;
  const m = /^DMC-[A-Z]+(?:-(\d{2}))?$/i.exec(sku || '');
  if(m) return COIR_SIZE[m[1] || ''] || '';
  const inch = /(\d{2})\s*(?:"|\u201d|in\b)/.exec(name || '') || /-(\d{2})(?:-|$)/.exec(sku || '');
  return inch ? inch[1] + '"' : '';
}

function simFor(size){
  if(!size) return [];
  const sizes = size === '17x30' ? ['17x30','18x30'] : [size];
  return SIM.filter(x=> sizes.indexOf(x.size) !== -1 && num(x.price) !== null)
            .sort((a,b)=> a.price - b.price);
}
function median(a){
  if(!a.length) return null;
  const v = a.map(x=> +x.price).sort((x,y)=> x-y), m = Math.floor(v.length/2);
  return v.length % 2 ? v[m] : Math.round((v[m-1] + v[m]) / 2 * 100) / 100;
}
const CPT_RECENT = 7;   // a move inside this many days is flagged as recent

function buildCpt(j){
  CPT_ERR = '';
  CPT_META = {updated: j && j.updated || ''};
  CPT = ((j && j.rows) || []).map(r=>{
    const h = (r.h || []).filter(x=> x && x[0]).sort((a,b)=> a[0] < b[0] ? -1 : 1);
    // Last date the CPT changed, and what it changed from
    let moved = '', from = null;
    for(let i = h.length - 1; i > 0; i--){
      if(h[i][1] !== null && h[i-1][1] !== null && h[i][1] !== h[i-1][1]){
        moved = h[i][0]; from = h[i-1][1]; break;
      }
    }
    return {asin:r.asin, sku:r.sku || '', name:r.name || '', cpt:num(r.cpt), bb:num(r.bb),
            kOurs:num(r.ours), kList:num(r.list), cases:r.cases || [], mail:r.mail || null,
            date:r.d || '', h, moved, from};
  });
}

function ourPrice(asin){
  const row = ROWS.find(x=> x.asin === asin);
  if(!row) return null;
  const sale = row.usSale, list = row.usList;
  if(sale !== null && (list === null || sale < list)) return sale;
  return list;
}

const usd = v => v === null || v === undefined ? '\u2014' : '$' + Number(v).toFixed(2);

function daysSince(d){
  if(!d) return null;
  const t = new Date(d + 'T12:00:00');
  return isNaN(t) ? null : Math.round((Date.now() - t) / 86400000);
}

function cptRows(){
  return CPT.filter(c=> c.cpt !== null).map(c=>{
    const ours = c.kOurs !== null ? c.kOurs : ourPrice(c.asin);
    const gap  = ours !== null ? Math.round((ours - c.cpt) * 100) / 100 : null;
    const pct  = gap !== null && c.cpt ? Math.round(gap / c.cpt * 100) : null;
    // Match on SKU first: one ASIN can sit on more than one SKU row (US and CA
    // codes, old and new SKUs), and the wrong row brings the wrong prices
    const row  = (c.sku && ROWS.find(x=> x.sku === c.sku)) || ROWS.find(x=> x.asin === c.asin);
    const name = c.name || (row && row.name) || '';
    const size = sizeOf(name, c.sku || (row && row.sku) || '');
    // Similar mats only matter for listings held back by the CPT
    const rowList = row && row.usList !== null ? row.usList : (c.kList !== undefined ? c.kList : null);
    const heldNow = !(gap > 0) && rowList !== null && c.cpt && (rowList - c.cpt) / c.cpt * 100 >= 10;
    const sim  = (gap !== null && gap > 0) || heldNow ? simFor(size) : [];
    const r = Object.assign({}, c, {ours, gap, pct, size, sim, simLow: sim.length ? sim[0] : null,
      sku: c.sku || (row && row.sku) || '', name,
      sale: row ? row.usSale : null,
      list: row && row.usList !== null ? row.usList : (c.kList !== undefined ? c.kList : null),
      tier: row ? (row.tier || '') : '', avail: row ? row.usAvail : null,
      parent: row ? (row.parent || '') : '', psku: row ? (row.psku || '') : '', pasin: row ? (row.pasin || '') : ''});
    // Held down: we already dropped the price to the CPT to keep the Buy Box,
    // so we look fine today but sell well under our regular (list) price.
    r.listGap = (r.list !== null && r.list !== undefined) ? Math.round((r.list - r.cpt) * 100) / 100 : null;
    r.listPct = r.listGap !== null && r.list ? Math.round(r.listGap / r.list * 100) : null;
    r.belowPct = r.gap > 0 && r.ours ? Math.round(r.gap / r.ours * 100) : null;   // CPT under our price
    r.target   = saleTarget(r);
    r.short    = r.target !== null ? Math.round((r.target - r.cpt) * 100) / 100 : null;   // CPT under the sale price
    r.shortPct = r.short !== null && r.target ? Math.round(r.short / r.target * 100) : null;
    r.held = r.target !== null
      ? !(r.gap > 0) && r.short > 0.005
      : !(r.gap > 0) && r.listGap !== null && r.listPct >= CASE_RULES.heldPct;
    r.verdict = caseVerdict(r);
    r.action = cptAction(r);
    return r;
  }).sort((a,b)=>{
    const ra = ACTIONS[a.action].rank, rb = ACTIONS[b.action].rank;
    if(ra !== rb) return ra - rb;
    const ua = a.gap > 0 ? a.pct : (a.held ? a.listPct : -1e9);
    const ub = b.gap > 0 ? b.pct : (b.held ? b.listPct : -1e9);
    return ub - ua;
  });
}

/* ---------- case finder ----------
   Which flagged listings are worth a case with Amazon, rather than a price
   change. The idea: a case can only win when the CPT is WRONG, meaning the bot
   matched us to a different or smaller product. Each signal below points to a
   wrong match, and the points add up to a verdict. Change the numbers in
   CASE_RULES to tune it. */
const CASE_RULES = {
  bigGapPct:   20,   // our price is this % or more above the CPT: +2
  midGapPct:   10,   // this % or more: +1
  belowSimPct: 0,    // CPT is below the cheapest similar same-size mat: +2
  medianPct:   15,   // CPT is this % or more under the similar median: +1
  dropPct:     10,   // CPT fell this % or more in the last dropDays: +1
  dropDays:    14,
  heldPct:     10,   // CPT is this % or more under our list price while we sit at it
  strong:      4,    // points for "Strong case"
  possible:    2     // points for "Possible case"
};

function openCaseFor(asin){
  return CASES.find(c=> c.asin && c.asin === asin) || null;
}

/* What MJ needs to do with a listing. One rule, the one Haris works by:
   if we had to cut the price to the CPT to keep selling (or are stuck above
   it), and the CPT is 10% or more under our regular price, it needs a case.
   A case already on file (case tracker, or the Cases column of the
   Reference Pricing tab) turns that into a follow-up. */
/* Haris, Oct 15: compare the CPT with our SALE price for the size, not the
   list price. Your Price on Amazon is higher and matches Walmart and Shopify,
   and it is fine to lead the email with it, but the case is about getting the
   CPT up to at least the sale price. Coir doormats (DMC- SKUs) only. */
const SALE_TARGET = {'17x30': 24.95, '24x36': 49.95, '30x48': 69.95, '36x72': 119.95};
function saleTarget(r){
  return /^DMC-/i.test(r.sku || '') && r.size && SALE_TARGET[r.size] ? SALE_TARGET[r.size] : null;
}

/* Amazon's latest email on a listing, from CPT Watch's morning Gmail check */
const MAIL_KIND = {
  rejected: ['Rejected',          'm-bad'],
  resolved: ['Closed by Amazon',  'm-bad'],
  replied:  ['Amazon replied',    'm-warn'],
  received: ['Received, waiting', 'm-wait'],
  waiting:  ['Waiting on Amazon', 'm-wait'],
  fixed:    ['Fixed',             'm-ok']
};
function mailLine(r){
  const m = r.mail;
  if(!m || !MAIL_KIND[m.kind]) return '';
  const k = MAIL_KIND[m.kind];
  const when = m.days === 0 ? 'today' : m.days === 1 ? 'yesterday' : m.days + ' days ago';
  return `<span class="mailst ${k[1]}">${k[0]}${m.needsReply ? ', reply' : ''} <span>${when}</span></span>`;
}

const ACTIONS = {
  open:   {rank:0, label:'Open a case',        group:'Open a case with Amazon'},
  follow: {rank:1, label:'Follow up',          group:'Follow up on the case on file'},
  watch:  {rank:2, label:'Price to target',    group:'Priced above the CPT, no case needed'},
  none:   {rank:3, label:'',                   group:'No action'}
};
function cptAction(r){
  const onFile = (r.cases && r.cases.length) ? r.cases : (openCaseFor(r.asin) ? [openCaseFor(r.asin).id] : []);
  r.caseIds = onFile;
  // Coir: any CPT under our sale price for the size needs a case ("we want the CPT up anyways")
  if(r.target !== null){
    if(r.short > 0.005) return onFile.length ? 'follow' : 'open';
    return r.gap > 0 ? 'watch' : 'none';
  }
  const under = r.gap > 0 ? r.pct : (r.held ? r.listPct : null);
  if(under !== null && under >= CASE_RULES.heldPct) return onFile.length ? 'follow' : 'open';
  if(r.gap > 0) return 'watch';
  return 'none';
}

function caseVerdict(r){
  const why = [];
  if(!(r.gap > 0) && !r.held) return {level:'none', label:'Not flagged', points:0, why};
  let pts = 0;

  const pct = r.target !== null ? r.shortPct : (r.gap > 0 ? r.pct : r.listPct);
  if(r.target !== null && r.short > 0)
    why.push(`CPT ${usd(r.cpt)} is ${usd(r.short)} (${r.shortPct}%) under our ${r.size} sale price of ${usd(r.target)}`);
  else if(r.held) why.push(`Held down: we lowered the price to ${usd(r.ours)} to keep the Buy Box, but our regular price is ${usd(r.list)}`);
  if(pct >= CASE_RULES.bigGapPct){ pts += 2; why.push(`${r.held ? 'Regular price' : 'Our price'} is ${pct}% above the CPT, too far for a normal price difference`); }
  else if(pct >= CASE_RULES.midGapPct){ pts += 1; why.push(`${r.held ? 'Regular price' : 'Our price'} is ${pct}% above the CPT`); }

  const same = (r.sim || []).filter(x=> x.market !== 'Amazon');
  const pool = same.length ? same : (r.sim || []);
  if(pool.length){
    const lo = pool[0].price, med = median(pool);
    if(r.cpt < lo * (1 - CASE_RULES.belowSimPct / 100)){
      pts += 2; why.push(`CPT ${usd(r.cpt)} is below every similar ${r.size} mat we found (cheapest ${usd(lo)}), so Amazon likely matched a smaller or different product`);
    } else if(med && r.cpt <= med * (1 - CASE_RULES.medianPct / 100)){
      pts += 1; why.push(`CPT is ${Math.round((1 - r.cpt / med) * 100)}% under the median similar ${r.size} mat (${usd(med)})`);
    }
  }

  // A recent drop usually means a new match, which is the easiest to dispute
  const cut = new Date(Date.now() - CASE_RULES.dropDays * 86400000).toISOString().slice(0,10);
  const before = (r.h || []).filter(x=> x[0] < cut && x[1] !== null).slice(-1)[0];
  if(before && before[1] && r.cpt <= before[1] * (1 - CASE_RULES.dropPct / 100)){
    pts += 1; why.push(`CPT dropped from ${usd(before[1])} to ${usd(r.cpt)} in the last ${CASE_RULES.dropDays} days`);
  }

  if(r.tier === 'A' || r.tier === 'B'){ pts += 1; why.push(`Tier ${r.tier}, worth the effort`); }
  if(r.avail === 0){ pts -= 1; why.push('Out of stock right now, lower priority'); }

  const open = openCaseFor(r.asin);
  if(open) return {level:'open', label:'Case open', points:pts, why, open};
  if(pts >= CASE_RULES.strong)   return {level:'strong',   label:'Strong case',   points:pts, why};
  if(pts >= CASE_RULES.possible) return {level:'possible', label:'Possible case', points:pts, why};
  return {level:'price', label:'Price fix', points:pts,
          why: why.concat(['Signals are weak, so a case is unlikely to win. This looks like a pricing call for Haris.'])};
}

/* Text for a case, built from the numbers on screen */
function caseEvidence(r){
  const pool = (r.sim || []).filter(x=> x.market !== 'Amazon');
  const lines = [
    `ASIN: ${r.asin}   SKU: ${r.sku}`,
    `Product: ${r.name}${r.size ? ' (' + r.size + ' inches)' : ''}`,
    ...(r.target !== null ? [
      r.list ? `Our regular price: ${usd(r.list)}` : `Our price: ${usd(r.ours)}`,
      `Our sale price for this size: ${usd(r.target)}`,
      `Competitive Price Threshold shown: ${usd(r.cpt)}, ${r.shortPct}% below even our sale price. ` +
        (r.ours <= r.cpt + 0.005 ? `We have had to cut the price to ${usd(r.ours)} to keep the Featured Offer.` : 'The listing cannot hold the Featured Offer at our sale price.')
    ] : [
      `Our price: ${usd(r.ours)}${r.list ? '   Regular (list) price: ' + usd(r.list) : ''}`,
      r.held ? `Competitive Price Threshold shown: ${usd(r.cpt)} (${r.listPct}% below our regular price). We cut our price to ${usd(r.ours)} to keep the Featured Offer.`
             : `Competitive Price Threshold shown: ${usd(r.cpt)} (${r.belowPct}% below our price)`
    ]),
  ];
  if(r.moved) lines.push('', `The threshold moved from ${usd(r.from)} to ${usd(r.cpt)} on ${r.moved}.`);
  if(pool.length){
    lines.push('', `Comparable ${r.size} coir doormats sold outside Amazon:`);
    pool.slice(0, 5).forEach(x=> lines.push(`- ${x.market}, ${x.brand || 'brand not listed'}: ${usd(x.price)}${x.link ? '  ' + x.link : ''}`));
  }
  const fair = r.size ? fairSiblings(r.size, [r.asin]) : [];
  // Other listings of the same size stuck at this exact threshold
  const twins = r.size ? cptRows().filter(x=> x.asin !== r.asin && x.size === r.size && x.cpt === r.cpt &&
                  (x.held || x.gap > 0) && (x.sku || '').split('-')[0] === (r.sku || '').split('-')[0]) : [];
  if(twins.length) lines.push('', `${twins.map(x=> 'ASIN ' + x.asin + ' (SKU ' + x.sku + ', ' + cptTitle(x) + ')').join(' and ')} `+
    `${twins.length > 1 ? 'are' : 'is'} held at the exact same ${usd(r.cpt)} threshold, although the design and price differ. `+
    'That points to one generic reference item, not a match to our product.');
  if(fair.length){
    lines.push('', siblingHead(fair, r.size, [r.cpt]));
    fair.slice(0, 6).forEach(x=> lines.push(`- ASIN ${x.asin} (SKU ${x.sku}, ${cptTitle(x)}): threshold ${usd(x.cpt)}`));
  }
  lines.push('', 'We believe the threshold is based on a product of a different size or construction. '+
    'Please re-validate the reference item against a ' + (r.size || 'same-size') + ' coir doormat and reset the threshold' +
    (r.target !== null ? ' to at least our sale price of ' + usd(r.target) + '.' : '.'));
  return lines.join('\n');
}

let CPT_SHOWN = [];

/* ---------- one-click actions: Gmail and Seller Central ----------
   No connection or password needed. Each button opens Gmail or Seller
   Central in a new tab with everything filled in, signed in as MJ's work
   account. Nothing is sent until MJ presses Send. */
const MAIL = {
  account: 'mj.baguhin@crosspathcap.com',
  jassy:   'ajassy@amazon.com',
  cc:      'jack@crosspathcap.com,sam@crosspathcap.com'   // as on the earlier Jassy emails
};
function gmailCompose(to, cc, subject, body){

function gmailSearch(terms){

    '#search/' + encodeURIComponent(terms.filter(Boolean).join(' OR '));
}
function caseLink(id){
